<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>The Break Room</title>
<style>
:root{
  --sky:#dcd6c6; --board:#f3eee2; --frame:#cfc5ae; --bulbOff:#b3a88c;
  --ink:#231e17; --dim:#463f31; --amber:#7a4a08; --cutink:#8c3406; --bulb:#6b5210;
  --btnink:#f6f1e6; --line:#b6ab92; --brick:#c6bea9;
}
/* KERNEL MOUNT 2026-08-23: the dusk and night values below were already correct,
   but reachable ONLY through html[data-comfort]. The studio comfort kernel drives
   dark with body.dusk / body.night, so comfort-gate measured this page at night
   luminance 0.674 and HALTed flat tick 1, which gated floor.yml, which gates
   deploy, which stopped Pages for EVERY project. Same values, both selectors. */
html[data-comfort="dusk"], body.dusk{ --sky:#a9a291; --board:#c0b8a5; --frame:#8f8878; --bulbOff:#7d7666;
  --ink:#141109; --dim:#241f15; --amber:#5a3706; --cutink:#652703; --bulb:#4a380a;
  --btnink:#f6f1e6; --line:#837c6c; --brick:#96907f; }
html[data-comfort="night"], body.night{ --sky:#141824; --board:#20242f; --frame:#2c3140; --bulbOff:#5a5238;
  --ink:#f4e9d2; --dim:#b9ab8e; --amber:#eab24c; --cutink:#f6a45e; --bulb:#f2c25a;
  --btnink:#20180c; --line:#3a4052; --brick:#262b38; }
*{box-sizing:border-box}
html,body{margin:0;background:var(--sky);color:var(--ink);
  font-family:"Iowan Old Style","Palatino Linotype",Palatino,Georgia,serif;
  font-size:20px;line-height:1.5;-webkit-text-size-adjust:100%}
body{min-height:100dvh}
.wrap{max-width:560px;margin:0 auto;padding:0 14px 40px}
header{display:flex;align-items:center;gap:8px;padding:10px 14px 4px;max-width:560px;margin:0 auto}
.brand{flex:1;font-size:18px;letter-spacing:.16em;text-transform:uppercase;color:var(--dim)}
button{font:inherit;color:var(--ink);background:var(--frame);border:2px solid var(--line);
  border-radius:10px;min-height:44px;padding:8px 13px;cursor:pointer}
button:focus-visible{outline:3px solid var(--amber);outline-offset:3px}
.ghost{background:transparent;color:var(--dim);font-size:18px;min-width:44px}
.ghost:hover{color:var(--ink)}
.ghost[aria-pressed="true"]{color:var(--ink);border-color:var(--amber)}

svg.sky{display:block;width:100%;height:auto;margin-top:4px}
@keyframes flick{0%,92%{opacity:.85}96%{opacity:.35}100%{opacity:.85}}
.win{animation:flick 7s ease-in-out infinite}
.win:nth-of-type(3n){animation-delay:2.4s}
.win:nth-of-type(4n){animation-delay:4.1s}

.sign{position:relative;background:var(--board);border:3px solid var(--frame);border-radius:12px;
  padding:26px 18px;margin-top:-10px;min-height:196px;display:flex;flex-direction:column;
  justify-content:center;overflow:hidden}
.bulbs{position:absolute;left:0;right:0;height:12px;background-image:radial-gradient(var(--bulbOff) 42%,transparent 46%);
  background-size:24px 12px;background-repeat:repeat-x;opacity:1}
.bulbs.top{top:5px} .bulbs.bot{bottom:5px}
.sign.beat .bulbs{background-image:radial-gradient(var(--bulb) 42%,transparent 46%)}
.crawl{font-size:26px;line-height:1.35;min-height:2.7em;letter-spacing:.01em}
.crawl .on{color:var(--ink)}
.crawl .arriving{color:var(--amber)}
.crawl .rest{color:var(--dim)}
.rule{height:3px;background:var(--cutink);margin:10px 0;border-radius:2px;width:100%}
.held{color:var(--cutink)}
.stamp{font-size:18px;letter-spacing:.12em;text-transform:uppercase;color:var(--dim);margin:0 0 8px}

.cut{width:100%;margin-top:16px;background:var(--amber);color:var(--btnink);border-color:var(--amber);
  font-size:24px;font-weight:700;min-height:68px;letter-spacing:.04em}
.cut:disabled{background:var(--frame);color:var(--dim);border-color:var(--line);font-weight:400}
.say{font-size:21px;margin:16px 0 0;min-height:2.4em}
.say b{color:var(--amber);font-weight:700}
.src{font-size:18px;color:var(--dim);margin:10px 0 0}
.nav{display:flex;gap:10px;margin-top:22px}
.nav button{flex:1}
.count{font-size:18px;color:var(--dim);letter-spacing:.1em}
</style>
</head>
<body>
<header>
  <span class="brand">The Break Room</span>
  <span class="count" id="count"></span>
  <button class="ghost" id="sound" aria-pressed="false">Bass</button>
  <button class="ghost" id="comfort" aria-label="Change the light">Matinee</button>
</header>

<div class="wrap">
  <svg class="sky" viewBox="0 0 560 150" aria-hidden="true">
    <rect width="560" height="150" fill="var(--sky)"/>
    <g fill="var(--brick)">
      <rect x="0" y="52" width="74" height="98"/><rect x="80" y="24" width="58" height="126"/>
      <rect x="146" y="66" width="86" height="84"/><rect x="240" y="12" width="64" height="138"/>
      <rect x="312" y="58" width="70" height="92"/><rect x="390" y="34" width="52" height="116"/>
      <rect x="450" y="72" width="110" height="78"/>
    </g>
    <g fill="var(--bulb)" opacity=".85">
      <rect class="win" x="12" y="66" width="9" height="12"/><rect class="win" x="34" y="66" width="9" height="12"/>
      <rect class="win" x="12" y="92" width="9" height="12"/><rect class="win" x="56" y="92" width="9" height="12"/>
      <rect class="win" x="94" y="40" width="9" height="12"/><rect class="win" x="116" y="40" width="9" height="12"/>
      <rect class="win" x="94" y="70" width="9" height="12"/><rect class="win" x="116" y="98" width="9" height="12"/>
      <rect class="win" x="162" y="82" width="9" height="12"/><rect class="win" x="196" y="82" width="9" height="12"/>
      <rect class="win" x="254" y="30" width="9" height="12"/><rect class="win" x="278" y="30" width="9" height="12"/>
      <rect class="win" x="254" y="60" width="9" height="12"/><rect class="win" x="278" y="88" width="9" height="12"/>
      <rect class="win" x="328" y="74" width="9" height="12"/><rect class="win" x="356" y="74" width="9" height="12"/>
      <rect class="win" x="404" y="50" width="9" height="12"/><rect class="win" x="420" y="78" width="9" height="12"/>
      <rect class="win" x="470" y="88" width="9" height="12"/><rect class="win" x="506" y="88" width="9" height="12"/>
      <rect class="win" x="540" y="88" width="9" height="12"/>
    </g>
    <g fill="var(--frame)"><rect x="238" y="120" width="88" height="30" rx="4"/></g>
  </svg>

  <div class="sign" id="sign">
    <div class="bulbs top"></div>
    <div class="bulbs bot"></div>
    <p class="stamp" id="stamp">Now reading</p>
    <div class="crawl" id="crawl"></div>
  </div>

  <button class="cut" id="cut">Cut the line</button>
  <p class="say" id="say">The words come one beat at a time. Cut wherever you want the line to end.</p>
  <p class="src" id="src"></p>

  <nav class="nav">
    <button class="ghost" id="back">Back</button>
    <button class="ghost" id="home">Home</button>
  </nav>
</div>

<script>
"use strict";
var POEMS = [
  { w:["When","I","see","birches","bend","to","left","and","right","Across","the","lines","of","straighter","darker","trees"],
    poet:9, ms:520,
    say:{9:"Frost's break. The birches just bend, and then the trees arrive.",
         4:"Too soon. The reader waits for a verb, and waiting is not turning.",
         16:"No break at all. One long line, one flat thought."},
    flat:[5,6,8,12,16],
    src:"Robert Frost, \u201cBirches\u201d (1916). Public domain." },
  { w:["He","will","not","see","me","stopping","here","To","watch","his","woods","fill","up","with","snow"],
    poet:7, ms:520,
    say:{7:"Frost's break. Line one is a man not being seen. Then it snows.",
         5:"Flat. You stopped where the grammar was already resting.",
         15:"No break. The secret and the snow arrive together, so neither lands."},
    flat:[3,5,10,15],
    src:"Robert Frost, \u201cStopping by Woods on a Snowy Evening\u201d (1923). Public domain." },
  { w:["Something","there","is","that","doesn't","love","a","wall","That","sends","the","frozen-ground-swell","under","it"],
    poet:8, ms:560,
    say:{8:"Frost's break. A whole belief, alone on a line. Then the frost explains it.",
         3:"Too soon. Something there is \u2014 is what? The reader stalls.",
         14:"No break. The belief and its cause blur into one breath."},
    flat:[3,6,11,14],
    src:"Robert Frost, \u201cMending Wall\u201d (1914). Public domain." }
];

var i=0, shown=0, timer=null, phase="stream", audio=null, soundOn=false;
var crawl=document.getElementById("crawl"), cutBtn=document.getElementById("cut"),
    say=document.getElementById("say"), src=document.getElementById("src"),
    sign=document.getElementById("sign"), stamp=document.getElementById("stamp"),
    countEl=document.getElementById("count");
var reduce = window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches;

function thump(){
  if(!soundOn) return;
  try{
    if(!audio) audio = new (window.AudioContext||window.webkitAudioContext)();
    var o=audio.createOscillator(), g=audio.createGain();
    o.type="sine"; o.frequency.value=72;
    g.gain.setValueAtTime(0.0001,audio.currentTime);
    g.gain.exponentialRampToValueAtTime(0.32,audio.currentTime+0.012);
    g.gain.exponentialRampToValueAtTime(0.0001,audio.currentTime+0.20);
    o.connect(g); g.connect(audio.destination); o.start(); o.stop(audio.currentTime+0.22);
  }catch(e){}
}
function pulse(){
  sign.className="sign beat"; thump();
  setTimeout(function(){ sign.className="sign"; }, 120);
}
function paint(){
  var p=POEMS[i], html="";
  for(var k=0;k<p.w.length;k++){
    if(k<shown-1) html+='<span class="on">'+p.w[k]+'</span> ';
    else if(k===shown-1) html+='<span class="arriving">'+p.w[k]+'</span> ';
  }
  crawl.innerHTML=html;
}
function stream(){
  var p=POEMS[i];
  timer=setTimeout(function tick(){
    if(phase!=="stream") return;
    shown++; paint(); pulse();
    if(shown>=p.w.length){ cutBtn.textContent="Let it run"; }
    if(shown<p.w.length) timer=setTimeout(tick,p.ms);
    else { phase="full"; }
  }, POEMS[i].ms);
}
function start(){
  clearTimeout(timer); phase="stream"; shown=0;
  countEl.textContent="Line "+(i+1)+" of "+POEMS.length;
  stamp.textContent="Now reading";
  crawl.innerHTML=""; say.textContent="The words come one beat at a time. Cut wherever you want the line to end.";
  src.textContent=""; cutBtn.disabled=false; cutBtn.textContent="Cut the line";
  window.scrollTo(0,0); stream();
}
function esc(t){return t.replace(/&/g,"&amp;").replace(/</g,"&lt;");}

function doCut(){
  if(phase==="done"){ i=(i+1)%POEMS.length; start(); return; }
  clearTimeout(timer);
  var p=POEMS[i], at=Math.max(1,shown);
  phase="held";
  stamp.textContent="Line one, alone";
  crawl.innerHTML='<span class="held">'+esc(p.w.slice(0,at).join(" "))+'</span><div class="rule"></div>';
  cutBtn.disabled=true; say.textContent="";
  setTimeout(function(){
    stamp.textContent="Then the next line arrives";
    crawl.innerHTML='<span class="held">'+esc(p.w.slice(0,at).join(" "))+'</span><div class="rule"></div>'+
                    '<span class="rest">'+esc(p.w.slice(at).join(" "))+'</span>';
    var line = p.say[at] || (p.flat.indexOf(at)>-1
        ? "Flat. Line one ends where the sentence was pausing anyway."
        : "The reader stalls mid-phrase \u2014 waiting, not believing.");
    say.innerHTML = esc(line) + (at===p.poet ? "" :
       ' <b>Frost cut after \u201c'+esc(p.w[p.poet-1])+'.\u201d</b>');
    src.textContent=p.src;
    cutBtn.disabled=false; cutBtn.textContent="Next line";
    phase="done";
  }, reduce ? 400 : 1500);
}
cutBtn.addEventListener("click", doCut);
document.addEventListener("keydown", function(e){
  if(e.key===" "||e.key==="Enter"){
    if(document.activeElement && document.activeElement.tagName==="BUTTON") return;
    e.preventDefault(); if(!cutBtn.disabled) doCut();
  }
});
document.getElementById("sound").addEventListener("click", function(){
  soundOn=!soundOn; this.setAttribute("aria-pressed", soundOn?"true":"false");
  this.textContent = soundOn ? "Bass on" : "Bass";
  if(soundOn) thump();
});
var STOPS=["default","dusk","night"], LBL={default:"Matinee",dusk:"Dusk",night:"Night"}, ci=0;
document.getElementById("comfort").addEventListener("click", function(){
  ci=(ci+1)%STOPS.length;
  document.documentElement.setAttribute("data-comfort",STOPS[ci]);
  this.textContent=LBL[STOPS[ci]];
});
document.getElementById("back").addEventListener("click", function(){
  i=(i-1+POEMS.length)%POEMS.length; start();
});
document.getElementById("home").addEventListener("click", function(){ i=0; start(); });
start();
</script>
</body>
</html>
