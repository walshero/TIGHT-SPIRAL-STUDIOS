<!DOCTYPE html><html lang="en"><head><meta charset="utf-8">
<title>Canary: scene art out-glowing its type</title>
<style>
 body{background:#111;margin:0}
 .stage{position:relative;height:220px;background:#101018;overflow:hidden}
 .blaze{position:absolute;left:0;right:0;bottom:0;height:60%;background:#fff6e0}
 .line{position:absolute;left:10px;top:40px;color:#6b5a34;font:700 20px monospace}
</style></head><body>
<!-- The scene's own fill is brighter than the text on it. TYPE-DOMINANCE must catch this. -->
<div class="stage"><div class="blaze"></div><div class="line">the poem nobody can read</div></div>
</body></html>
