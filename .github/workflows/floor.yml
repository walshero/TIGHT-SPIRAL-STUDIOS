name: Studio Eyes — Accessibility Floor

# THE GATE. Fires on every push. Tight Spiral Productions.
# Accessibility is a hard floor, not a preference.
#
# REPORT MODE (2026-07-11): the eyes RUN and REPORT but do not yet BLOCK.
# Reason: 104 pre-existing HALTs (real long-tail defects: muted-gray captions,
# sub-44px tap targets, invisible focus, about.html dead link). Blocking today
# would freeze the live site over a backlog, not a regression.
#
# >>> ARMED 2026-07-14. The teeth are real. <<<
# Disarmed 2026-07-11 over 104 pre-existing HALTs. The corpus now has 23 — the reason
# expired and the exception outlived it. Audit mode is a PHASE, not a DESTINATION.
# It RATCHETS: the 23 are baselined and do not block; anything NEW that fails DOES.
# Debt can only shrink. Fix a file and it leaves the baseline forever.
#
# A gate that does not block is not a gate. This is a KNOWN, DATED, SCHEDULED
# exception — not a policy. (os-block-triple-sweep.md)

on:
  push:
    branches: ['**']      # every branch spins the belt. The belt must not depend on the PR
                          # 'synchronize' event: a parse-failed run once wedged it, and feature
                          # pushes then fired NO run until hand-cranked (2026-07-27). Push is the
                          # reliable trigger; PR checks still attach to the head-branch push run.
  workflow_dispatch:      # fire by hand from the phone

# Auto-cancel superseded runs on feature/PR branches (fast feedback, no runner pile-up) — but
# NEVER on main: main runs the Pages deploy, and cancelling a superseded main run could skip a
# deploy (GitHub Actions best practice, researched 2026-07-27).
concurrency:
  group: floor-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  floor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install the eyes
        run: |
          # WeasyPrint is the render-proof sweep's renderer. It was MISSING in CI until 2026-07-27 —
          # so studio-eyes-sweep.py exited 2 (blind) and the ratchet passed on nothing. Its system
          # deps (pango/cairo/harfbuzz) are not pulled by playwright's --with-deps, so install them.
          sudo apt-get update -qq && sudo apt-get install -y -qq \
            libpango-1.0-0 libpangoft2-1.0-0 libpangocairo-1.0-0 libharfbuzz0b libcairo2 libgdk-pixbuf-2.0-0 libffi-dev
          pip install --quiet playwright weasyprint
          playwright install --with-deps chromium
          npm install --silent axe-core@4.10.2   # pinned + reproducible; injected offline by axe-audit.py (no CDN)

      - name: STUDIO EYES — full report (never blocks; the whole picture)
        run: python3 studio-eyes-sweep.py .
        continue-on-error: true

      - name: THE RATCHET — FIRST SIGHTED RUN (observe-only). Blind in CI until 2026-07-27 (no WeasyPrint); re-arm blocking after an honest re-baseline from this real render.
        run: python3 ratchet.py
        continue-on-error: true      # TEMPORARY: the eyes just gained sight; the 2026-07-14 baseline predates today's corpus, so observe the true debt here, then re-init + flip back to blocking.

      - name: CANON GUARD — the SSOT loop, ENFORCED (index in sync, wiring matches, no stale refs). Blocks.
        run: |
          python3 canon-guard.py --self-test
          python3 canon-guard.py --workflows
          python3 canon-guard.py --check-index
          python3 canon-guard.py --wiring
          python3 canon-guard.py --refs
          python3 canon-guard.py --gates
          python3 canon-guard.py --vocab

      - name: CANON GUARD — decay report (never blocks; flags roles overdue for re-verify)
        run: python3 canon-guard.py --stale
        continue-on-error: true

      - name: STUDIO EYES v3 — JS/dynamic-state gate (real browser; report until proven green in CI)
        run: |
          python3 studio-eyes/studio-eyes.py --self-test
          python3 studio-eyes/studio-eyes.py index.html
        continue-on-error: true

      - name: AXE-CORE — industry a11y engine, now INVOKED (names/roles/ARIA/landmarks; report)
        run: python3 axe-audit.py index.html choose-your-leader-v5.html the-console.html reading-the-fireground.html
        continue-on-error: true

      - name: CONTRAST-PLUS — APCA + WCAG 1.4.11 non-text, the gaps WCAG-2.x-text misses (report)
        run: |
          python3 contrast-plus.py --self-test
          python3 contrast-plus.py index.html choose-your-leader-v5.html the-console.html
        continue-on-error: true

      - name: STAGING SANDBOX (BLOCKING) — render-truth floor on the proven-green build. RATIFIED 2026-07-27 (founder go, 0 FLAGs). This one refuses.
        run: |
          python3 staging-sandbox.py --self-test
          python3 staging-sandbox.py --strict --shots-dir studio-eyes-shots index.html

      - name: STAGING SANDBOX (report) — the rest of the corpus, not yet green; advisory until its landmark/tap debt clears and it earns promotion.
        run: python3 staging-sandbox.py --shots-dir studio-eyes-shots choose-your-leader-v5.html the-console.html reading-the-fireground.html
        continue-on-error: true

      - name: Screenshots — every screen, light + dark, iPhone 390x844
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: studio-eyes-screens
          path: studio-eyes-shots/
          retention-days: 30

  deploy:
    needs: floor
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - name: Stamp the deployment (lets Site Watch tell live from stale)
        run: |
          printf '{"sha":"%s","ref":"%s","run":"%s","built":"%s"}\n' \
            "$GITHUB_SHA" "$GITHUB_REF_NAME" "$GITHUB_RUN_ID" "$(date -u +%FT%TZ)" > version.json
      - uses: actions/upload-pages-artifact@v3
        with:
          path: '.'
      - id: deployment
        uses: actions/deploy-pages@v4
