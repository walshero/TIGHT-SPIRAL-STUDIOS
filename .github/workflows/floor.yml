name: Studio Eyes — Accessibility Floor

# THE GATE. Fires on every push. Tight Spiral Productions.
# Accessibility is a hard floor, not a preference.
#
# REPORT MODE (2026-07-11): the eyes RUN and REPORT but do not yet BLOCK.
# Reason: 104 pre-existing HALTs (real long-tail defects: muted-gray captions,
# sub-44px tap targets, invisible focus, about.html dead link). Blocking today
# would freeze the live site over a backlog, not a regression.
#
# >>> ARMED 2026-07-14. The teeth are real. <<<
# Disarmed 2026-07-11 over 104 pre-existing HALTs. The corpus now has 23 — the reason
# expired and the exception outlived it. Audit mode is a PHASE, not a DESTINATION.
# It RATCHETS: the 23 are baselined and do not block; anything NEW that fails DOES.
# Debt can only shrink. Fix a file and it leaves the baseline forever.
#
# A gate that does not block is not a gate. This is a KNOWN, DATED, SCHEDULED
# exception — not a policy. (os-block-triple-sweep.md)
#
# MERGED 2026-08-08 — real teeth, not passive lip service. Founder's direct
# instruction after finding this repo ran TWO separate, disagreeing CI systems on
# every push: this file (ratchet.py + comfort-audit.mjs, hard-blocking, but its
# deploy job DEPLOYED ANYWAY on failure via `if: always()`) and studio-belt.yml
# (the belt's 5 ratcheted ticks, no deploy step of its own, running in parallel).
# Two Chromium installs, two ratchets, two baseline files, for one founder claim.
# One workflow now. What changed, concretely:
#   - ratchet.py + comfort-audit.mjs RETIRED from CI. They checked real things,
#     but the belt's ticks 1 and 3 (comfort-gate.py, preship-gate-v4.py) do the
#     same job with per-repo-qualified baselines that are actively maintained
#     today — floor-baseline.json (ratchet.py's) has not been touched since
#     2026-07-26; gate-baseline.json (the belt's) was re-seeded 2026-08-07.
#     Keeping both running was redundancy, not redundant safety — two gates that
#     can disagree is a founder with two dashboards to reconcile, not one to trust.
#   - The belt (all 5 ratcheted ticks) now runs INLINE in this job, not as a
#     separate workflow. studio-belt.yml deleted — its only job was calling the
#     same belt this file now calls directly.
#   - DEPLOY IS RE-COUPLED. `if: always() &&` removed. A failing floor now
#     actually stops the deploy — that is what "real teeth" means. This was
#     verified safe before landing: a full belt run against the live corpus
#     (all ~130 HTML surfaces) passed clean or debt-carried, zero HALTs, the
#     same day this change was made. If a future push needs the emergency
#     valve back, that is a founder call, made in the open, not a silent default.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:      # fire by hand from the phone

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  floor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: MATT-EYES LANE GATE — no private material on the public street. Blocks; fails fast.
        run: python3 matt-eyes-lane-check.py .

      - name: FUNES TENDRILS — loose ends down every forking path (report; never blocks)
        run: python3 funes-tendrils.py .
        continue-on-error: true

      - name: SECRET-SCAN GATE — no committed secrets (report for now; arm to blocking later)
        run: python3 secret-scan-gate.py .
        continue-on-error: true

      - name: CANON FRESHNESS — resident-doc claims vs live reality (report; never blocks)
        run: python3 canon-freshness.py .
        continue-on-error: true

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install the eyes (render-proof + belt toolchain, one install for both)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq libpango-1.0-0 libpangoft2-1.0-0 libharfbuzz-subset0
          pip install --quiet 'weasyprint==69.0' pillow playwright
          playwright install --with-deps chromium

      - name: STUDIO EYES — full report (never blocks; the whole picture)
        run: python3 studio-eyes-sweep.py .
        continue-on-error: true

      # ── The two gates that measure a page in the states a PLAYER reaches, wired in
      # 2026-09-01. Both existed, both were self-tested, and neither ran on a push:
      # Flok shipped its research card sliced through the middle for weeks with every
      # blocking tick green, because every tick grades FIRST PAINT and that card sits
      # behind three clicks. REPORT ONLY, deliberately — the belt below is the blocking
      # authority, and arming a new floor on a corpus with standing debt is how a tick
      # becomes something everyone scrolls past. Scoped to what the push changed, per
      # the cost ruling: a 40-click crawl across 115 surfaces is not a per-push expense.
      - name: Changed surfaces on this push
        id: changed
        run: |
          BEFORE='${{ github.event.before }}'
          case "$BEFORE" in ''|0000000000000000000000000000000000000000) BEFORE=HEAD~1;; esac
          CHANGED=$(git diff --name-only "$BEFORE" '${{ github.sha }}' -- '*.html' 2>/dev/null \
                    | grep -v '^studio-eyes/canary/' || true)
          echo "list<<EOF" >> "$GITHUB_OUTPUT"; echo "$CHANGED" >> "$GITHUB_OUTPUT"; echo "EOF" >> "$GITHUB_OUTPUT"
          echo "changed surfaces:"; echo "${CHANGED:-  (none)}"
        continue-on-error: true

      - name: STUDIO EYES v3 — self-test (only when the auditor itself moved)
        run: |
          git diff --name-only '${{ github.event.before }}' '${{ github.sha }}' 2>/dev/null \
            | grep -q '^studio-eyes/' || { echo "auditor unchanged — self-test skipped"; exit 0; }
          python3 studio-eyes/studio-eyes.py --self-test
        continue-on-error: true

      - name: STUDIO EYES v3 — JS/dynamic-state floors incl. CLIPPED TEXT (report)
        run: |
          FILES='${{ steps.changed.outputs.list }}'
          [ -n "$FILES" ] || { echo "no changed surfaces"; exit 0; }
          python3 studio-eyes/studio-eyes.py --no-self-test $FILES
        continue-on-error: true

      - name: PLAYTHROUGH — clipped text in every state the crawler reaches (report)
        run: |
          FILES='${{ steps.changed.outputs.list }}'
          [ -n "$FILES" ] || { echo "no changed surfaces"; exit 0; }
          python3 playthrough-agent.py $FILES
        continue-on-error: true

      - name: THE STUDIO BELT — 5 ratcheted ticks. THIS ONE REFUSES.
        run: bash studio-belt.sh .

      - name: Screenshots — every screen, light + dark, iPhone 390x844
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: studio-eyes-screens
          path: studio-eyes-shots/
          retention-days: 30

  deploy:
    needs: floor
    # COUPLED 2026-08-08. A failing floor blocks deploy — that is the whole
    # point of a gate. (History: coupled 2026-07-14 -> decoupled 2026-07-28 over
    # the render-proof gate's near-universal 18px E1 floor freezing every push
    # -> re-coupled here now that the corpus is verified clean against the
    # current belt baselines, the same day this change landed.)
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - name: Stamp the deployment (lets Site Watch tell live from stale)
        run: |
          BUILT="$(date -u +%FT%TZ)"
          SHORT="$(printf '%s' "$GITHUB_SHA" | cut -c1-7)"
          printf '{"sha":"%s","ref":"%s","run":"%s","built":"%s"}\n' \
            "$GITHUB_SHA" "$GITHUB_REF_NAME" "$GITHUB_RUN_ID" "$BUILT" > version.json
          # Bake the live deploy time into the studio face so a phone bookmark can
          # see freshness (the client script renders it local + "X ago").
          sed -i "s#id=\"deployed\" datetime=\"\"#id=\"deployed\" datetime=\"$BUILT\"#" index.html
          sed -i "s#<span id=\"deployed-sha\">local</span>#<span id=\"deployed-sha\">$SHORT</span>#" index.html
          grep -q "datetime=\"$BUILT\"" index.html || { echo "HALT — deploy stamp did not inject into index.html"; exit 1; }
      - uses: actions/upload-pages-artifact@v3
        with:
          path: '.'
      - id: deployment
        uses: actions/deploy-pages@v4
