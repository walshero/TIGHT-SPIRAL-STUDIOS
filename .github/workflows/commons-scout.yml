name: Commons Scout — fetch open-licensed photos

# The sandbox can't reach Wikimedia; Actions can. Push a request JSON to
# art-department/commons-requests/ and this runs art-department/commons-scout.py,
# then commits the results to art-department/commons-scout/<request>/.

on:
  push:
    branches: [main]
    paths: ['art-department/commons-requests/**']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: commons-scout
  cancel-in-progress: false

jobs:
  scout:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install Pillow
        run: pip install --quiet pillow
      - name: Run changed requests
        run: |
          files=$(git diff --name-only HEAD~1 HEAD -- art-department/commons-requests/ | grep '\.json$' || true)
          if [ -z "$files" ]; then files=$(ls art-department/commons-requests/*.json); fi
          for f in $files; do [ -f "$f" ] && python3 art-department/commons-scout.py "$f"; done
      - name: Commit results
        run: |
          git config user.name "commons-scout"
          git config user.email "actions@users.noreply.github.com"
          git add art-department/commons-scout
          git diff --cached --quiet && exit 0
          git commit -m "commons-scout: results for $(git log -1 --format=%h)"
          for i in 1 2 3; do git pull --rebase origin main && git push origin HEAD:main && break; sleep 5; done
