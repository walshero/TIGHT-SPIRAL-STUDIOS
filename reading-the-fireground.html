<script>
/* Reading the Fireground — documentary case studies. Facts, not scoring.
   No right/wrong, no calibration verdict. What the record establishes, the
   difficult calculus, your own read (never graded), what the record shows,
   what the investigation found, and the people it belongs to. */






const CHARLESTON={
  slug:"charleston-2007",
  title:"The Sofa Super Store",
  place:"Charleston, South Carolina",
  when:"June 18, 2007 — a call at 7:08 p.m.",
  kicker:"A documented fireground case study",
  standfirst:"A furniture showroom fire that began small and, twenty-four minutes in, changed faster than the operation could follow. Nine Charleston firefighters did not come home. What follows is the record — the National Institute of Standards and Technology (NIST) investigated it and published its findings. It is presented here as fact, not as a test. There is no score.",
  frame:"This is not a quiz. Fireground decisions are made in the fog, on incomplete information, under a clock — a difficult calculus with no clean answer waiting at the end. What this case offers is what the responders faced, what they could see, and what the record later established. Sit with the difficulty. Form your own read. The record is not here to grade you; it is here to be understood.",
  moments:[
    {id:"m1",prog:"The record · 1 of 3",art:{label:"A large single-story furniture showroom at dusk, a long blank retail frontage, light smoke lifting from the rear loading dock.",img:"",credit:"NIST"},
      situation:"A fire is reported at a large retail furniture store — a single-story building with a vast, open showroom and an enclosed loading dock at the rear. It began in trash outside the loading dock and moved inside. For a time, it moves slowly.",
      known:{title:"What the record establishes about the building",items:[
        {t:"A large, open, undivided showroom — thousands of square feet of continuous space.",tag:"NIST RECORD"},
        {t:"A very high fuel load: showroom furniture, foam, and finished goods throughout.",tag:"NIST RECORD"},
        {t:"An enclosed loading dock at the rear, where the fire entered the structure.",tag:"NIST RECORD"},
        {t:"No automatic fire sprinkler system in the building.",tag:"NIST RECORD"}]},
      calculus:"A large-area commercial occupancy with a massive, continuous fuel load and no sprinklers is a building whose hazard is latent — the open volume and the contents are the danger, and early on the fire does not yet show what that volume will let it become. The hard part is that it looks manageable while the conditions for a very fast fire are already assembled.",
      record:{heading:"What the record shows",facts:"The fire started in trash outside the enclosed loading dock and spread into the dock and the structure. In its early phase it was slow-moving. The building's open plan, its fuel load, and the absence of sprinklers were already present — the conditions, in NIST's account, that would govern what happened next.",source:"NIST investigation of the Sofa Super Store fire, final report (2011)."}},
    {id:"m2",prog:"The record · 2 of 3",art:{label:"The showroom interior filling with a descending smoke layer, arrows of air drawing in low at the front openings toward the fire.",img:"",credit:"NIST"},
      situation:"About twenty-four minutes into the incident, the large front showroom windows are broken. Air rushes in.",
      known:{title:"What the record establishes about the air",items:[
        {t:"Until this point the fire was limited by the air available to it inside the structure.",tag:"NIST RECORD"},
        {t:"Breaking the front showroom windows opened a large path for air into the space.",tag:"NIST RECORD"},
        {t:"Beyond that opening lay the full, continuous fuel load of the open showroom.",tag:"NIST RECORD"}]},
      calculus:"Ventilation is the fireground's double-edged tool. Opening a structure clears smoke, buys visibility, and can make a rescue possible — and it also feeds air to a fire that has been starved of it. In a large open space packed with fuel, the timing of that opening, its coordination with water on the fire, and where the resulting flow path runs are not a detail. They are the whole question. And in the moment, the space is dark and the calculus is being made without the picture the record would later assemble.",
      record:{heading:"What the record shows",facts:"NIST found that the inrush of air following the breaking of the front windows caused the fire to spread rapidly through the showroom. The fire that had been slow-moving became, quickly, a fire moving across the full fuel load of the open space.",source:"NIST investigation of the Sofa Super Store fire, final report (2011)."}},
    {id:"m3",prog:"The record · 3 of 3",art:{label:"The full front of the showroom heavily involved, smoke banked to the ground, the scene lit by the fire.",img:"",credit:"NIST"},
      situation:"Conditions in the showroom change faster than the interior operation can adapt to them.",
      known:{title:"What the record establishes about the outcome",items:[
        {t:"The fire spread rapidly across the large open showroom after the air changed.",tag:"NIST RECORD"},
        {t:"Nine Charleston firefighters, operating in the structure, were killed.",tag:"NIST RECORD"},
        {t:"It was the deadliest single loss of firefighters in the United States since September 11, 2001.",tag:"NIST RECORD"}]},
      calculus:"There is no version of this screen that assigns a grade. The people on that fireground made calls in the dark, on the information they had, against a building whose hazards were assembled before they arrived. What the record does is name the factors — so the next crew reads the large-area, high-fuel, unsprinklered building differently, and reads the air differently, because these nine did.",
      record:{heading:"What the record shows",facts:"NIST identified the major contributing factors as the large open spaces, the high fuel load, the inrush of air following the breaking of the windows, and the absence of automatic sprinklers. NIST concluded that had automatic sprinklers been present, the fire would have been confined to the area where it started.",source:"NIST investigation of the Sofa Super Store fire, final report (2011)."}}],
  findings:{heading:"What the investigation found",items:[
    {t:"No automatic sprinklers — the single change NIST concluded would have confined the fire to the loading dock where it began.",tag:"NIST FINDING"},
    {t:"Large, open, undivided display space that let fire travel unchecked once it moved.",tag:"NIST FINDING"},
    {t:"A very high fuel load of furniture and foam throughout that space.",tag:"NIST FINDING"},
    {t:"The inrush of air when the front windows were broken — the input that turned a slow fire fast.",tag:"NIST FINDING"}],
    note:"NIST's recommendations included requiring automatic sprinklers in retail furniture stores. The findings are about a building and a system, not a verdict on the people who answered the call."},
  honoring:{heading:"The nine",body:"Engineer Brad Baity · Captain Mike Benke · Firefighter Melvin Champaign · Firefighter Earl Drayton · Assistant Engineer Michael French · Captain Billy Hutchinson · Engineer Mark Kelsey · Captain Louis Mulkey · Firefighter Brandon Thompson. The reading this case teaches belongs to them."},
  sources:["NIST — investigation of the June 18, 2007 Sofa Super Store fire, Charleston, SC; final report and recommendations (2011).","Incident date, location, and the names of the fallen are matters of public record."]};








const HACKENSACK={
  slug:"hackensack-1988",
  title:"Hackensack Ford",
  place:"Hackensack, New Jersey",
  when:"July 1, 1988 — an alarm at 3:01 p.m.",
  kicker:"A documented fireground case study",
  standfirst:"A car dealership with a wood bowstring truss roof over its service bay. Fire took hold in the truss space above the crews working below. Roughly twenty minutes in, a large section of the roof came down. Five Hackensack firefighters were killed. The fire service and NIST documented it, and it is taught as one of the most influential fires in American history. It is presented here as fact, not as a test. There is no score.",
  frame:"This is not a quiz. A truss roof carries its load efficiently and, under fire, can fail all at once with little warning — and the crews below cannot see how far the fire has eaten into it. The hard part is that the roof reads sound until the moment it does not. Sit with that. Form your own read. The record is not here to grade the people who were under it; it is here to be understood.",
  moments:[
    {id:"m1",prog:"The record · 1 of 3",art:{label:"A low, wide service building at night with an arched bowstring truss roofline, service-bay doors along the front.",img:"",credit:"NIOSH"},
      situation:"The building is a car dealership. Over its service bay is a wood bowstring truss roof — long arched wooden trusses spanning the open space. Fire is found burning in the truss loft above the service area.",
      known:{title:"What the record establishes about the building",items:[
        {t:"A wood bowstring truss roof spanning the open service bay.",tag:"RECORD"},
        {t:"Plywood had been laid across the bottom chords of the trusses, creating a hidden storage loft.",tag:"RECORD"},
        {t:"That concealed loft was packed with auto parts and supplies — added load, added fuel, and it hid the fire.",tag:"RECORD"},
        {t:"No built-in fire detection or suppression; protection was portable extinguishers only.",tag:"RECORD"}]},
      calculus:"Truss construction is efficient and unforgiving: the same geometry that lets a thin wooden arch span a wide bay means that when fire degrades a few connections, the whole system can let go at once. A concealed loft above the ceiling makes it worse — it adds fuel and load and it hides how far the fire has spread. Reading the construction, before committing crews beneath it, is the whole discipline. In the moment it is a working fire in a commercial building, and the roof overhead still looks like a roof.",
      record:{heading:"What the record shows",facts:"Fire was burning in the truss loft above the service area. The truck company vented the roof; engine companies worked to attack the fire through hatches in the ceiling of the service bay. Crews were operating in and beneath the truss space.",source:"Fire-service investigation and NIST FIREDOC record of the Hackensack Ford fire, July 1, 1988."}},
    {id:"m2",prog:"The record · 2 of 3",art:{label:"The arched truss roof from below, smoke pushing along the ridge line where the hidden loft sits, a faint glow.",img:"",credit:"NIOSH"},
      situation:"Crews have been operating in and under the truss space for about twenty minutes, with fire in the loft above them.",
      known:{title:"What the record establishes",items:[
        {t:"Fire had been burning in the concealed truss loft for a sustained period.",tag:"RECORD"},
        {t:"A truss under fire gives little external warning before it fails.",tag:"RECORD"},
        {t:"The collapse zone under a burning truss roof is the full area the roof can fall into.",tag:"RECORD"}]},
      calculus:"The call under a truss roof with fire in the truss space is offensive-under-it versus defensive-from-outside, and it has to be made without being able to see how far the fire has degraded the connections. Time under the roof is the exposure. The difficulty is that nothing on the surface announces the threshold — the roof holds, and holds, and then does not — so the decision has to be made on the construction and the fire load, not on a visible signal that will arrive too late.",
      record:{heading:"What the record shows",facts:"After roughly twenty minutes of firefighting, a section of the wood bowstring truss roof — on the order of sixty feet across — suddenly collapsed. Intense fire immediately engulfed the area below.",source:"Fire-service investigation and NIST FIREDOC record of the Hackensack Ford fire, July 1, 1988."}},
    {id:"m3",prog:"The record · 3 of 3",art:{label:"A collapsed section of arched roof over the service bay, debris and fire below, the night around it.",img:"",credit:"NIOSH"},
      situation:"The roof section is down. An order to evacuate the building is transmitted.",
      known:{title:"What the record establishes about the outcome",items:[
        {t:"An evacuation order was given, but it was not acknowledged by the units operating inside.",tag:"RECORD"},
        {t:"Three firefighters were killed in the service area; two were trapped in a rear storage room and could not be reached.",tag:"RECORD"},
        {t:"All five died. The incident is taught as a defining lesson in truss-roof collapse.",tag:"RECORD"}]},
      calculus:"There is no grade on this screen. The people under that roof made their calls on the information they had, against a building whose hazards — the truss, the hidden loft, the missing suppression — were built in long before they arrived. What the record does is name those hazards, and the communications gap the evacuation order fell into, so the next crew reads truss construction, and reads the collapse zone, and hears the evacuation order, because these five did.",
      record:{heading:"What the record shows",facts:"The evacuation order was not acknowledged by the interior units. Three firefighters died in the service area beneath the fallen roof; two more were trapped in a rear storage room and could not be rescued. All five were lost.",source:"Fire-service investigation and NIST FIREDOC record of the Hackensack Ford fire, July 1, 1988."}}],
  findings:{heading:"What the record teaches",items:[
    {t:"Wood truss roofs can fail suddenly and completely under fire — the collapse zone is the whole span.",tag:"LESSON"},
    {t:"Concealed lofts and voids add fuel and load and hide fire spread; read the construction, not just the smoke.",tag:"LESSON"},
    {t:"No built-in detection or suppression let the fire develop unseen in the truss space.",tag:"LESSON"},
    {t:"An evacuation order is only as good as its acknowledgment — fireground communications are load-bearing.",tag:"LESSON"}],
    note:"These are the lessons the fire service drew from Hackensack — about construction, collapse zones, and communications, not a verdict on the firefighters who answered the call."},
  honoring:{heading:"The five",body:"Captain Richard L. Williams · Lieutenant Richard Reinhagen · Firefighter William Krejsa · Firefighter Leonard Radumski · Firefighter Stephen Ennis. The reading this case teaches belongs to them."},
  sources:["Fire-service investigation and documentation of the July 1, 1988 Hackensack Ford fire, Hackensack, NJ; NIST FIREDOC record.","Incident date, location, and the names of the fallen are matters of public record."]};

const CHAMPLAIN={
  slug:"champlain-2021",
  title:"Champlain Towers South",
  place:"Surfside, Florida",
  when:"June 24, 2021 — the collapse came at 1:22 a.m.",
  kicker:"A documented structural-collapse case study",
  standfirst:"A twelve-story residential tower. Part of it came down in the middle of the night; ninety-eight people were killed. NIST's National Construction Safety Team investigated for years. Some of the warning signs had been written down three years earlier. This is presented as fact — the record, and the difficult calculus of reading a building's slow distress. There is no score, and no blame assigned to the people who were reading it in real time.",
  frame:"This is not a quiz, and it is not a fireground tactical call — it is the harder, slower cousin: reading structural distress that develops over years. The difficulty is that 'major damage, repair needed' and 'get everyone out tonight' are different signals, and telling them apart from the inside, before the record is assembled, is genuinely hard. The people reading the 2018 report did not have what the investigation later found. Sit with that gap. The record is here to be understood, not to condemn.",
  moments:[
    {id:"m1",prog:"The record · 1 of 3",art:{label:"A parking-garage level: rows of concrete columns and a slab overhead, faint crack lines traced on the columns and beams.",img:"",credit:"NIST"},
      situation:"Three years before the collapse, a structural engineer inspects the building and puts what they find in writing.",
      known:{title:"What the 2018 report established",items:[
        {t:"Failed waterproofing beneath the pool deck had caused major structural damage to the concrete slab below it.",tag:"2018 REPORT"},
        {t:"Abundant cracking and spalling in the parking-garage columns, beams, and walls.",tag:"2018 REPORT"},
        {t:"The waterproofing was beyond its useful life; the flat (unsloped) slab let water sit rather than drain.",tag:"2018 REPORT"},
        {t:"It warned the deterioration would expand exponentially if the waterproofing was not replaced.",tag:"2018 REPORT"},
        {t:"It estimated the cost of the necessary repairs — but did not signal imminent danger.",tag:"2018 REPORT"}]},
      calculus:"This is the hardest read in the whole trainer, because it is slow. A written finding of major structural damage that needs repair is a serious signal — and it is not the same signal as evacuate tonight, and the report itself did not say the latter. Distinguishing chronic distress that must be fixed from acute danger that must be fled, from the inside, without the analysis that only a full investigation could later assemble, is a genuine and difficult calculus. The people holding that report in 2018 did not have what the record now holds.",
      record:{heading:"What the record shows",facts:"The October 2018 engineering report documented major structural damage tied to failed pool-deck waterproofing and widespread cracking and spalling in the garage, and warned the deterioration would worsen exponentially if not addressed. It provided repair-cost estimates and did not indicate that collapse was imminent. Repairs were being organized in the years that followed.",source:"October 2018 structural engineering report (Morabito Consultants), as entered into the public record (2021)."}},
    {id:"m2",prog:"The record · 2 of 3",art:{label:"The full twelve-story tower at night, dark against the sky, quiet.",img:"",credit:"NIST"},
      situation:"Over the next three years the deterioration continues. Later investigation would find factors distributed across the building's design, construction, and maintenance.",
      known:{title:"What NIST's investigation later established",items:[
        {t:"Understrength structural design and misplaced steel reinforcement in the pool deck, with low safety margins.",tag:"NIST FINDING"},
        {t:"Corrosion of the steel reinforcement, further reducing strength over time.",tag:"NIST FINDING"},
        {t:"Added dead load on the pool deck — heavy planters, added sand, pavers.",tag:"NIST FINDING"},
        {t:"The flat slab and failed waterproofing that kept water against the structure.",tag:"NIST FINDING"}]},
      calculus:"The factors were spread across design decisions made decades earlier, construction as-built, maintenance deferred, and time doing its slow work through corrosion and water. No single one of them, on any given night, said tonight. That is what makes this class of failure so hard to read from inside it: the danger accumulates in places no resident can see, across a timescale no single inspection captures.",
      record:{heading:"What the record shows",facts:"NIST's National Construction Safety Team reviewed roughly two dozen hypotheses using physical evidence, imagery, historical records, witness interviews, laboratory testing, and computer modeling. It found the pool deck's strength was diminished by understrength design, misplaced and corroding reinforcement, and added load — with failed waterproofing keeping water against the concrete.",source:"NIST National Construction Safety Team investigation, Champlain Towers South; technical findings (2026)."}},
    {id:"m3",prog:"The record · 3 of 3",art:{label:"The tower with one half standing and the other fallen into a dark mound of rubble.",img:"",credit:"NIST"},
      situation:"1:22 a.m., June 24, 2021.",
      known:{title:"What NIST established about the collapse",items:[
        {t:"The failure began at connections between garage columns and the pool deck.",tag:"NIST FINDING"},
        {t:"Cracks grew and loads redistributed to adjacent slab-column connections not strong enough to carry them.",tag:"NIST FINDING"},
        {t:"It began in the pool deck, not in the tower itself, then propagated.",tag:"NIST FINDING"},
        {t:"Part of the building collapsed; ninety-eight people were killed.",tag:"NIST FINDING"}]},
      calculus:"There is no grade here, and no one on a screen to score. The record's value is that it turns a night no one saw coming into a set of named, understandable factors — so the next building is designed, built, maintained, and read differently, because of the ninety-eight.",
      record:{heading:"What the record shows",facts:"NIST found the collapse initiated at the column-to-pool-deck connections; as they failed, loads shifted to neighboring connections that could not bear them, and the failure spread from the pool-deck area into the tower. Part of Champlain Towers South collapsed at approximately 1:22 a.m. on June 24, 2021. Ninety-eight people died.",source:"NIST National Construction Safety Team investigation, Champlain Towers South; technical findings (2026)."}}],
  findings:{heading:"What the investigation found",items:[
    {t:"Understrength design and misplaced, low-margin reinforcement in the pool deck.",tag:"NIST FINDING"},
    {t:"Corrosion of the reinforcement and failed waterproofing on a flat slab that pooled water.",tag:"NIST FINDING"},
    {t:"Added dead load — planters, sand, pavers — on an already-weakened deck.",tag:"NIST FINDING"},
    {t:"The initiating failure at the column-to-pool-deck connections, propagating into the tower.",tag:"NIST FINDING"}],
    note:"The findings are about design, construction, maintenance, and time — a systemic account, not a verdict on the residents or the people reading the warnings in real time."},
  honoring:{heading:"The ninety-eight",body:"Ninety-eight people were killed in the collapse of Champlain Towers South. The reading this case teaches belongs to them."},
  sources:["NIST National Construction Safety Team investigation of the June 24, 2021 partial collapse of Champlain Towers South, Surfside, FL; technical findings (2026).","October 2018 structural engineering report (Morabito Consultants), as entered into the public record (2021).","Incident date, location, and toll are matters of public record."]};

const CASES={"charleston-2007":CHARLESTON,"hackensack-1988":HACKENSACK,"champlain-2021":CHAMPLAIN};
let C=null;const reflections={};const confidence={};const crew=[];let order=[];let idx=0;
const screens=document.getElementById('screens');
function el(html){const d=document.createElement('div');d.innerHTML=html.trim();return d.firstElementChild;}
function esc(s){return String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));}
function factList(k){return`<div class="known"><h3>${k.title}</h3><ul>${k.items.map(i=>`<li>${i.t}<span class="tag">${i.tag}</span></li>`).join('')}</ul></div>`;}

function screenSelect(){return`<section class="stage on" id="select" aria-labelledby="selh"><p class="kicker">Reading the fireground</p><h1 id="selh">Documented case studies</h1><p class="sub">Real incidents, investigated and on the record. Each is presented as fact — what was known, the difficult calculus responders faced, and what the record shows. <b>Nothing here is scored.</b> There are no right or wrong answers, only the record and your own reading of it.</p><div class="select-grid">${Object.values(CASES).map(c=>`<button class="casecard" data-case="${c.slug}"><span class="ctext"><span class="ch3">${c.title}</span><span class="cp">${c.place} — ${c.when}</span><span class="cmeta">Documented · NIST record</span></span></button>`).join('')}</div><p class="credit">Private and offline. Anything you write stays on this page unless you export it. Presented in the register of the investigations themselves: fact, and respect for the people in them.</p></section>`;}
function photoSlot(m){var a=m.art;if(a.img){return`<div class="art"><img src="${a.img}" alt="${a.label}" loading="lazy"></div><p class="artcap">Photograph: ${a.credit}. Documentary image \u2014 the size-up cue is in the frame.</p>`;}return`<div class="art" role="img" aria-label="${a.label}"><div class="photopend"><span class="pl">Documentary photograph \u00b7 ${a.credit}</span><span class="pd">${a.label}</span><span class="pn">Licensed-photo lane \u00b7 placement pending</span></div></div>`;}
function screenIntro(){return`<section class="stage" id="s0" aria-labelledby="s0h">${photoSlot(C.moments[0])}<p class="kicker">${C.kicker}</p><h1 id="s0h">${C.title}</h1><p class="sub">${C.standfirst}</p><div class="disclaimer">${C.frame}</div><div class="btnrow"><button class="btn" data-go="first">Read the record</button></div><p class="credit">${C.place} · ${C.when}</p></section>`;}
function screenMoment(m){return`<section class="stage" id="${m.id}" aria-labelledby="${m.id}h"><p class="prog">${m.prog}</p>${photoSlot(m)}<p class="prompt" id="${m.id}h">${m.situation}</p>${factList(m.known)}<div class="disclaimer"><b>The difficult calculus.</b> ${m.calculus}</div><div class="review" data-reflect="${m.id}"><h3>Your own read (private — never scored)</h3><p>Read it the way the fireground is read \u2014 the building and its construction, the smoke and its air track, what is showing and what is hidden. What are you weighing? What would you be watching? This is for your reflection, not for a grade.</p><label class="skip" for="rf-${m.id}">Your read</label><textarea id="rf-${m.id}" placeholder="Type your read, or leave it blank and simply sit with the question."></textarea><div class="conflabel">How settled is your read?</div><div class="verds" data-conf="${m.id}" role="group" aria-label="How settled is your read?"><button type="button" class="v-conf" data-c="Leaning one way">Leaning one way</button><button type="button" class="v-conf" data-c="Genuinely torn">Genuinely torn</button><button type="button" class="v-conf" data-c="Fairly settled">Fairly settled</button></div></div><div class="btnrow"><button class="btn" data-reveal="${m.id}">Turn to the record</button></div><div class="reveal hidden" data-rec="${m.id}"></div></section>`;}
function screenClose(){return`<section class="stage" id="close" aria-labelledby="closeh"><p class="prog">The record</p><h2 id="closeh">${C.findings.heading}</h2>${factList(C.findings)}<p style="font-size:15px;color:var(--ink2);margin:0 0 8px">${C.findings.note}</p><div class="reveal" style="border-left-color:var(--dusk)"><h3>${C.honoring.heading}</h3><p>${C.honoring.body}</p></div><div class="known"><h3>Sources</h3><ul>${C.sources.map(s=>`<li>${s}</li>`).join('')}</ul></div><div class="btnrow"><button class="btn ghost" data-go="debrief">Facilitator debrief</button><button class="btn ghost" data-go="select">Other cases</button></div><footer><b>Reading the Fireground</b> — documentary case study, facts engine. No score, no right/wrong: the record and your reading of it. Built on the studio's accessibility floor. Sourced, never invented.</footer></section>`;}
function screenDebrief(){return`<section class="stage" id="debrief" aria-labelledby="dbh"><p class="prog">Facilitator debrief</p><h2 id="dbh">The crew's reading</h2><div class="disclaimer">Run the case with your crew, then capture each person's reading of a moment — <b>not to score it</b>, to surface the conversation. Where did reads differ, and why? What did the record change? No accounts, no roster stored; reads live in memory for this session only.</div>
    <div class="field"><label id="whichlab">Which moment?</label><div class="seg" role="group" aria-labelledby="whichlab" id="dbSeg">${C.moments.map(m=>`<button data-m="${m.id}" aria-pressed="false">${m.prog.replace('The record · ','')}</button>`).join('')}</div></div>
    <div class="field"><label for="dbName">Firefighter (name or initials)</label><input id="dbName" type="text" autocomplete="off" placeholder="e.g. Rodriguez"></div>
    <div class="field"><label for="dbRead">Their reading</label><textarea id="dbRead" placeholder="What they were watching / weighing at that moment."></textarea></div>
    <div class="btnrow"><button class="btn" id="dbAdd" disabled>Add to the debrief</button></div>
    <div id="dbList"></div>
    <div class="export"><h3>Session summary</h3><p>Every reading captured, grouped by moment — one block to keep and discuss. No scores; the record and the crew's reasoning side by side.</p><textarea id="dbExport" readonly aria-label="Debrief summary"></textarea><div class="btnrow"><button class="btn" id="dbBuild">Build the summary</button><button class="btn ghost" id="dbCopy">Copy</button></div><p class="note" id="dbNote"></p></div>
    <footer>The debrief feeds the after-action conversation firefighters already run. It records readings and the record — never a grade.</footer></section>`;}

let dbMoment=null;
function moLabel(id){const m=C.moments.find(x=>x.id===id);return m?m.prog.replace('The record · ',''):id;}
function renderDbList(){const w=document.getElementById('dbList');if(!w)return;if(!crew.length){w.innerHTML='';return;}const by={};crew.forEach(r=>{(by[r.moment]=by[r.moment]||[]).push(r);});w.innerHTML=Object.keys(by).map(mid=>`<div class="known"><h3>${esc(moLabel(mid))}</h3><ul>${by[mid].map(r=>`<li><b>${esc(r.name)}:</b> ${esc(r.text)}</li>`).join('')}</ul></div>`).join('');}
function dbRefresh(){const b=document.getElementById('dbAdd');const nm=(document.getElementById('dbName')||{}).value;const tx=(document.getElementById('dbRead')||{}).value;b.disabled=!(dbMoment&&nm&&nm.trim()&&tx&&tx.trim());}
function buildDbExport(){const L=[];L.push('=== READING THE FIREGROUND — CREW DEBRIEF ===');L.push('case: '+C.slug+' ('+C.title+')');L.push('note: readings, not scores. The record + the crew\'s reasoning.');L.push('');const by={};crew.forEach(r=>{(by[r.moment]=by[r.moment]||[]).push(r);});if(!crew.length)L.push('(no readings captured)');Object.keys(by).forEach(mid=>{L.push('--- '+moLabel(mid)+' ---');by[mid].forEach(r=>L.push('  '+r.name+': '+r.text));L.push('');});L.push('--- FOR THE STUDIO ---');L.push('Paste back into the project. Where reads diverged is the debrief; the record is the ground, not a grade.');document.getElementById('dbExport').value=L.join('\n');document.getElementById('dbNote').textContent='Built. Copy it, then paste into the project.';}

const backBtn=document.getElementById('backBtn'),homeBtn=document.getElementById('homeBtn');
function show(i){idx=Math.max(0,Math.min(i,order.length-1));document.querySelectorAll('.stage').forEach(s=>s.classList.remove('on'));const cur=document.getElementById(order[idx]);if(cur)cur.classList.add('on');backBtn.disabled=idx===0;window.scrollTo(0,0);}
function goto(id){const i=order.indexOf(id);if(i>=0)show(i);}
backBtn.addEventListener('click',()=>{if(idx>0)show(idx-1);});
homeBtn.addEventListener('click',()=>goto('select'));
function clearState(){for(const k in reflections)delete reflections[k];for(const k in confidence)delete confidence[k];crew.length=0;dbMoment=null;}
function loadCase(id){C=CASES[id];clearState();document.querySelectorAll('#screens .stage').forEach(s=>{if(s.id!=='select')s.remove();});screens.appendChild(el(screenIntro()));C.moments.forEach(m=>screens.appendChild(el(screenMoment(m))));screens.appendChild(el(screenClose()));screens.appendChild(el(screenDebrief()));order=['select','s0'].concat(C.moments.map(m=>m.id)).concat(['close','debrief']);wire();wireDebrief();goto('s0');}
function build(){screens.innerHTML='';screens.appendChild(el(screenSelect()));document.querySelectorAll('#select [data-case]').forEach(b=>b.addEventListener('click',()=>loadCase(b.dataset.case)));order=['select'];idx=0;show(0);}
function wire(){screens.querySelectorAll('[data-go]').forEach(b=>b.addEventListener('click',()=>{const g=b.dataset.go;goto(g==='first'?C.moments[0].id:g);}));
  C.moments.forEach(m=>{const sec=document.getElementById(m.id);const ta=sec.querySelector(`#rf-${m.id}`);if(ta)ta.addEventListener('input',()=>{reflections[m.id]=ta.value;});const cf=sec.querySelector(`[data-conf="${m.id}"]`);if(cf)cf.querySelectorAll('button').forEach(b=>b.addEventListener('click',()=>{confidence[m.id]=b.dataset.c;cf.querySelectorAll('button').forEach(x=>x.setAttribute('aria-pressed',x===b));}));const rv=sec.querySelector(`[data-reveal="${m.id}"]`);rv.addEventListener('click',()=>{const box=sec.querySelector(`[data-rec="${m.id}"]`);const conf=confidence[m.id];const cal=conf?`<p class="calib">You turned to the record <b>${conf.toLowerCase()}</b>. Hold that against what it establishes:</p>`:'';box.innerHTML=`<h3>${m.record.heading}</h3>${cal}<p>${m.record.facts}</p><p style="font-size:14px;color:var(--ink2);font-style:italic;margin-top:10px">Source: ${m.record.source}</p><p class="gap">Where your read and the record diverge is the lesson \u2014 not a mark.</p><div class="btnrow"><button class="btn" data-next="${m.id}">Continue</button></div>`;box.classList.remove('hidden');rv.disabled=true;const nx=box.querySelector('[data-next]');nx.addEventListener('click',()=>{const i=C.moments.findIndex(x=>x.id===m.id);if(i<C.moments.length-1)goto(C.moments[i+1].id);else goto('close');});box.scrollIntoView({behavior:'smooth',block:'start'});});});}
function wireDebrief(){const seg=document.getElementById('dbSeg');if(seg)seg.querySelectorAll('[data-m]').forEach(b=>b.addEventListener('click',()=>{dbMoment=b.dataset.m;seg.querySelectorAll('[data-m]').forEach(x=>x.setAttribute('aria-pressed',x.dataset.m===dbMoment));dbRefresh();}));
  const nm=document.getElementById('dbName'),tx=document.getElementById('dbRead');if(nm)nm.addEventListener('input',dbRefresh);if(tx)tx.addEventListener('input',dbRefresh);
  const add=document.getElementById('dbAdd');if(add)add.addEventListener('click',()=>{if(!dbMoment)return;crew.push({moment:dbMoment,name:nm.value.trim(),text:tx.value.trim()});tx.value='';dbRefresh();renderDbList();nm.focus();});
  const bd=document.getElementById('dbBuild');if(bd)bd.addEventListener('click',buildDbExport);
  const cp=document.getElementById('dbCopy');if(cp)cp.addEventListener('click',()=>{const box=document.getElementById('dbExport');if(!box.value)buildDbExport();box.select();try{navigator.clipboard&&navigator.clipboard.writeText?navigator.clipboard.writeText(box.value).then(()=>{document.getElementById('dbNote').textContent='Copied.';},()=>{document.execCommand('copy');}):document.execCommand('copy');}catch(e){document.getElementById('dbNote').textContent='Select the text and copy it.';}});}
const cbtn=document.getElementById('comfortBtn');if(cbtn){let warm=false;cbtn.addEventListener('click',()=>{warm=!warm;document.body.classList.toggle('warm',warm);cbtn.textContent=warm?'Comfort: Warm dark':'Comfort: Default';});}
build();
</script>
