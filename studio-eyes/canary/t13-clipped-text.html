<!DOCTYPE html><html><head><style>
/* THE FLOK CARD, reduced to its bones. Two faces stacked with position:absolute over a
   fixed min-height box: the box is sized by the SHORT face, so the long one is sliced.
   Contrast 12:1, target 340x68, focus ring present — nine floors green, unreadable. */
body{background:#10151c;color:#f2f6fb;font-family:system-ui;margin:0}
.scene{padding:24px}
.scene h1{color:#f2f6fb;font-size:28px}
.card{position:relative;min-height:68px;width:320px;overflow:hidden;
      border:1px solid #33465e;border-radius:14px;background:#0e1620}
.face{position:absolute;inset:0;padding:12px 16px}
.fact{color:#f2f6fb;font-size:13px;line-height:1.4}
.cite{color:#4fd6c9;font-size:11px;margin-top:5px}
</style></head><body>
<div class="scene"><h1>The room is dark. A television is the only light.</h1>
<div class="card"><div class="face">
  <div class="fact">Unpredictable rewards drive the most persistent checking &mdash; the same
  schedule that makes slot machines compulsive.</div>
  <div class="cite">Skinner, Science and Human Behavior (1953)</div>
</div></div></div>
</body></html>
