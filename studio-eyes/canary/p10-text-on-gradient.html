<!DOCTYPE html><html><head>
<!-- FALSE-POSITIVE TRAP for the image/gradient contrast floor, which shipped with a
     HALT canary (t03) and no PASS canary — so the one side that can wrongly block a
     correct build was never tested. Dark ink on a light mint gradient: about 10:1 to
     any eye, and reported at 1.1:1 for as long as the sampler counted the glyphs
     themselves as the darkest thing behind the glyphs. -->
<meta name="tsp:surface" content="fixture">
<style>
body{background:#10151c;color:#f2f6fb;font-family:system-ui;margin:0}
.scene{padding:40px}
.scene h1{color:#f2f6fb;font-size:28px}
.cta{display:block;width:280px;min-height:64px;margin:20px 0;border:none;border-radius:16px;
  background:linear-gradient(180deg,#7feadf 0%,#4fd6c9 55%,#33bdb0 100%);
  color:#04211e;font:800 22px system-ui;cursor:pointer}
.cta:focus-visible{outline:3px solid #f2f6fb;outline-offset:3px}
.band{padding:14px 18px;border-radius:12px;margin-top:14px;
  background:linear-gradient(135deg,#1636a8,#2f5cf0);color:#ffffff;font-size:16px}
</style></head><body>
<div class="scene"><h1>The room is dark. A television is the only light.</h1>
<button class="cta" type="button">Clock in</button>
<div class="band">White on a deep blue gradient, which is also fine.</div>
</div>
</body></html>
