<!DOCTYPE html><html><head><style>
/* THE LOBBY BUTTON, reduced to its bones. A flex row: a fixed tile, then a text span
   that cannot shrink (min-width:auto) and carries a long single word. overflow is
   VISIBLE, so floor 11 is right to stay green - nothing is clipped - and the word
   walks out through the right border. Founder's phone, 2026-10-16, at ~140% zoom. */
body{background:#faf6ee;color:#1f1b16;font-family:system-ui;margin:0;padding:16px}
h1{font-size:24px}
.btn{display:flex;align-items:center;gap:15px;width:300px;background:#fff;
     border:2px solid #1f1b16;border-left-width:11px;padding:12px 16px;
     font-weight:bold;letter-spacing:2px;font-size:21px}
.tile{width:64px;height:64px;flex:none;background:#2e4a6b;border-radius:13px}
</style></head><body>
<h1>Tonight's program. The house is already half full.</h1>
<button class="btn" type="button"><span class="tile"></span><span>ERNESTOANDTHEELEVATOR</span></button>
</body></html>
