<!DOCTYPE html><html><head><style>
body{background:#f4efe3;color:#1b1a17;font-family:system-ui;margin:0}
body.still .scene *{animation:none}
body.menuopen{overflow:hidden}
.chip{position:fixed;top:12px;left:12px;width:36px;height:36px;padding:0;background:#f4efe3;color:#1b1a17;border:2px solid #1b1a17}
.chip::after{content:"";position:absolute;inset:-7px}
.chip:focus-visible{outline:3px solid #1b1a17;outline-offset:2px}
.scene{padding:72px 24px}
.scene h1{font-size:28px}
</style></head><body>
<button class="chip" aria-label="Sound on">S</button>
<div class="scene"><h1>An old pond. A frog is about to jump.</h1></div>
</body></html>
