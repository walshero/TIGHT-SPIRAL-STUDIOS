<style>
:root{
  /* THE READER SETS THE SIZE, NOT THIS FILE.
     100% = whatever base font size the reader's browser is configured for, so a
     bumped-up browser text setting actually moves this page. This is the house
     convention: of 75 corpus files, 69 declare no root size and 3 use 100%.
     Only 3 hardcoded a px root, and this file was one of them at 20px, which
     overrode the reader's own setting in the name of accessibility. Backwards.
     A max(16px,100%) floor was tried first and reverted: WeasyPrint (the engine
     behind studio-eyes-sweep.py) cannot parse max() in font-size and HALTs the
     render-proof gate outright. At every browser's out-of-box 16px default the
     1.125rem body below lands exactly on the studio's 18px absolute floor; a
     reader who has deliberately set a smaller base gets smaller text, which is
     their call, not this file's. */
  font-size:100%;
  --paper:#f4efe6; --ink:#211a12; --ink2:#211a12;
  --gold:#6e4700; --rust:#a34a2a; --slate:#3f5666; --kraft:#b08d57;
  --card:#fdfaf3; --edge:#3a2f22; --glow:#f5c97b;
  --focus:#6e4700;
  color-scheme: light dark;
}
body[data-stop="softer"]{ --paper:#e6ddc9; --card:#efe6d2; --ink:#211a12; --ink2:#211a12; --gold:#6e4700; --rust:#a34a2a; --slate:#3f5666; --kraft:#b08d57; --edge:#3a2f22; --focus:#6e4700; }
@media (prefers-color-scheme: dark){
  :root{
    --paper:#262019; --ink:#f0dcb8; --ink2:#f0dcb8;
    --gold:#f5c97b; --card:#332a1f; --edge:#f0dcb8;
    --rust:#d4744e; --slate:#7d9ab0; --kraft:#cfa96e; --focus:#f5c97b;
    color-scheme: dark;
  }
}

body[data-stop="warmdark"]{
  --paper:#262019; --ink:#f0dcb8; --ink2:#f0dcb8;
  --gold:#f5c97b; --card:#332a1f; --edge:#f0dcb8;
  --rust:#d4744e; --slate:#7d9ab0; --kraft:#cfa96e; --focus:#f5c97b;
}
*{box-sizing:border-box; margin:0; padding:0;}
html{scroll-behavior:auto;}
body{
  background:var(--paper); color:var(--ink);
  font-family:Georgia,'Times New Roman',serif;
  font-size:1.125rem; line-height:1.6;   /* 18px at a default browser base; scales with the reader */
  min-height:100vh;
}
main{max-width:680px; margin:0 auto; padding:16px 16px 40px;}
h1,h2{font-weight:700; line-height:1.25;}
h1{font-size:1.5rem;} h2{font-size:1.25rem; margin-bottom:.5rem;}
p{margin-bottom:.9rem; max-width:68ch;}
button{
  font-family:inherit; font-size:1.125rem; line-height:1.4;
  min-height:48px; min-width:48px;
  padding:12px 20px; margin:6px 4px;
  background:var(--card); color:var(--ink);
  border:3px solid var(--edge); border-radius:10px;
  cursor:pointer; text-align:left;
}
button:hover{border-color:var(--gold);}
button:focus-visible{outline:4px solid var(--focus); outline-offset:3px;}
input:focus-visible, select:focus-visible, textarea:focus-visible{outline:4px solid var(--focus); outline-offset:3px;}
.big{display:block; width:100%; font-size:1.1875rem; font-weight:700;}
.screen{display:none;}
.screen.on{display:block;}
.coinbar{
  display:flex; align-items:center; gap:8px;
  background:var(--paper);
  border-bottom:3px solid var(--edge); padding:5px 16px;
  font-weight:700;
  position:sticky; top:0; z-index:20;
  transition:transform .22s ease;
}
/* At the very top by default; tucks away as you scroll down and comes straight
   back the moment you scroll up, so the Comfort control is never something you
   have to hunt back up the page for. */
.coinbar.tucked{transform:translateY(-110%);}
@media (prefers-reduced-motion:reduce){.coinbar{transition:none;}}
.coins{font-size:1.125rem; display:inline-flex; align-items:center; gap:5px; white-space:nowrap;}
.barcoin{width:26px; height:26px; flex:0 0 auto;}
.coinbar button{margin:0; padding:10px 14px; white-space:nowrap; font-size:1.125rem;}
#homeBtn{margin-left:auto;}
.coins.tokens{color:var(--ink2); font-weight:400;}
.answerfx{display:flex; align-items:center; gap:10px; margin-bottom:8px;}
.answerfx svg{flex:0 0 auto; width:44px; height:44px;}
.answerfx .fxlabel{font-weight:700;}
.coinroll{animation:coinRoll .6s cubic-bezier(.2,.9,.3,1.2);}
@keyframes coinRoll{0%{transform:translateX(-60px) rotate(-90deg); opacity:0;}100%{transform:translateX(0) rotate(0deg); opacity:1;}}
.batsustamp{animation:batsuStamp .45s cubic-bezier(.3,1.6,.4,1);}
@keyframes batsuStamp{0%{transform:scale(1.7); opacity:0;}60%{transform:scale(.92); opacity:1;}100%{transform:scale(1); opacity:1;}}
@media (prefers-reduced-motion:reduce){.coinroll,.batsustamp{animation:none;}}
#comfortBtn{
  font-size:1.125rem; font-weight:700; min-height:48px;
  background:var(--gold); color:var(--paper);
  border:3px solid var(--edge);
}
body[data-stop="warmdark"] #comfortBtn{color:#262019;}
.cab{
  border:3px solid var(--edge); border-radius:12px; background:var(--card);
  padding:14px 16px; margin:10px 0; width:100%; text-align:left;
}
.cab .name{font-size:1.1875rem; font-weight:700; display:block;}
.cabrow{display:flex; align-items:flex-start; gap:12px;}
.cabicon{flex:0 0 auto; width:40px; height:40px; margin-top:2px;}
.cabtext{flex:1 1 auto; min-width:0;}
.cab .cost{color:var(--gold); font-weight:700;}
.cab.dark{border-style:dashed;}
.cab.dark .name{font-style:italic;}
.tag{
  display:inline-block; font-weight:700; font-size:1.125rem;
  border:2px solid var(--edge); border-radius:8px; padding:2px 10px; margin-top:6px;
}
.feedback{
  border-left:6px solid var(--gold); background:var(--card);
  padding:12px 16px; margin:12px 0; border-radius:0 10px 10px 0;
}
.word{
  display:inline-block; margin:3px 2px; padding:8px 10px; min-height:48px;
  border:2px solid var(--edge); border-radius:8px; background:var(--card);
  font-size:1.125rem; cursor:pointer;
}
.word[aria-pressed="true"]{
  text-decoration:line-through; opacity:.55; border-style:dashed;
}
.gap{
  display:inline-block; min-width:48px; min-height:48px; margin:3px 1px;
  border:2px dashed var(--edge); border-radius:8px; background:transparent;
  color:var(--gold); font-weight:700; font-size:1.25rem; padding:4px 8px;
}
.gap[aria-pressed="true"]{background:var(--gold); color:var(--paper); border-style:solid;}
body[data-stop="warmdark"] .gap[aria-pressed="true"]{color:#262019;}
.wordline{line-height:2.4; margin:14px 0;}
.ticket{
  border:3px dashed var(--edge); background:var(--card);
  padding:14px; margin:14px 0; font-family:Courier,monospace; font-size:1.125rem;
  white-space:pre-wrap;
}
svg text{font-family:Georgia,serif;}
.glint{animation:glint 1.6s ease-in-out infinite;}
@keyframes glint{0%,100%{opacity:.3}50%{opacity:1}}
@media (prefers-reduced-motion:reduce){.glint{animation:none; opacity:1;}}
/* Cabinet guardian puppets — idle rigging, each a single named loop.
   Two-rule pattern deliberately mirrors .glint above: base rule + its own
   separate @media block, never merged into one selector list (v4 gate's
   own documented regression when that happens). */
.vmBlink{animation:vmBlink 4.2s ease-in-out infinite;}
@keyframes vmBlink{0%,88%,100%{transform:scaleY(1)}92%{transform:scaleY(.08)}}
@media (prefers-reduced-motion:reduce){.vmBlink{animation:none;}}
.vmPulse{animation:vmPulse 2.6s ease-in-out infinite;}
@keyframes vmPulse{0%,100%{opacity:.72; transform:scale(.94)}50%{opacity:1; transform:scale(1.06)}}
@media (prefers-reduced-motion:reduce){.vmPulse{animation:none; opacity:1;}}
/* transform-origin for these three is set per-instance inline (transform-box:fill-box),
   since the class is shared across four different creatures with different geometry. */
.vmSwayL{animation:vmSwayL 3.4s ease-in-out infinite;}
@keyframes vmSwayL{0%,100%{transform:rotate(-4deg)}50%{transform:rotate(3deg)}}
@media (prefers-reduced-motion:reduce){.vmSwayL{animation:none;}}
.vmSwayR{animation:vmSwayR 3.7s ease-in-out infinite;}
@keyframes vmSwayR{0%,100%{transform:rotate(4deg)}50%{transform:rotate(-3deg)}}
@media (prefers-reduced-motion:reduce){.vmSwayR{animation:none;}}
.vmBreathe{animation:vmBreathe 3.2s ease-in-out infinite;}
@keyframes vmBreathe{0%,100%{transform:translateY(0) scaleY(1)}50%{transform:translateY(-3px) scaleY(1.02)}}
@media (prefers-reduced-motion:reduce){.vmBreathe{animation:none;}}
.balloonwrap{border:3px solid var(--edge); border-radius:12px; background:var(--card); margin:10px 0;}
footer.studiofoot{
  background:#262019; color:#f0dcb8; padding:36px 16px 22px;
  font-size:1.125rem; line-height:1.6;
}
footer.studiofoot a{color:#f5c97b;}
footer.studiofoot button{
  background:#332a1f; color:#f0dcb8; border-color:#f0dcb8; font-size:1.125rem;
}
.srlive{position:absolute; left:-9999px;}
.skiplink{
  position:absolute; left:-9999px; top:0; z-index:10;
  background:var(--card); color:var(--ink); border:3px solid var(--edge);
  border-radius:0 0 10px 0; padding:10px 16px; font-weight:700;
}
.skiplink:focus{ left:0; }
/* THE ADAPTIVE LAYER — this file was one of 8 of 74 with no width breakpoint.
   Everything here is rem, so it all rides the reader's own base. The FURNITURE
   gives more ground than the prose does: headings and padding tighten on a
   narrow screen while body copy holds its ratio. The original complaint was the
   chrome eating the screen
