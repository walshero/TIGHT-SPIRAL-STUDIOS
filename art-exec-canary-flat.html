<!DOCTYPE html><html lang="en"><head><meta charset="utf-8">
<title>Canary: a layer with only one value</title>
<style>
 body{background:#111;margin:0}
 .stage{position:relative;height:220px;background:#101820;overflow:hidden}
 .layer{position:absolute;left:0;right:0;bottom:0;height:60%}
 .shape{position:absolute;bottom:0;width:40px;background:#050d0a}
 .line{position:absolute;left:10px;top:24px;color:#ffe9b8;font:700 20px monospace}
</style></head><body>
<!-- Six shapes, one identical value: no silhouette, no depth. -->
<div class="stage"><div class="line">one value is a shape, not a scene</div>
 <div class="layer">
  <div class="shape" style="left:2%;height:60px"></div><div class="shape" style="left:18%;height:88px"></div>
  <div class="shape" style="left:34%;height:52px"></div><div class="shape" style="left:50%;height:96px"></div>
  <div class="shape" style="left:66%;height:70px"></div><div class="shape" style="left:82%;height:84px"></div>
 </div></div>
</body></html>
