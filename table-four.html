<!DOCTYPE html>
<html lang="en" data-type="1">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Table Four</title>
<style>
:root{
  --paper:#F4EFE6;
  --paper2:#EBE4D8;
  --white:#FBF8F2;
  --red:#B31B14;
  --inkdeep:#171310;
  --ink:#14100C;
  --ink2:#4A423A;
  --redink:#8E1610;
  --chalk:#FBF7F0;
  --t:20px;
}
html[data-type="2"]{--t:23px}
html[data-type="3"]{--t:27px}

*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{
  background:var(--paper);
  color:var(--ink);
  font:var(--t)/1.45 ui-serif,Georgia,"Iowan Old Style",serif;
  min-height:100vh;
}

/* ---------- masthead : back + home always visible ---------- */
.bar{
  display:flex;align-items:center;gap:10px;
  padding:10px 12px;
  background:var(--paper2);
  border-bottom:3px solid var(--ink);
  position:sticky;top:0;z-index:9;
}
.bar h1{
  font-size:var(--t);margin:0;flex:1;
  letter-spacing:.06em;text-transform:uppercase;font-weight:700;
  color:var(--ink);
}
button{
  font:600 18px/1 ui-serif,Georgia,serif;
  min-height:46px;padding:11px 14px;
  background:var(--white);color:var(--ink);
  border:2px solid var(--ink);border-radius:3px;
  cursor:pointer;
}
button:active{background:var(--paper2)}
button[disabled]{opacity:.4;cursor:default}
.navbtn{padding:11px 12px}

/* ---------- stage ---------- */
.scene{padding:0 12px 26px;max-width:820px;margin:0 auto}
.hidden{display:none}

/* room art carries the screen */
.room{
  width:100%;display:block;
  background:var(--white);
  border:3px solid var(--ink);
  border-radius:4px;
  margin:12px 0 10px;
}
.beat{
  background:var(--red);color:var(--chalk);
  border:3px solid var(--ink);border-radius:4px;
  padding:12px 14px;margin:0 0 12px;
}
.beat .n{
  font-size:18px;letter-spacing:.14em;text-transform:uppercase;
  color:var(--chalk);margin-bottom:4px;
}
.beat p{margin:0;color:var(--chalk)}
.acts{display:flex;flex-direction:column;gap:9px}
.acts button{text-align:left;line-height:1.35;padding:13px 14px}
.k{
  font-size:18px;letter-spacing:.1em;text-transform:uppercase;
  color:var(--redink);display:block;margin-bottom:2px;
}
.note{color:var(--ink2);font-size:18px;margin:10px 0 0}
.banked{
  background:var(--paper2);border-left:6px solid var(--red);
  padding:10px 12px;margin:12px 0 0;
}
.banked p{margin:0 0 4px;font-size:18px;color:var(--ink)}
.banked p:last-child{margin:0}

/* reveal */
h2{font-size:var(--t);margin:16px 0 6px;letter-spacing:.05em;text-transform:uppercase}
.chain{list-style:none;padding:0;margin:8px 0 0}
.chain li{
  border-left:6px solid var(--paper2);
  padding:8px 12px;margin:0 0 6px;color:var(--ink2);font-size:18px;
}
.chain li.lit{border-left-color:var(--red);color:var(--ink);background:var(--paper2)}
.tally{background:var(--paper2);border:3px solid var(--ink);padding:12px 14px;margin:14px 0 0}
.tally p{margin:0 0 7px}
.tally p:last-child{margin:0}
.big{font-size:var(--t);font-weight:700}
.src{color:var(--ink2);font-size:18px;border-top:2px solid var(--paper2);margin-top:18px;padding-top:10px}
.src b{color:var(--ink)}
</style>
</head>

  <button class="navbtn" id="homeBtn" onclick="goHome()" aria-label="Home">Home</button>
  <button class="navbtn" onclick="stepType()" aria-label="Text size">Text</button>
</div>
