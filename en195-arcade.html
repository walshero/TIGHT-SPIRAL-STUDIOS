<script>
/* PRE-PAINT. Runs before the first paint so a reader who chose warm-dark never
   sees a flash of daylight. This is the whole point of persistence: a setting
   that arrives after paint has already failed the person it is for.
   No try/catch swallowing — a storage failure falls through to sane defaults. */
(function(){
  var d = document.documentElement, s = null;
  try { s = JSON.parse(localStorage.getItem('tsp.comfort.v1') || 'null'); } catch(e){ s = null; }
  if (!s || typeof s !== 'object') {
    /* No stored choice. Honour the operating system, then stop. The control
       always outranks the OS once the reader has touched it. */
    var dark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
    s = { light: dark ? 'night' : 'day', size: 0, contrast: 0, motion: 0, cues: 0, reader: 0,
          motionSet: 0 };
  }
  /* motionSet records whether the READER ever touched motion. Until they do, the OS
     decides, live, through the media query. v3.0 copied the OS value into storage at first
     load, which froze a phone-level preference into a page-level one and made it look like
     a choice the reader had made. */
  d.setAttribute('data-light', s.light === 'dusk' || s.light === 'night' ? s.light : 'day');
  d.classList.toggle('c-a1', s.size === 1);
  d.classList.toggle('c-a2', s.size === 2);
  d.classList.toggle('c-contrast', !!s.contrast);
  d.classList.toggle('c-still',    !!(s.motionSet && s.motion));
  if (s.motionSet && !s.motion) d.setAttribute('data-motion', 'go');
  d.classList.toggle('c-cues',     !!s.cues);
  d.classList.toggle('c-reader',   !!s.reader);
  window.__comfort = s;
})();
</script>
<style>
/* ═══ COMFORT v3.1 — light ladder. Lifted from comfort-v3.html, mapped onto the
   arcade's own palette: day = the old Default, dusk = Softer, night = Warm dark.
   The puppet stage (scene0 + the four cabinet guardians) is its own always-night
   scene on hardcoded #262019 and does NOT follow the ladder — that fixed darkness
   is why the shadow puppets read at all. Comfort governs the chrome and the
   reading surfaces around it. */
:root{
  /* THE READER SETS THE BASE. 100% defers to their browser's own font-size
     preference. The old :root{font-size:20px} made everything big by OVERRIDING
     that preference — right number, wrong mechanism (retired 2026-08-08 with the
     20px body line; one floor now, 18px absolute, type-census.py enforces it).
     Every rem below is multiplied by 1.25 so a default 16px browser renders the
     same sizes as before, and a reader whose base differs finally gets a say. */
  font-size:100%;

  --paper:#f4efe6; --ink:#211a12; --ink2:#211a12;
  --gold:#6e4700; --rust:#a34a2a; --slate:#3f5666; --kraft:#b08d57;
  --card:#fdfaf3; --edge:#3a2f22; --glow:#f5c97b;
  --focus:#6e4700;
  /* comfort v3.1 tokens the dock, panel and Clear Reader use */
  --surface:#fdfaf3; --surface-2:#efe6d2;
  --ink-2:#211a12;
  --line:#b08d57;          /* decorative rules ONLY. Never a control boundary. */
  --control-edge:#3a2f22;  /* control boundaries. WCAG 1.4.11 wants 3:1. */
  --accent-strong:#3f5666; --on-accent:#ffffff;
  --r:10px; --tap:48px;
  --sans:system-ui,-apple-system,'Segoe UI',sans-serif;
  --motion:.18s;
  --chrome-h:64px;      /* measured at runtime, never guessed. */
  --dock-h:76px;
  color-scheme: light;
}
html[data-light="dusk"]{
  --paper:#e6ddc9; --card:#efe6d2;
  --surface:#efe6d2; --surface-2:#ddd0b2;
  color-scheme: light;
}
html[data-light="night"]{
  --paper:#262019; --ink:#f0dcb8; --ink2:#f0dcb8;
  --gold:#f5c97b; --card:#332a1f; --edge:#f0dcb8;
  --rust:#d4744e; --slate:#7d9ab0; --kraft:#cfa96e; --focus:#f5c97b;
  --surface:#332a1f; --surface-2:#3f362a;
  --ink-2:#dccba2; --line:#5a5140; --control-edge:#f0dcb8;
  --accent-strong:#a9bcd0; --on-accent:#141109;
  color-scheme: dark;
}

/* OS FALLBACK. Sets :root so a reader who has never touched the control, or
   who has JS off, still gets dark when their phone is dark. An EXPLICIT choice
   outranks it: html[data-light="day"] below re-asserts the light tokens at
   higher specificity, so choosing Day on a dark phone actually gives you day.
   Written against :root deliberately, which is the shape preship-gate-v4 parses.
   A dark path a gate cannot see is a dark path that gets no audit. */
@media (prefers-color-scheme: dark){
  :root{
    --paper:#262019; --ink:#f0dcb8; --ink2:#f0dcb8;
    --gold:#f5c97b; --card:#332a1f; --edge:#f0dcb8;
    --rust:#d4744e; --slate:#7d9ab0; --kraft:#cfa96e; --focus:#f5c97b;
    --surface:#332a1f; --surface-2:#3f362a;
    --ink-2:#dccba2; --line:#5a5140; --control-edge:#f0dcb8;
    --accent-strong:#a9bcd0; --on-accent:#141109;
    color-scheme: dark;
  }
}

/* An explicit Day beats the OS. Same token set as :root, higher specificity. */
html[data-light="day"]{
  --paper:#f4efe6; --ink:#211a12; --ink2:#211a12;
  --gold:#6e4700; --rust:#a34a2a; --slate:#3f5666; --kraft:#b08d57;
  --card:#fdfaf3; --edge:#3a2f22; --focus:#6e4700;
  --surface:#fdfaf3; --surface-2:#efe6d2;
  --ink-2:#211a12; --line:#b08d57; --control-edge:#3a2f22;
  --accent-strong:#3f5666; --on-accent:#ffffff;
  color-scheme: light;
}

/* ═══ HIGH CONTRAST ═══ */
html.c-contrast:not([data-light="night"]){
  --paper:#fffdf8; --card:#fffdf8; --surface:#fffdf8; --surface-2:#f2ede1;
  --ink:#100d07; --ink2:#100d07; --ink-2:#241d10;
  --edge:#241d10; --control-edge:#241d10; --line:#7d6a44;
  --accent-strong:#1d2f3d;
}
html.c-contrast[data-light="night"]{
  --paper:#0a0908; --card:#141210; --surface:#141210; --surface-2:#201d18;
  --ink:#fff9ec; --ink2:#fff9ec; --ink-2:#f0e3c6;
  --edge:#f0e3c6; --control-edge:#f0e3c6;
  --accent-strong:#c3d4e6; --gold:#ffd77a;
}

/* ═══ FONT SIZE — multiplies the reader's own base rather than replacing it. ═══ */
html.c-a1{ font-size:112.5%; }
html.c-a2{ font-size:125%; }

/* ═══ MOTION STOP ═══
   TWO RULES. NEVER MERGED. An @media block cannot sit inside a selector list;
   merged, the CSS parser discards the whole declaration (measured on comfort v2:
   0 of 47 rules parsed). These two rules replace the per-animation
   @media (prefers-reduced-motion) blocks this file used to carry, because those
   were unconditional: a reader on a reduced-motion phone could never turn motion
   ON. An explicit choice outranks the OS in both directions — data-motion="go"
   is set only when the reader explicitly turns motion stop OFF. */
html.c-still *{
  animation:none !important; transition:none !important; scroll-behavior:auto !important;
}
@media (prefers-reduced-motion:reduce){
  html:not([data-motion="go"]) *{
    animation:none !important; transition:none !important; scroll-behavior:auto !important;
  }
}

/* ═══ COLOURBLIND CUES ═══ */
html.c-cues a{ text-decoration:underline; text-underline-offset:3px; text-decoration-thickness:2px; }
*{box-sizing:border-box; margin:0; padding:0;}
html{scroll-behavior:auto;}
body{
  background:var(--paper); color:var(--ink);
  font-family:Georgia,'Times New Roman',serif;
  font-size:1.125rem; line-height:1.6;   /* 18px at a default browser base; scales with the reader */
  min-height:100vh;
  transition:background var(--motion) ease, color var(--motion) ease;
}
main{max-width:680px; margin:0 auto; padding:16px 16px 40px;}
h1,h2{font-weight:700; line-height:1.25;}
h1{font-size:1.5rem;} h2{font-size:1.25rem; margin-bottom:.5rem;}
p{margin-bottom:.9rem; max-width:68ch;}
button{
  font-family:inherit; font-size:1.125rem; line-height:1.4;
  min-height:48px; min-width:48px;
  padding:12px 20px; margin:6px 4px;
  background:var(--card); color:var(--ink);
  border:3px solid var(--edge); border-radius:10px;
  cursor:pointer; text-align:left;
}
button:hover{border-color:var(--gold);}
button:focus-visible{outline:4px solid var(--focus); outline-offset:3px;}
input:focus-visible, select:focus-visible, textarea:focus-visible{outline:4px solid var(--focus); outline-offset:3px;}
.big{display:block; width:100%; font-size:1.1875rem; font-weight:700;}
.screen{display:none;}
.screen.on{display:block;}
.coinbar{
  display:flex; align-items:center; gap:8px;
  background:var(--paper);
  border-bottom:3px solid var(--edge); padding:5px 16px;
  font-weight:700;
  position:sticky; top:0; z-index:20;
  transition:transform .22s ease;
}
/* At the very top by default; tucks away as you scroll down and comes straight
   back the moment you scroll up, so the screen belongs to the game while you
   read. (Folded in from the layout preview, 2026-08-09. Motion stop and the OS
   reduced-motion default kill the transition via the comfort pair up top; the
   tuck itself still works, it just snaps.) */
.coinbar.tucked{transform:translateY(-110%);}
.coins{font-size:1.125rem; display:inline-flex; align-items:center; gap:5px; white-space:nowrap;}
.barcoin{width:26px; height:26px; flex:0 0 auto;}
.coinbar button{margin:0; padding:10px 14px; white-space:nowrap; font-size:1.125rem;}
#homeBtn{margin-left:auto;}
.coins.tokens{color:var(--ink2); font-weight:400;}
.answerfx{display:flex; align-items:center; gap:10px; margin-bottom:8px;}
.answerfx svg{flex:0 0 auto; width:44px; height:44px;}
.answerfx .fxlabel{font-weight:700;}
.coinroll{animation:coinRoll .6s cubic-bezier(.2,.9,.3,1.2);}
@keyframes coinRoll{0%{transform:translateX(-60px) rotate(-90deg); opacity:0;}100%{transform:translateX(0) rotate(0deg); opacity:1;}}
.batsustamp{animation:batsuStamp .45s cubic-bezier(.3,1.6,.4,1);}
@keyframes batsuStamp{0%{transform:scale(1.7); opacity:0;}60%{transform:scale(.92); opacity:1;}100%{transform:scale(1); opacity:1;}}
.cab{
  border:3px solid var(--edge); border-radius:12px; background:var(--card);
  padding:14px 16px; margin:10px 0; width:100%; text-align:left;
}
.cab .name{font-size:1.1875rem; font-weight:700; display:block;}
.cabrow{display:flex; align-items:flex-start; gap:12px;}
.cabicon{flex:0 0 auto; width:40px; height:40px; margin-top:2px;}
.cabtext{flex:1 1 auto; min-width:0;}
.cab .cost{color:var(--gold); font-weight:700;}
.cab.dark{border-style:dashed;}
.cab.dark .name{font-style:italic;}
.tag{
  display:inline-block; font-weight:700; font-size:1.125rem;
  border:2px solid var(--edge); border-radius:8px; padding:2px 10px; margin-top:6px;
}
.feedback{
  border-left:6px solid var(--gold); background:var(--card);
  padding:12px 16px; margin:12px 0; border-radius:0 10px 10px 0;
}
.word{
  display:inline-block; margin:3px 2px; padding:8px 10px; min-height:48px;
  border:2px solid var(--edge); border-radius:8px; background:var(--card);
  font-size:1.125rem; cursor:pointer;
}
.word[aria-pressed="true"]{
  text-decoration:line-through; opacity:.55; border-style:dashed;
}
.gap{
  display:inline-block; min-width:48px; min-height:48px; margin:3px 1px;
  border:2px dashed var(--edge); border-radius:8px; background:transparent;
  color:var(--gold); font-weight:700; font-size:1.25rem; padding:4px 8px;
}
.gap[aria-pressed="true"]{background:var(--gold); color:var(--paper); border-style:solid;}
.wordline{line-height:2.4; margin:14px 0;}
.ticket{
  border:3px dashed var(--edge); background:var(--card);
  padding:14px; margin:14px 0; font-family:Courier,monospace; font-size:1.125rem;
  white-space:pre-wrap;
}
svg text{font-family:Georgia,serif;}
.glint{animation:glint 1.6s ease-in-out infinite;}
@keyframes glint{0%,100%{opacity:.3}50%{opacity:1}}
/* Cabinet guardian puppets — idle rigging, each a single named loop.
   Motion stop for ALL of these (and .glint/.coinroll/.batsustamp above) is the
   comfort v3.1 two-rule pair up top: html.c-still for the reader's explicit
   choice, plus the html:not([data-motion="go"]) @media rule for the OS default.
   The per-class @media blocks this file used to carry were unconditional, so a
   reader on a reduced-motion phone could never turn motion back ON. */
.vmBlink{animation:vmBlink 4.2s ease-in-out infinite;}
@keyframes vmBlink{0%,88%,100%{transform:scaleY(1)}92%{transform:scaleY(.08)}}
.vmPulse{animation:vmPulse 2.6s ease-in-out infinite;}
@keyframes vmPulse{0%,100%{opacity:.72; transform:scale(.94)}50%{opacity:1; transform:scale(1.06)}}
/* transform-origin for these three is set per-instance inline (transform-box:fill-box),
   since the class is shared across four different creatures with different geometry. */
.vmSwayL{animation:vmSwayL 3.4s ease-in-out infinite;}
@keyframes vmSwayL{0%,100%{transform:rotate(-4deg)}50%{transform:rotate(3deg)}}
.vmSwayR{animation:vmSwayR 3.7s ease-in-out infinite;}
@keyframes vmSwayR{0%,100%{transform:rotate(4deg)}50%{transform:rotate(-3deg)}}
.vmBreathe{animation:vmBreathe 3.2s ease-in-out infinite;}
@keyframes vmBreathe{0%,100%{transform:translateY(0) scaleY(1)}50%{transform:translateY(-3px) scaleY(1.02)}}
.balloonwrap{border:3px solid var(--edge); border-radius:12px; background:var(--card); margin:10px 0;}
footer.studiofoot{
  background:#262019; color:#f0dcb8; padding:36px 16px 22px;
  font-size:1.125rem; line-height:1.6;
}
footer.studiofoot a{color:#f5c97b;}
footer.studiofoot button{
  background:#332a1f; color:#f0dcb8; border-color:#f0dcb8; font-size:1.125rem;
}
.srlive{position:absolute; left:-9999px;}
.skiplink{
  position:absolute; left:-9999px; top:0; z-index:10;
  background:var(--card); color:var(--ink); border:3px solid var(--edge);
  border-radius:0 0 10px 0; padding:10px 16px; font-weight:700;
}
.skiplink:focus{ left:0; }
details{margin:10px 0;} summary{min-height:48px; display:flex; align-items:center; cursor:pointer; font-weight:700;}
summary:focus-visible{outline:4px solid var(--focus); outline-offset:3px;}

/* THE ADAPTIVE LAYER — folded in from the layout preview, 2026-08-09. Everything
   here is rem, so it all rides the reader's own base. The FURNITURE gives more
   ground than the prose does: headings and padding tighten on a narrow screen
   while body copy holds its ratio. The original complaint was the chrome eating
   the screen before the first game, and separately that a hardcoded 20px base
   was simply too big — both are answered upstream now. */
@media (max-width:480px){
  h1{font-size:1.375rem;}
  h2{font-size:1.1875rem;}
  main{padding:12px 12px 32px;}
  .coinbar{padding:5px 12px;}
  .cab{padding:11px 12px; margin:8px 0;}
  .cab .name{font-size:1.125rem;}
