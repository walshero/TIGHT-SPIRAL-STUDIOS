<!DOCTYPE html><html><head><meta charset="utf-8"><title>Xenos in-house props v0.15</title>
<style>body{margin:0;background:transparent}canvas{display:block}</style></head><body>
<script>
// Xenos in-house props. Painted, inked, iso (axis slope 0.42, matching the brick lattice 25x10.4).
// Each prop draws in world units at 2x into its own canvas; fp = footprint in sprite-local world units.
const INK='#2b2018',K=0.42;
function rng(s){return()=>{s=(s*1664525+1013904223)>>>0;return s/4294967296}}
let Z=1;function mk(w,h){const c=document.createElement('canvas');c.width=Math.ceil(w*2*Z);c.height=Math.ceil(h*2*Z);c.dataset.w=w*Z;c.dataset.h=h*Z;c.dataset.z=Z;const x=c.getContext('2d');x.scale(2*Z,2*Z);x.lineJoin='round';x.lineCap='round';document.body.appendChild(c);return [c,x]}
function poly(x,pts,fill,ink=INK,lw=1.4){x.beginPath();pts.forEach(([a,b],i)=>i?x.lineTo(a,b):x.moveTo(a,b));x.closePath();if(fill){x.fillStyle=fill;x.fill()}if(ink){x.strokeStyle=ink;x.lineWidth=lw;x.stroke()}}
function lg(x,x0,y0,x1,y1,stops){const g=x.createLinearGradient(x0,y0,x1,y1);stops.forEach(([o,c])=>g.addColorStop(o,c));return g}
// iso box: origin = front-bottom corner (cx,cy); a = length along +x axis (right-up), b = along -x axis (left-up), h = height
function box(x,cx,cy,a,b,h,top,left,right,lw=1.4){
  const R=[cx+a,cy-a*K],L=[cx-b,cy-b*K],B=[cx+a-b,cy-(a+b)*K];
  poly(x,[[cx,cy],[R[0],R[1]],[R[0],R[1]-h],[cx,cy-h]],right,INK,lw);
  poly(x,[[cx,cy],[L[0],L[1]],[L[0],L[1]-h],[cx,cy-h]],left,INK,lw);
  poly(x,[[cx,cy-h],[R[0],R[1]-h],[B[0],B[1]-h],[L[0],L[1]-h]],top,INK,lw);}
const OUT={};

// ---------------- TREE: slender trunk, raised open canopy of painted leaves (not cloud lobes) ----------------
function tree(name,seed,W,H){const [c,x]=mk(W,H);const r=rng(seed);const bx=W/2,by=H-10;
  x.fillStyle='rgba(30,50,20,.28)';x.beginPath();x.ellipse(bx+4,by,26,9,0,0,7);x.fill();
  // trunk with root flare and two limbs
  const trunk=lg(x,bx-10,0,bx+10,0,[[0,'#8a6a4a'],[.5,'#6f5238'],[1,'#4c3624']]);
  x.beginPath();x.moveTo(bx-13,by+2);x.quadraticCurveTo(bx-6,by-8,bx-6,by-40);x.quadraticCurveTo(bx-8,by-80,bx-24,by-104);x.lineTo(bx-15,by-108);
  x.quadraticCurveTo(bx-2,by-90,bx+1,by-80);x.quadraticCurveTo(bx+8,by-96,bx+26,by-110);x.lineTo(bx+31,by-102);x.quadraticCurveTo(bx+12,by-84,bx+7,by-44);
  x.quadraticCurveTo(bx+7,by-8,bx+15,by+2);x.closePath();x.fillStyle=trunk;x.fill();x.strokeStyle=INK;x.lineWidth=1.5;x.stroke();
  x.strokeStyle='rgba(43,32,24,.45)';x.lineWidth=1;for(let i=0;i<5;i++){x.beginPath();const yy=by-12-i*12;x.moveTo(bx-3,yy);x.quadraticCurveTo(bx+1,yy-5,bx+3,yy-9);x.stroke()}
  // canopy: clumps of individual pointed leaves, dark underside first, sunlit top-left last
  const clumps=[];for(let i=0;i<7;i++){const a=i/7*Math.PI*2+r()*.5;clumps.push([bx+Math.cos(a)*(26+r()*14),by-128+Math.sin(a)*(18+r()*8)-(Math.sin(a)<0?6:0),24+r()*8])}
  clumps.push([bx,by-132,30]);clumps.sort((p,q)=>p[1]-q[1]);
  const tones=[['#2f7a2c','#245f22'],['#3f9432','#2f7a2c'],['#58ad3e','#3f9432'],['#7cc64e','#58ad3e'],['#a6dc6a','#7cc64e']];
  // inked silhouette backing so the canopy edge reads crisp
  x.save();x.fillStyle='#245f22';x.strokeStyle=INK;x.lineWidth=2.2;
  for(const [cx_,cy_,rr] of clumps){x.beginPath();for(let k=0;k<=22;k++){const a=k/22*Math.PI*2,j=rr*(1+.14*Math.sin(a*5+cx_)+.08*(r()-.5));const px=cx_+Math.cos(a)*j,py=cy_+Math.sin(a)*j*.78;k?x.lineTo(px,py):x.moveTo(px,py)}x.closePath();x.stroke()}
  for(const [cx_,cy_,rr] of clumps){x.beginPath();for(let k=0;k<=22;k++){const a=k/22*Math.PI*2,j=rr*(1+.14*Math.sin(a*5+cx_));const px=cx_+Math.cos(a)*j,py=cy_+Math.sin(a)*j*.78;k?x.lineTo(px,py):x.moveTo(px,py)}x.closePath();x.fill()}
  x.restore();
  for(let t=0;t<tones.length;t++){for(const [cx_,cy_,rr] of clumps){const n=26;for(let i=0;i<n;i++){
    const a=r()*Math.PI*2,d=Math.sqrt(r())*rr*.92;let px=cx_+Math.cos(a)*d,py=cy_+Math.sin(a)*d*.78;
    const lit=(-(px-cx_)*.6-(py-cy_))/rr; if(t>=3&&lit<.1+r()*.4)continue; if(t>=4&&lit<.45)continue; if(t<=1&&lit>.6)continue;
    const L=5+r()*4,ang=r()*Math.PI*2;x.save();x.translate(px,py);x.rotate(ang);x.beginPath();x.moveTo(-L,0);x.quadraticCurveTo(0,-L*.48,L,0);x.quadraticCurveTo(0,L*.48,-L,0);
    x.fillStyle=tones[t][0];x.fill();x.strokeStyle=tones[t][1];x.lineWidth=.6;x.stroke();x.restore()}}}
  OUT[name]={c,fp:[[bx-20,by],[bx,by-8],[bx+20,by],[bx,by+8]]};}

// ---------------- LAMP: iron post, glass lantern, warm glow ----------------
function lamp(){const W=44,H=124;const [c,x]=mk(W,H);const bx=W/2,by=H-6;
  x.fillStyle='rgba(30,40,20,.25)';x.beginPath();x.ellipse(bx+3,by,10,4,0,0,7);x.fill();
  const g=x.createRadialGradient(bx,26,2,bx,26,22);g.addColorStop(0,'rgba(255,230,150,.55)');g.addColorStop(1,'rgba(255,230,150,0)');x.fillStyle=g;x.fillRect(0,0,W,56);
  poly(x,[[bx-7,by],[bx+7,by],[bx+5,by-8],[bx-5,by-8]],'#2f3a3c');
  x.fillStyle=lg(x,bx-3,0,bx+3,0,[[0,'#5a6a6c'],[1,'#26302f']]);x.fillRect(bx-2.6,40,5.2,by-48);x.strokeStyle=INK;x.lineWidth=1.2;x.strokeRect(bx-2.6,40,5.2,by-48);
  poly(x,[[bx-9,40],[bx+9,40],[bx+6,36],[bx-6,36]],'#2f3a3c');
  poly(x,[[bx-7,36],[bx+7,36],[bx+8,18],[bx-8,18]],lg(x,bx-8,0,bx+8,0,[[0,'#fff6c8'],[.5,'#ffd970'],[1,'#e8a838']]));
  x.strokeStyle=INK;x.lineWidth=1;x.beginPath();x.moveTo(bx,18);x.lineTo(bx,36);x.stroke();
  poly(x,[[bx-11,18],[bx+11,18],[bx,8]],'#2f3a3c');x.beginPath();x.arc(bx,7,2.2,0,7);x.fillStyle='#2f3a3c';x.fill();x.stroke();
  OUT.lampX={c,fp:[[bx-8,by],[bx,by-4],[bx+8,by],[bx,by+4]]};}

// ---------------- MAIL DROP: a big collection mailbox, envelopes going in, a four-role sorting rack ----------------
function maildrop(){const W=210,H=200;const [c,x]=mk(W,H);const r=rng(5);
  const ox=104,oy=186; // front corner of the platform
  x.fillStyle='rgba(30,40,20,.25)';x.beginPath();x.ellipse(ox,oy-22,86,30,0,0,7);x.fill();
  box(x,ox,oy,80,80,10,lg(x,0,oy-90,0,oy,[[0,'#c99a62'],[1,'#a8784a']]),'#8a5e38','#6e4a2c');
  // planks
  x.strokeStyle='rgba(43,32,24,.35)';x.lineWidth=.8;for(let i=1;i<6;i++){const t=i/6;x.beginPath();x.moveTo(ox+80*t,oy-10-80*t*K);x.lineTo(ox+80*t-80,oy-10-(80*t+80)*K);x.stroke()}
  // sorting rack at the back: 4 cubbies with role icons (Level 1 roles)
  const rx=ox-2,ry=oy-10-52; // rack front-bottom corner
  box(x,rx,ry,72,8,68,'#7a4f2c',lg(x,0,ry-60,0,ry,[[0,'#b6824e'],[1,'#94643a']]),'#6e4a2c');
  const cell=(i,j)=>{const a0=6+i*33,b0=6+j*31;const p=(a,b)=>[rx+a,ry-a*K-b];return [p(a0,b0),p(a0+28,b0),p(a0+28,b0+26),p(a0,b0+26)]};
  const icons=['chef','doctor','work','shop'];
  icons.forEach((ic,k)=>{const i=k%2,j=1-Math.floor(k/2);const q=cell(i,j);poly(x,q,'#3d2716',INK,1.1);
    const cx_=(q[0][0]+q[2][0])/2,cy_=(q[0][1]+q[2][1])/2+2;x.save();x.translate(cx_,cy_);x.transform(1,-K,0,1,0,0);
    if(ic==='chef'){x.fillStyle='#fffaf0';x.strokeStyle=INK;x.lineWidth=1;x.beginPath();x.arc(-4,-3,4,0,7);x.arc(0,-6,4.5,0,7);x.arc(4,-3,4,0,7);x.fill();x.stroke();x.fillRect(-5,-2,10,7);x.strokeRect(-5,-2,10,7)}
    if(ic==='doctor'){x.fillStyle='#fffaf0';x.fillRect(-7,-7,14,14);x.strokeStyle=INK;x.lineWidth=1;x.strokeRect(-7,-7,14,14);x.fillStyle='#d83a3a';x.fillRect(-1.8,-5,3.6,10);x.fillRect(-5,-1.8,10,3.6)}
    if(ic==='work'){x.fillStyle='#8a5a2e';x.fillRect(-7,-3,14,9);x.strokeStyle=INK;x.lineWidth=1;x.strokeRect(-7,-3,14,9);x.strokeRect(-3,-6,6,3)}
    if(ic==='shop'){x.fillStyle='#ffcf3a';x.beginPath();x.moveTo(-6,-3);x.lineTo(6,-3);x.lineTo(5,7);x.lineTo(-5,7);x.closePath();x.fill();x.strokeStyle=INK;x.lineWidth=1;x.stroke();x.beginPath();x.arc(0,-3,3.4,Math.PI,0);x.stroke()}
    x.restore();
    // a letter waiting in each cubby
    x.fillStyle='#fff7e6';const e=q[0];poly(x,[[e[0]+3,e[1]-1],[e[0]+11,e[1]-4.4],[e[0]+11,e[1]-8],[e[0]+3,e[1]-4.6]],'#fff7e6',INK,.8)});
  // sign over the rack
  const sx=rx+4,sy=ry-74;x.strokeStyle=INK;x.lineWidth=1.4;x.beginPath();x.moveTo(sx+8,sy-3);x.lineTo(sx+8,sy+6);x.moveTo(sx+56,sy-23);x.lineTo(sx+56,sy-14);x.stroke();
  poly(x,[[sx,sy],[sx+66,sy-66*K],[sx+66,sy-66*K-18],[sx,sy-18]],lg(x,sx,0,sx+66,0,[[0,'#d8443a'],[1,'#b2302a']]));
  x.save();x.translate(sx+33,sy-9-33*K);x.transform(1,-K,0,1,0,0);x.fillStyle='#fff3d6';x.font='900 11px Georgia,serif';x.textAlign='center';x.textBaseline='middle';x.fillText('MAIL DROP',0,1);x.restore();
  // the mailbox: rounded top, front slot, envelope emblem, short legs
  const mx=ox-10,my=oy-12; // front-bottom corner
  const a=32,b=27,h=58;
  for(const [lx,ly] of [[mx+3,my-1],[mx+a-3,my-a*K+1],[mx-b+3,my-b*K+1]]){x.fillStyle='#1d2c4a';x.fillRect(lx-2,ly-8,4,9);x.strokeStyle=INK;x.lineWidth=1;x.strokeRect(lx-2,ly-8,4,9)}
  box(x,mx,my-8,a,b,h,'#4f86cf',lg(x,mx-b,0,mx,0,[[0,'#2e5fa6'],[1,'#3d74c0']]),lg(x,mx,0,mx+a,0,[[0,'#2a548f'],[1,'#21457a']]));
  // domed top: half-cylinder along the right axis
  const T0=[mx,my-8-h],T1=[mx+a,my-8-h-a*K],L0=[mx-b,my-8-h-b*K],L1=[mx+a-b,my-8-h-(a+b)*K];
  x.beginPath();x.moveTo(T0[0],T0[1]);x.lineTo(T1[0],T1[1]);x.bezierCurveTo(T1[0]-2,T1[1]-22,L1[0]+2,L1[1]-22,L1[0],L1[1]);x.lineTo(L0[0],L0[1]);x.bezierCurveTo(L0[0]+2,L0[1]-22,T0[0]-2,T0[1]-22,T0[0],T0[1]);x.closePath();
  x.fillStyle=lg(x,L0[0],0,T1[0],0,[[0,'#6fa2e0'],[.5,'#4f86cf'],[1,'#2a548f']]);x.fill();x.strokeStyle=INK;x.lineWidth=1.4;x.stroke();
  x.beginPath();x.moveTo(T0[0],T0[1]);x.bezierCurveTo(T0[0]-2,T0[1]-22,L0[0]+2,L0[1]-22,L0[0],L0[1]);x.fillStyle='#3d74c0';x.stroke();
  // highlight
  x.strokeStyle='rgba(255,255,255,.45)';x.lineWidth=2;x.beginPath();x.moveTo(mx-b+5,my-8-h-b*K-4);x.bezierCurveTo(mx-b+8,my-8-h-b*K-16,mx-6,my-8-h-20,mx-3,my-8-h-10);x.stroke();
  // slot on the left face with a pull flap
  const s0=[mx-b+4,my-8-h+10-(b-4)*K],s1=[mx-4,my-8-h+10-4*K];poly(x,[[s0[0],s0[1]],[s1[0],s1[1]],[s1[0],s1[1]+5],[s0[0],s0[1]+5]],'#13233f',INK,1.1);
  poly(x,[[s0[0],s0[1]-1],[s1[0],s1[1]-1],[s1[0]+1,s1[1]-7],[s0[0]+1,s0[1]-7]],'#5b8fd6',INK,1);
  // envelope emblem on the left face
  x.save();x.translate(mx-b/2-1,my-8-h/2+6-b/2*K);x.transform(1,K,0,1,0,0);x.fillStyle='#fff7e6';x.fillRect(-8,-5,16,11);x.strokeStyle=INK;x.lineWidth=1;x.strokeRect(-8,-5,16,11);x.beginPath();x.moveTo(-8,-5);x.lineTo(0,1.5);x.lineTo(8,-5);x.stroke();x.restore();
  // envelopes dropping toward the slot
  [[s0[0]+2,s0[1]-24,-.4],[s0[0]+12,s0[1]-40,.3],[s0[0]-4,s0[1]-54,-.15]].forEach(([ex,ey,rot],i)=>{x.save();x.translate(ex,ey);x.rotate(rot);x.fillStyle=i===1?'#ffe9a8':'#fff7e6';x.fillRect(-7,-4.5,14,9);x.strokeStyle=INK;x.lineWidth=1;x.strokeRect(-7,-4.5,14,9);x.beginPath();x.moveTo(-7,-4.5);x.lineTo(0,1);x.lineTo(7,-4.5);x.stroke();x.restore()});
  // motion ticks
  x.strokeStyle='rgba(255,255,255,.8)';x.lineWidth=1.2;for(const [ex,ey] of [[s0[0]-6,s0[1]-30],[s0[0]+4,s0[1]-46]]){x.beginPath();x.moveTo(ex,ey);x.lineTo(ex-3,ey-6);x.stroke()}
  OUT.maildrop={c,fp:[[ox-80,oy-80*K],[ox,oy],[ox+80,oy-80*K],[ox,oy-160*K]].map(([a_,b_])=>[a_,b_-10])};}

// ---------------- LOTERIA: two tables with tablas and beans, stools, the caller's easel, papel picado ----------------
function tabla(x,cx,cy,sz,seed){const r=rng(seed);const pal=['#d8443a','#f2b632','#2f8fd0','#3fa04a','#e7782f','#8a52c8','#f4e3c0','#d85c9a'];
  const P=(u,v)=>[cx+u*sz-v*sz*.7,cy-u*sz*K-v*sz*.7*K*1.0-v*sz*.25];
  poly(x,[P(0,0),P(1,0),P(1,1),P(0,1)],'#fbf3df',INK,.9);
  for(let i=0;i<4;i++)for(let j=0;j<4;j++){const u0=.06+i*.22,v0=.06+j*.22,d=.19;poly(x,[P(u0,v0),P(u0+d,v0),P(u0+d,v0+d),P(u0,v0+d)],pal[Math.floor(r()*pal.length)],'#1a1410',.6);
    if(r()<.35){const [bx,by]=P(u0+d/2,v0+d/2);x.fillStyle='#8a5a3a';x.beginPath();x.ellipse(bx,by,1.6,1.1,.5,0,7);x.fill();x.strokeStyle='#3a2414';x.lineWidth=.4;x.stroke()}}}
function table(x,cx,cy,seed){ // cx,cy = front corner on ground
  const a=46,b=40,h=20;for(const [lx,ly] of [[cx,cy],[cx+a-4,cy-(a-4)*K],[cx-b+4,cy-(b-4)*K]]){x.fillStyle='#5a3a22';x.fillRect(lx-1.6,ly-h,3.2,h);x.strokeStyle=INK;x.lineWidth=.9;x.strokeRect(lx-1.6,ly-h,3.2,h)}
  box(x,cx,cy-h,a,b,3,'#c8443a','#9a2e28','#82241f',1.1);
  // oilcloth checks
  x.save();x.beginPath();const T=[[cx,cy-h-3],[cx+a,cy-h-3-a*K],[cx+a-b,cy-h-3-(a+b)*K],[cx-b,cy-h-3-b*K]];T.forEach(([p,q],i)=>i?x.lineTo(p,q):x.moveTo(p,q));x.closePath();x.clip();
  x.fillStyle='rgba(255,246,230,.55)';for(let i=0;i<8;i++)for(let j=0;j<7;j++){if((i+j)%2)continue;const u=i/8,v=j/7;const p=(uu,vv)=>[cx+uu*a-vv*b,cy-h-3-uu*a*K-vv*b*K];const q=[p(u,v),p(u+1/8,v),p(u+1/8,v+1/7),p(u,v+1/7)];x.beginPath();q.forEach(([s,t],k)=>k?x.lineTo(s,t):x.moveTo(s,t));x.fill()}
  x.restore();
  tabla(x,cx-8,cy-h-8,17,seed);tabla(x,cx+16,cy-h-15,17,seed+3);
  // bean bowl
  const bb=[cx+6-b*.6,cy-h-3-(b*.6)*K-6];x.fillStyle='#e9d2a0';x.beginPath();x.ellipse(bb[0],bb[1],5,2.4,0,0,7);x.fill();x.strokeStyle=INK;x.lineWidth=.8;x.stroke();x.fillStyle='#7a4a2c';for(let i=0;i<5;i++){x.beginPath();x.ellipse(bb[0]-3+i*1.5,bb[1]-.6-(i%2),1.2,.8,0,0,7);x.fill()}}
function stool(x,cx,cy,col){x.fillStyle='#5a3a22';for(const d of [-3,3]){x.fillRect(cx+d-1,cy-11,2,11)}x.fillStyle=col;x.beginPath();x.ellipse(cx,cy-11,6,2.6,0,0,7);x.fill();x.strokeStyle=INK;x.lineWidth=.9;x.stroke();x.fillRect(cx-6,cy-11,12,2);x.strokeRect(cx-6,cy-11,12,2)}
function loteria(){const W=230,H=210;const [c,x]=mk(W,H);
  const ox=112,oy=200;x.fillStyle='rgba(30,40,20,.22)';x.beginPath();x.ellipse(ox,oy-40,104,36,0,0,7);x.fill();
  // papel picado on two poles
  const p1=[ox-90,oy-50],p2=[ox+92,oy-82];for(const [px,py] of [p1,p2]){x.fillStyle='#6a4a2c';x.fillRect(px-2,py-112,4,112);x.strokeStyle=INK;x.lineWidth=1;x.strokeRect(px-2,py-112,4,112)}
  const ya=p1[1]-108,yb=p2[1]-108;x.strokeStyle='#3a2a1c';x.lineWidth=1;x.beginPath();x.moveTo(p1[0],ya);x.quadraticCurveTo((p1[0]+p2[0])/2,(ya+yb)/2+22,p2[0],yb);x.stroke();
  const cols=['#e8463c','#f2b632','#2f8fd0','#3fa04a','#e05aa0','#8a52c8','#f07a2a'];
  for(let i=1;i<12;i++){const t=i/12;const px=(1-t)*(1-t)*p1[0]+2*t*(1-t)*(p1[0]+p2[0])/2+t*t*p2[0],py=(1-t)*(1-t)*ya+2*t*(1-t)*((ya+yb)/2+22)+t*t*yb;
    x.save();x.translate(px,py);x.fillStyle=cols[i%cols.length];x.beginPath();x.moveTo(-7,0);x.lineTo(7,-1);x.lineTo(7,13);x.lineTo(3.5,16);x.lineTo(0,13);x.lineTo(-3.5,16);x.lineTo(-7,13);x.closePath();x.fill();x.strokeStyle='rgba(43,32,24,.6)';x.lineWidth=.6;x.stroke();
    x.fillStyle='rgba(255,250,240,.85)';x.beginPath();x.arc(0,5.5,2.2,0,7);x.fill();x.fillRect(-4.5,2,1.6,1.6);x.fillRect(3,2,1.6,1.6);x.fillRect(-1,9.5,2,2);x.restore()}
  // the caller's easel with a big card in lotería style: number, black frame, picture, name
  const ex=ox+46,ey=oy-96;x.strokeStyle='#5a3a22';x.lineWidth=2.4;x.beginPath();x.moveTo(ex-12,ey+40);x.lineTo(ex,ey-4);x.lineTo(ex+12,ey+40);x.moveTo(ex,ey-4);x.lineTo(ex+3,ey+42);x.stroke();
