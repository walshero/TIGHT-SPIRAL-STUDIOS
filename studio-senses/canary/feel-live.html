<!DOCTYPE html><html><head><meta name="viewport" content="width=device-width">
<!-- FEEL PROBE PASS canary, with a looping ambient animation the probe must not mistake for an answer -->
<style>body{font:20px system-ui;background:#f3ead9;color:#1c1915;padding:24px}button{min-height:56px;min-width:160px;font-size:20px;margin:8px}
.sun{width:60px;height:60px;border-radius:50%;background:#c05a1e;animation:b 2s infinite alternate}@keyframes b{to{transform:translateX(200px)}}
button[aria-pressed=true]{background:#1c1915;color:#f3ead9}</style>
</head><body><div class="sun"></div><h1>Feel canary</h1>
<button aria-pressed="false" onclick="this.setAttribute('aria-pressed',this.getAttribute('aria-pressed')==='true'?'false':'true')">Toggle</button>
<button onclick="document.body.insertAdjacentHTML('beforeend','<p>Added</p>')">Add a line</button>
</body></html>
