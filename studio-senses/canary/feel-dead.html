<!-- FEEL PROBE HALT canary: one button answers, one is dead (handler only logs), one throws. -->
<style>body{font:20px system-ui;background:#f3ead9;color:#1c1915;padding:24px}button{min-height:56px;min-width:160px;font-size:20px;margin:8px}</style>
</head><body><h1>Feel canary</h1><p id="out">Waiting</p>
<button id="live" onclick="document.getElementById('out').textContent='Answered '+Date.now()">Live</button>
<button id="dead" onclick="console.log('nothing visible')">Dead</button>
<button id="boom" onclick="document.getElementById('out').textContent='boom';undefinedFn()">Throws</button>
</body></html>
