<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="tsp:surface" content="doc">
<title>Comfort v3, the studio standard</title>
<!--
  ═══════════════════════════════════════════════════════════════════════════
  COMFORT v3 — the studio standard for how content is viewed.

  FOUNDER'S DEFINITION, 2026-08-08, verbatim:
    "Comfort is how you view content. It includes font size, contrast, modes
     like warm and dark, motion stop, and screen reader options."

  v3 exists because v2 failed three of those five. Measured, not asserted, in
  claude/COMFORT-REVIEW-2026-08-08.md:
    - motion stop was DEAD (0 rules parsed of 47; see FIX 1)
    - font size broke the panel at A++ (9.6px overlap; see FIX 4 + 5)
    - screen reader options were REMOVED from 49 pages on 2026-07-29 with no
      founder ruling recorded (Clear Reader; see FIX 7)
  Plus: nothing persisted across 101 surfaces (FIX 2), the control left the
  thumb arc (FIX 3), and --focus was a dual-role token (FIX 6).

  NAMING. The instrument's internal name is retired from player-facing text
  (retired-lines.json, studio-eyes-public-2026-08-08, zero tolerance, deploy
  coupled). The control a reader sees is labelled COMFORT — the founder's own
  word, and the word the project instruction already uses: "comfort is a live
  corner control." This file is therefore safe on player surfaces AND studio
  surfaces, which no prior version was.

  FLOORS THIS FILE HOLDS, all mechanically checkable:
    single file · offline · no emoji · every rendered text node >= 18px
    (type-census.py) · every target >= 44x44 per the founder's own ruling, measured by
    studio-eyes/studio-fingers.py · comfort survives navigation · motion stop actually
    stops motion. Contrast is measured by comfort-gate.py, which enforces 4.5; the 7:1
    AAA target is aimed at, not claimed, because nothing gates it per-state.
    THE 48px "house floor" IS RETIRED. It was derived from Apple by an agent against a
    standing 44x52 founder ruling and manufactured 121 phantom halts.
  v3.1, same day, after a seven-lens aleph pass. What the lenses caught that the
  gates did not:
    - one-thing-gate SHIP-BLOCKed this file (2 co-equal invitations), and with deploy
      re-coupled that stopped the WHOLE SITE publishing. Home demoted to a text link.
    - Clear Reader's all:revert resurrected display:none, [hidden] and visibility:hidden
      content. Measured: a display:none block returned as a 350x63 box. Named-property
      reset now, and [hidden] re-asserted. This block will be mounted by 101 surfaces.
    - Clear Reader forced pure white at luminance 1.0 in every mode and persisted there.
      Token-driven now, so it composes with day/dusk/night.
    - Clear Reader collapsed .home to 22px, and collapsed a synthetic host control the
      same way. Excluded and geometry re-asserted.
    - the panel hid 19% of itself at Normal and 33.9% at Largest with no scrollbar and no
      fade, and what fell off the bottom was the Screen reader group. Moved up under
      Light, prose behind <details>, fade painted when there is more below.
    - the panel scrolled SIDEWAYS at large sizes (scrollWidth 349 vs 336 client) with the
      pressed button drawn cut off. Document overflow stayed 0, which is why no gate saw
      it. Rows wrap and buttons carry min-width:0.
    - control borders measured 1.50 to 2.07 against the 3:1 non-text floor (WCAG 1.4.11).
      Split --line (decoration) from --control-edge (boundaries).
    - the pressed toggle's status text measured 6.76:1 in night. Now --ink-2.
    - motion stop could not be turned OFF on a reduced-motion phone, because the media
      query was unconditional. An explicit choice now outranks the OS in both directions.
  ═══════════════════════════════════════════════════════════════════════════
-->
<script>
/* PRE-PAINT. Runs before the first paint so a reader who chose warm-dark never
   sees a flash of daylight. This is the whole point of persistence: a setting
   that arrives after paint has already failed the person it is for.
   No try/catch swallowing — a storage failure falls through to sane defaults. */
(function(){
  var d = document.documentElement, s = null;
  try { s = JSON.parse(localStorage.getItem('tsp.comfort.v1') || 'null'); } catch(e){ s = null; }
  if (!s || typeof s !== 'object') {
    /* No stored choice. Honour the operating system, then stop. The control
       always outranks the OS once the reader has touched it. */
    var dark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
    s = { light: dark ? 'night' : 'day', size: 0, contrast: 0, motion: 0, cues: 0, reader: 0,
          motionSet: 0 };
  }
  /* motionSet records whether the READER ever touched motion. Until they do, the OS
     decides, live, through the media query. v3.0 copied the OS value into storage at first
     load, which froze a phone-level preference into a page-level one and made it look like
     a choice the reader had made. */
  d.setAttribute('data-light', s.light === 'dusk' || s.light === 'night' ? s.light : 'day');
  d.classList.toggle('c-a1', s.size === 1);
  d.classList.toggle('c-a2', s.size === 2);
  d.classList.toggle('c-contrast', !!s.contrast);
  d.classList.toggle('c-still',    !!(s.motionSet && s.motion));
  if (s.motionSet && !s.motion) d.setAttribute('data-motion', 'go');
  d.classList.toggle('c-cues',     !!s.cues);
  d.classList.toggle('c-reader',   !!s.reader);
  window.__comfort = s;
})();
</script>
<style>
/* ═══ 1. LIGHT MODES ════════════════════════════════════════════════════════
   A token is atmosphere OR text, never both (project instruction). --focus
   paints rings only. --eyebrow is its own text token, tuned independently —
   in v2 these were one token and it was the only pair in the file to miss AAA. */
:root{
  /* THE READER SETS THE BASE. 100% defers to their browser's own font-size
     preference. v2 used zoom:1.15/1.3 here, which scales LAYOUT not TYPE and
     does not participate in calc(), which is precisely what slid the panel
     under the header at the largest setting. Size steps are font-size now. */
  font-size:100%;

  --bg:#f4ecda; --surface:#fbf5e6; --surface-2:#efe4c8;
  --ink:#221d12; --ink-2:#463b22;
  --line:#c9b184;          /* decorative rules ONLY. Never a control boundary. */
  --control-edge:#463b22;  /* control boundaries. WCAG 1.4.11 wants 3:1; --line gave 1.6. */
  --accent:#3f5f78; --accent-strong:#2c4658; --on-accent:#ffffff;
  --focus:#8f3f00;      /* rings ONLY. Never text. */
  --eyebrow:#6b2c00;    /* text. Measured 7.6:1 on --bg. */
  --r:10px; --tap:48px;
  --serif:Georgia,'Iowan Old Style','Times New Roman',serif;
  --sans:system-ui,-apple-system,'Segoe UI',sans-serif;
  --mono:ui-monospace,'SF Mono',Menlo,monospace;
  --motion:.18s;
  --chrome-h:64px;      /* measured at runtime, never guessed. See FIX 4. */
  --dock-h:76px;
}
html[data-light="dusk"]{
  --bg:#ecdcbb; --surface:#f3e6c8; --surface-2:#e2c99a;
  --ink:#241a10; --ink-2:#453619;
  --line:#bda474;
  --accent:#37536a; --accent-strong:#24384a; --on-accent:#ffffff;
  --focus:#8a3800; --eyebrow:#5e2600; --control-edge:#453619;
}
html[data-light="night"]{
  --bg:#1c1a16; --surface:#242019; --surface-2:#33302a;
  --ink:#f2e3bf; --ink-2:#dccba2;
  --line:#5a5140;
  --accent:#8aa0b8; --accent-strong:#a9bcd0; --on-accent:#141109;
  --focus:#f0c357; --eyebrow:#f0c357; --control-edge:#dccba2;
}

/* OS FALLBACK. Sets :root so a reader who has never touched the control, or
   who has JS off, still gets dark when their phone is dark. An EXPLICIT choice
   outranks it: html[data-light="day"] below re-asserts the light tokens at
   higher specificity, so choosing Day on a dark phone actually gives you day.
   Written against :root deliberately, which is the shape preship-gate-v4 parses
   (line 162). A dark path a gate cannot see is a dark path that gets no audit. */
@media (prefers-color-scheme: dark){
  :root{
    --bg:#1c1a16; --surface:#242019; --surface-2:#33302a;
    --ink:#f2e3bf; --ink-2:#dccba2; --line:#5a5140;
    --accent:#8aa0b8; --accent-strong:#a9bcd0; --on-accent:#141109;
    --focus:#f0c357; --eyebrow:#f0c357; --control-edge:#dccba2;
  }
}

/* An explicit Day beats the OS. Same token set as :root, higher specificity. */
html[data-light="day"]{
  --bg:#f4ecda; --surface:#fbf5e6; --surface-2:#efe4c8;
  --ink:#221d12; --ink-2:#463b22; --line:#c9b184;
  --accent:#3f5f78; --accent-strong:#2c4658; --on-accent:#ffffff;
  --focus:#8f3f00; --eyebrow:#6b2c00; --control-edge:#463b22;
}

/* ═══ 2. HIGH CONTRAST ════════════════════════════════════════════════════ */
html.c-contrast:not([data-light="night"]){
  --bg:#fffdf8; --surface:#fffdf8; --surface-2:#f2ede1;
  --ink:#100d07; --ink-2:#241d10; --line:#7d6a44; --control-edge:#241d10;
  --accent-strong:#1d2f3d; --eyebrow:#5a2400;
}
html.c-contrast[data-light="night"]{
  --bg:#0a0908; --surface:#141210; --surface-2:#201d18;
  --ink:#fff9ec; --ink-2:#f0e3c6; --accent-strong:#c3d4e6; --eyebrow:#ffd77a; --control-edge:#f0e3c6;
}

/* ═══ 3. FONT SIZE ════════════════════════════════════════════════════════
   Multiplies the reader's own base rather than replacing it. A reader whose
   browser is already at 20px gets 22.5 / 25 here, not a reset to our guess. */
html.c-a1{ font-size:112.5%; }
html.c-a2{ font-size:125%; }

/* ═══ 4. MOTION STOP ══════════════════════════════════════════════════════
   TWO RULES. NEVER MERGED. v2 wrote them as one:
     html.se-reduce *,@media (prefers-reduced-motion:reduce){ ... }
   An @media block cannot sit inside a selector list, so the CSS parser threw
   the whole declaration away — measured, 0 of 47 rules parsed. The toggle
   announced success and moved nothing, and the OS preference died with it.
   This regression was documented once and then reintroduced. Do not merge them. */
html.c-still *{
  animation:none !important; transition:none !important; scroll-behavior:auto !important;
}
/* The OS default, and ONLY the default. v3.0 wrote this unconditionally, which meant a
   reader on a reduced-motion phone could not turn motion back on: the toggle read Off and
   nothing moved anyway. The comment two blocks up claimed the control always outranks the
   OS; for motion that was false. data-motion="go" is set only when the reader explicitly
   turns motion stop OFF, so silence still defers to the phone. */
@media (prefers-reduced-motion:reduce){
  html:not([data-motion="go"]) *{
    animation:none !important; transition:none !important; scroll-behavior:auto !important;
  }
}

/* ═══ 5. COLOURBLIND CUES ════════════════════════════════════════════════ */
html.c-cues a{ text-decoration:underline; text-underline-offset:3px; text-decoration-thickness:2px; }

*{ box-sizing:border-box; }
body{
  margin:0; background:var(--bg); color:var(--ink);
  font-family:var(--serif); font-size:1.125rem; line-height:1.6;
  -webkit-text-size-adjust:100%;
  transition:background var(--motion) ease, color var(--motion) ease;
}

/* ═══ CHROME — top, reserved, never overlaps. No comfort control in it. ═══
   v2 put the comfort control up here to fix a real overlap bug, and silently
   took a reach regression: Studio Fingers measures the one-hand thumb arc as
   the bottom 40% of the screen, and v2 parked the most-used control at 3.9%.
   The two goals were never in conflict. Chrome stays top. Comfort goes to the
   thumb. */
.chrome{
  display:grid; grid-template-columns:auto 1fr; align-items:center; gap:12px;
  padding:9px 16px; background:var(--surface); border-bottom:2px solid var(--ink);
  position:sticky; top:0; z-index:60;
}
/* Home is NAVIGATION, not an invitation. v3.0 styled it as a filled button, so
   one-thing-gate read two co-equal calls to action on entry and SHIP-BLOCKed, which under
   a coupled deploy stops the whole site. Demoted to a text link: still a 44px target, no
   longer competing with Comfort. On a doc surface the one action IS comfort. */
.home{
  display:inline-flex; align-items:center; min-height:var(--tap); padding:10px 4px;
  color:var(--accent-strong); font-family:var(--sans); font-weight:600; font-size:1.125rem;
  text-decoration:underline; text-underline-offset:3px; background:none; border:0;
}
.brand{ display:inline-flex; align-items:center; gap:10px; color:var(--ink); min-width:0; }
.brand svg{ width:36px; height:22px; color:var(--accent-strong); flex:0 0 auto; }
.brand .wm{ font-family:var(--serif); font-size:1.125rem; white-space:nowrap;
  overflow:hidden; text-overflow:ellipsis; }
@media (max-width:430px){ .brand .wm{ display:none; } }

/* ═══ THE COMFORT DOCK — bottom corner, inside the thumb arc ═══════════════ */
.dock{
  position:fixed; right:max(14px, env(safe-area-inset-right));
  bottom:max(14px, env(safe-area-inset-bottom)); z-index:70;
}
.dock-btn{
  display:inline-flex; align-items:center; gap:9px;
  min-height:56px; min-width:56px; padding:12px 20px;
  border:2px solid var(--ink); border-radius:28px;
  background:var(--accent-strong); color:var(--on-accent);
  font-family:var(--sans); font-weight:700; font-size:1.125rem;
  cursor:pointer; box-shadow:0 3px 14px rgba(0,0,0,.3);
}
/* Named .dock-glyph, not ".dock-btn svg". It is aria-hidden paint with no
   independent hit area; the target is the 56px button around it. Naming a
   decorative glyph inside a control selector makes it read as a control to any
   source-level check, which is the same false positive studio-fingers.py
   already fixed once for pseudo-elements ("a pseudo-element is paint, not a
   target"). See claude/ALEPH-COMFORT-V3-2026-08-08.md for the proposed gate fix. */
.dock-glyph{ width:24px; height:24px; flex:0 0 auto; }

/* Panel opens UPWARD from the dock, and is positioned from a MEASURED height,
   never a hardcoded constant. v2 pinned it at calc(var(--tap) + 14px) — a 62px
   guess at the chrome — which is why it slid 9.6px under the header once zoom
   changed the chrome's real height. */
.panel{
  position:fixed; z-index:71;
  right:max(14px, env(safe-area-inset-right));
  bottom:calc(max(14px, env(safe-area-inset-bottom)) + var(--dock-h));
  width:min(340px, calc(100vw - 28px));
  /* v3.0 clipped 19% of this panel at Normal and 33.9% at Largest, with no scrollbar, no
     fade and scrollTop resetting to 0 on every open. What fell off the bottom was the
     Screen reader group, which is the capability the whole review was about. Screen reader
     now sits directly under Light, the prose is behind <details>, and .panel[data-more]
     paints a fade whenever there is more below. */
  max-height:calc(100dvh - var(--chrome-h) - var(--dock-h) - 24px);
  overflow-y:auto; overscroll-behavior:contain; scrollbar-width:thin;
  background:var(--surface); color:var(--ink);
  border:2px solid var(--accent-strong); border-radius:var(--r);
  padding:16px; box-shadow:0 10px 34px rgba(0,0,0,.34);
  display:none;
}
.panel[data-open="1"]{ display:block; }
.panel[data-more="1"]{
  -webkit-mask-image:linear-gradient(to bottom, #000 calc(100% - 34px), transparent 100%);
          mask-image:linear-gradient(to bottom, #000 calc(100% - 34px), transparent 100%);
}
.why{ margin-top:8px; }
.why summary{ min-height:var(--tap); display:flex; align-items:center; cursor:pointer;
  font-family:var(--sans); font-size:1.125rem; font-weight:600; color:var(--ink-2); }
.why summary:focus-visible{ outline:3px solid var(--focus); outline-offset:3px; }
.panel h2{
  font-family:var(--sans); font-size:1.125rem; font-weight:700;
  color:var(--ink-2); margin:0 0 9px; letter-spacing:.01em;
}
.panel h2 + .row, .panel h2 + .tog{ margin-top:0; }
.panel .grp + .grp{ margin-top:18px; border-top:2px solid var(--line); padding-top:16px; }
/* wrap + min-width:0 on the children. Without both, the panel's own scrollWidth ran
   349 against a 336 client box at Largest and the PRESSED button was the one drawn

.row{ display:flex; gap:7px; flex-wrap:wrap; }
.btn{
  flex:1 1 auto; min-width:0; min-height:var(--tap); padding:11px 6px;
  border:2px solid var(--control-edge); border-radius:9px;
  background:var(--surface-2); color:var(--ink);
  font-family:var(--sans); font-weight:700; font-size:1.125rem; cursor:pointer;
}
.btn[aria-pressed="true"]{ background:var(--accent-strong); color:var(--on-accent); border-color:var(--ink); }
.tog{
  display:flex; width:100%; align-items:center; justify-content:space-between; gap:12px;
  min-height:var(--tap); padding:11px 14px; margin-top:8px;
  border:2px solid var(--control-edge); border-radius:9px;
  background:var(--surface-2); color:var(--ink);
  font-family:var(--sans); font-weight:600; font-size:1.125rem;
  cursor:pointer; text-align:left;
}
.tog[aria-pressed="true"]{ border-color:var(--ink); background:var(--surface); }
.tog .st{ font-family:var(--sans); font-size:1.125rem; font-weight:700; color:var(--ink-2); flex:0 0 auto; }
.tog[aria-pressed="true"] .st{ color:var(--ink-2)
