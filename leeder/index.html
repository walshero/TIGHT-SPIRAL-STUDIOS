<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="color-scheme" content="light dark">
<title>Leeder Management | Boston Apartments</title>
<style>
  :root{
    --bg:#fbfbf9; --ink:#12161b; --text:#242a31; --dim:#5b6470;
    --teal:#0e6d80; --teal-dark:#0a5261; --sky:#e8f2f4; --line:#e3e1da; --white:#ffffff;
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  html{scroll-behavior:smooth;}
  @media (prefers-reduced-motion:reduce){ html{scroll-behavior:auto;} *{transition:none !important; animation:none !important;} }
  body{background:var(--bg); color:var(--text); font-size:1.15rem; line-height:1.65;
    font-family:"Avenir Next","Segoe UI",system-ui,-apple-system,"Helvetica Neue",Arial,sans-serif;}
  img{display:block; width:100%;}
  a{color:var(--teal-dark);}
  .skip{position:absolute; left:-999px; top:0; background:var(--ink); color:#fff; padding:1rem 2rem; z-index:99;}
  .skip:focus{left:0;}

  /* NAV */
  nav{position:sticky; top:0; z-index:30; background:rgba(251,251,249,.94); backdrop-filter:blur(8px);
    border-bottom:1px solid var(--line); display:flex; align-items:center; gap:1.6rem; padding:.8rem 4vw; flex-wrap:wrap;}
  .wordmark{font-weight:800; font-size:1.15rem; letter-spacing:.01em; color:var(--ink); text-decoration:none; display:inline-block; padding:.65rem .1rem; max-width:85px;}
  .wordmark span{color:var(--teal);}
  nav .links{display:flex; gap:.4rem; flex-wrap:wrap;}
  nav .links a{color:var(--text); text-decoration:none; font-size:1.125rem; font-weight:500;
    padding:.8rem 1.1rem; border-radius:99px;}
  nav .links a:hover{background:var(--sky);}
  nav .links a[aria-current]{text-decoration:underline; text-decoration-thickness:3px; text-underline-offset:6px; text-decoration-color:var(--teal);}
  nav .links a:focus-visible{outline:3px solid var(--teal); outline-offset:3px;}
  nav .apply{margin-left:auto;}
  .btn{display:inline-block; font-size:1.15rem; font-weight:700; padding:.85rem 1.7rem; border-radius:10px;
    text-decoration:none; border:2px solid transparent; cursor:pointer;}
  .btn.primary{background:var(--teal); color:#fff;}
  .btn.primary:hover{background:var(--teal-dark);}
  .btn.light{background:#fff; color:var(--ink); border-color:#fff;}
  .btn.outline{border-color:var(--ink); color:var(--ink);}
  .btn:focus-visible{outline:4px solid var(--teal); outline-offset:3px;}
  .applylink{margin-left:auto; font-weight:500; font-size:1.125rem; color:var(--teal-dark); text-underline-offset:5px; padding:.8rem .6rem;}
  .quietlink{color:#dbe4e8; font-size:1.15rem; text-underline-offset:5px; padding:.85rem .4rem; align-self:center;}
  .applylink:focus-visible,.quietlink:focus-visible{outline:4px solid var(--teal); outline-offset:3px;}

  html{color-scheme:light dark;}
  @media (prefers-color-scheme:dark){
    :root{
      --bg:#0f1317; --ink:#0b0e12; --text:#e4e9ee; --dim:#aab4bf;
      --teal:#1487a0; --teal-dark:#8fd8e6; --sky:#152730; --line:#2a333d; --white:#181f27;
    }
    nav{background:rgba(15,19,23,.94);}
    .wordmark{color:#f2f6f9;}
    nav .links a{color:#e4e9ee;}
    h2,.prop-head h1{color:#f2f6f9;}
    .card h3{color:#f2f6f9;}
    .card .chip{background:rgba(15,19,23,.9); color:#f2f6f9;}
    td.price{color:#f2f6f9;}
    thead th{background:#0c5666;}
    .btn.light{background:#f2f6f9; color:#12161b; border-color:#f2f6f9;}
    .btn.outline{border-color:#e4e9ee; color:#e4e9ee;}
    .livebadge{background:#2c3640; color:#cfd8e0;}
    .livebadge.live{background:#1f8a52; color:#fff;}
    .values,footer{background:#0b0e12;}
    .kicker{background:#0c5666;}
    .btn.primary{background:#0c5666;}
    .btn.primary:hover{background:#0a4552;}
    .appform legend{color:#f2f6f9;}
  }

  /* Explicit light ladder: html[data-light="dusk"|"night"] mirrors the dark palette */
  html[data-light="dusk"], html[data-light="night"]{
    --bg:#0f1317; --ink:#0b0e12; --text:#e4e9ee; --dim:#aab4bf;
    --teal:#1487a0; --teal-dark:#8fd8e6; --sky:#152730; --line:#2a333d; --white:#181f27;
    color-scheme:dark;
  }
  html[data-light="dusk"] nav, html[data-light="night"] nav{background:rgba(15,19,23,.94);}
  html[data-light="dusk"] .wordmark, html[data-light="night"] .wordmark{color:#f2f6f9;}
  html[data-light="dusk"] nav .links a, html[data-light="night"] nav .links a{color:#e4e9ee;}
  html[data-light="dusk"] h2, html[data-light="night"] h2,
  html[data-light="dusk"] .prop-head h1, html[data-light="night"] .prop-head h1{color:#f2f6f9;}
  html[data-light="dusk"] .card h3, html[data-light="night"] .card h3{color:#f2f6f9;}
  html[data-light="dusk"] .card .chip, html[data-light="night"] .card .chip{background:rgba(15,19,23,.9); color:#f2f6f9;}
  html[data-light="dusk"] td.price, html[data-light="night"] td.price{color:#f2f6f9;}
  html[data-light="dusk"] thead th, html[data-light="night"] thead th{background:#0c5666;}
  html[data-light="dusk"] .btn.light, html[data-light="night"] .btn.light{background:#f2f6f9; color:#12161b; border-color:#f2f6f9;}
  html[data-light="dusk"] .btn.outline, html[data-light="night"] .btn.outline{border-color:#e4e9ee; color:#e4e9ee;}
  html[data-light="dusk"] .livebadge, html[data-light="night"] .livebadge{background:#2c3640; color:#cfd8e0;}
  html[data-light="dusk"] .livebadge.live, html[data-light="night"] .livebadge.live{background:#1f8a52; color:#fff;}
  html[data-light="dusk"] .values, html[data-light="night"] .values,
  html[data-light="dusk"] footer, html[data-light="night"] footer{background:#0b0e12;}
  html[data-light="dusk"] .kicker, html[data-light="night"] .kicker{background:#0c5666;}
  html[data-light="dusk"] .btn.primary, html[data-light="night"] .btn.primary{background:#0c5666;}
  html[data-light="dusk"] .btn.primary:hover, html[data-light="night"] .btn.primary:hover{background:#0a4552;}
  html[data-light="dusk"] .appform legend, html[data-light="night"] .appform legend{color:#f2f6f9;}
  html[data-light="day"]{color-scheme:light;}
  .page{display:none;} .page.active{display:block; animation:fade .35s ease;}
  @keyframes fade{from{opacity:0; transform:translateY(8px);} to{opacity:1; transform:none;}}

  /* HERO: image and text never overlap; text sits on a solid ink panel */
  .hero{background:#12161b;}
  .hero>img{width:100%; height:33vh; min-height:170px; object-fit:cover;}
  .hero .inner{padding:1.8rem 5vw 2.4rem; max-width:66rem;}
  .kicker{display:inline-block; background:var(--teal); color:#fff; font-weight:700; font-size:1.125rem;
    letter-spacing:.14em; text-transform:uppercase; padding:.35rem .9rem; border-radius:6px; margin-bottom:1.1rem;}
  h1{font-size:clamp(2.2rem,4.2vw,3.4rem); line-height:1.06; color:#fff; font-weight:800; letter-spacing:-.015em;}
  .hero p{color:#e8edf0; font-size:1.35rem; max-width:48ch; margin-top:1.2rem;}
  .cta-row{display:flex; gap:1rem; margin-top:2rem; flex-wrap:wrap;}
  @media (max-width:700px){
    nav{position:static; gap:.4rem .8rem; padding:.5rem 4vw .6rem;}
    .wordmark{padding:.5rem .1rem;}
    nav .links{gap:.1rem .2rem;}
    nav .links a{padding:.55rem .7rem;}
    .applylink{padding:.55rem .5rem;}
    .hero>img{height:24vh; min-height:140px;}
    .hero .inner{padding:1.2rem 5vw 1.6rem;}
    .hero h1{font-size:1.9rem;}
    .hero p{font-size:1.15rem; margin-top:.7rem;}
    .cta-row{margin-top:1rem;}
    .prop-head{padding-top:1.2rem; gap:1.2rem;}
    .prop-head h1{font-size:1.9rem;}
    .prop-head p{font-size:1.15rem;}
    section{padding:2.5rem 5vw;}
  }

  section{padding:4.5rem 5vw;}
  h2{font-size:clamp(1.9rem,3.4vw,2.6rem); font-weight:800; letter-spacing:-.01em; color:var(--ink);}
  .sub{color:var(--dim); font-size:1.25rem; max-width:64ch; margin-top:.7rem;}

  /* HOME CARDS */
  .cards{display:grid; grid-template-columns:repeat(auto-fit,minmax(300px,1fr)); gap:1.8rem; margin-top:2.6rem;}
