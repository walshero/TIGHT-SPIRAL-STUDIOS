<style>
  :root{

    --s1:#54C9A8; --s2:#E3A94A; --s3:#7E9AAE; --alert:#F0A0A0;
    --pad:clamp(14px,3.5vw,26px);
    --mono:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0}
  body{background:var(--abyss);color:var(--chalk);font-family:system-ui,-apple-system,"Segoe UI",sans-serif;font-size:18px;line-height:1.5;-webkit-text-size-adjust:100%}

  .tsp-wrap{max-width:720px;margin:0 auto;padding:var(--pad) var(--pad) 64px}

  .tsp-wrap h2{text-transform:uppercase;letter-spacing:.12em;font-weight:800;font-size:15px;color:var(--sounding);margin:0 0 14px;padding-bottom:10px;border-bottom:1px solid var(--rule)}
  .tsp-wrap h2:focus-visible{outline:3px solid var(--chalk);outline-offset:4px}

  .tsp-status{font-family:var(--mono);font-size:14px;color:var(--sounding);letter-spacing:.06em;margin:0 0 14px;min-height:1.4em}
  .tsp-alert{border:2px solid var(--alert);border-radius:4px;background:rgba(240,160,160,.12);padding:14px 18px;margin:0 0 16px;font-size:17px}

  /* hero chart — the image that carries the state */
  .tsp-hero{display:block;width:100%;height:auto;aspect-ratio:400/360;background:var(--plate-bg);border:2px solid var(--rule);border-radius:6px;margin:0 0 18px}
  .tsp-hero--small{aspect-ratio:400/260;margin-bottom:20px}

  .tsp-wrap button{font-family:inherit;font-size:18px;color:var(--chalk);background:var(--shelf);border:2px solid var(--rule);border-radius:4px;min-height:64px;padding:12px 18px;width:100%;display:flex;align-items:center;gap:12px;cursor:pointer;text-align:left;transition:background .12s linear}
  .tsp-wrap button:hover{background:var(--shelf-hi)}
  .tsp-wrap button:focus-visible{outline:3px solid var(--chalk);outline-offset:3px}

  .tsp-blabel{text-transform:uppercase;letter-spacing:.1em;font-weight:800;font-size:17px}
  .tsp-bnote{font-family:var(--mono);font-size:12px;color:var(--sounding);letter-spacing:.08em}
  .tsp-glyph{flex:0 0 auto;width:26px;height:26px}

  .tsp-roster{display:grid;gap:12px;grid-template-columns:repeat(2,1fr)}
  .tsp-roster button{flex-direction:column;align-items:flex-start;justify-content:center;gap:4px;min-height:76px}
  @media (max-width:339px){.tsp-roster{grid-template-columns:1fr}}

  .tsp-plate{border:2px solid var(--rule);border-radius:6px;background:var(--shelf);overflow:hidden;margin-bottom:18px}
  .tsp-art{display:block;width:100%;height:auto;aspect-ratio:400/262;background:var(--plate-bg);border-bottom:2px solid var(--rule)}
  .tsp-ptext{padding:18px var(--pad) 22px}

  .tsp-chip{display:inline-block;font-family:var(--mono);text-transform:uppercase;letter-spacing:.18em;font-size:12px;font-weight:700;padding:5px 10px;border-radius:3px;color:var(--on-accent)}
  .tsp-count{font-family:var(--mono);color:var(--sounding);letter-spacing:.14em;font-size:13px;float:right;padding-top:7px}
  .tsp-pname{text-transform:uppercase;letter-spacing:.05em;font-weight:800;font-size:clamp(21px,5vw,29px);line-height:1.15;margin:14px 0 8px}
  .tsp-pname:focus-visible{outline:3px solid var(--chalk);outline-offset:4px}
  .tsp-pnote{color:var(--sounding);margin:0}

  .tsp-scale{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(150px,1fr))}
  .tsp-scale button{flex-direction:column;align-items:center;justify-content:center;gap:8px;text-align:center;min-height:92px}

  .tsp-scale button[data-s="0"]{border-color:var(--s1);background:rgba(84,201,168,.14)}

  .tsp-keyhint{font-family:var(--mono);font-size:13px;color:var(--sounding);letter-spacing:.06em;margin:16px 0 0;text-align:center}

  .tsp-rank{list-style:none;margin:0;padding:0}

  .tsp-depth{font-family:var(--mono);font-size:22px;font-weight:700;text-align:right}
  .tsp-rname{text-transform:uppercase;letter-spacing:.04em;font-weight:700;font-size:17px;line-height:1.25}
  .tsp-rwhere{font-family:var(--mono);font-size:12px;letter-spacing:.16em;display:block;margin-top:4px}

  .tsp-marks{display:flex;gap:7px}
  .tsp-mark{width:34px;height:34px;border-radius:3px;border:2px solid var(--s3);display:flex;align-items:center;justify-content:center;font-family:var(--mono);font-size:14px;font-weight:700;color:var(--sounding)}
  .tsp-mark[data-m="0"]{border-color:var(--s1);background:var(--s1);color:var(--on-accent)}
  .tsp-mark[data-m="1"]{border-color:var(--s2);background:rgba(227,169,74,.34);color:var(--chalk)}
  .tsp-mark[data-m="2"]{border-color:var(--s3);background:transparent;color:var(--s3)}

  .tsp-legend{display:flex;flex-wrap:wrap;gap:15px;margin:18px 0 0;font-family:var(--mono);font-size:13px;color:var(--sounding);letter-spacing:.06em}
  .tsp-legend span{display:flex;align-items:center;gap:8px}
  .tsp-sw{width:18px;height:18px;border-radius:3px;border:2px solid var(--s3)}

  .tsp-foot{color:var(--sounding);font-size:15px;margin:24px 0 0;padding-top:18px;border-top:1px solid var(--rule)}
  .tsp-colophon{font-family:var(--mono);font-size:12px;color:var(--sounding);letter-spacing:.1em;margin:12px 0 0;opacity:.75}

/* ==================================================================

const FATHOM = "v01";

const F = {
  defs(){
    return `<defs><pattern id="f-hatch" width="7" height="7" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <line x1="0" y1="0" x2="0" y2="7" stroke="#9DBBD0" stroke-width=".9" opacity=".4"/></pattern></defs>`;
  },

  graticule(x,y,w,h,step){
    const s = step || 56; let g = "";
    for (let vx = x+s; vx < x+w; vx += s) g += `<line x1="${vx}" y1="${y}" x2="${vx}" y2="${y+h}" stroke="#9DBBD0" stroke-width=".6" opacity=".13"/>`;
    for (let vy = y+s; vy < y+h; vy += s) g += `<line x1="${x}" y1="${vy}" x2="${x+w}" y2="${vy}" stroke="#9DBBD0" stroke-width=".6" opacity=".13"/>`;
    for (let vx = x+s/2; vx < x+w; vx += s/2) g += `<line x1="${vx}" y1="${y+h-5}" x2="${vx}" y2="${y+h}" stroke="#9DBBD0" stroke-width="1" opacity=".3"/>`;
    return `<g>${g}<rect x="${x}" y="${y}" width="${w}" height="${h}" fill="none" stroke="#9DBBD0" stroke-width="1" opacity=".22"/></g>`;
  },

  /* depth halos follow the coast: same closed path at decreasing stroke
     widths behind an opaque fill, so only the outer half survives */
  landmass(id,d,accent){
    return `<g>
      <path d="${d}" fill="none" stroke="${accent}" stroke-width="38" opacity=".055" stroke-linejoin="round"/>
      <path d="${d}" fill="none" stroke="${accent}" stroke-width="25" opacity=".075" stroke-linejoin="round"/>
      <path d="${d}" fill="none" stroke="${accent}" stroke-width="13" opacity=".10" stroke-linejoin="round"/>
      <clipPath id="f-clip-${id}"><path d="${d}"/></clipPath>
      <path d="${d}" fill="#0D2136"/>
      <g clip-path="url(#f-clip-${id})"><path d="${d}" fill="none" stroke="url(#f-hatch)" stroke-width="17"/></g>
      <path d="${d}" fill="none" stroke="${accent}" stroke-width="2.2" stroke-linejoin="round"/></g>`;
  },

  /* the numeral IS the measurement */
  sounding(x,y,o){
    const a = o.accent, sc = o.score || 0;
    return `<g>
      ${o.focus ? `<circle cx="${x}" cy="${y}" r="16" fill="none" stroke="${a}" stroke-width="1.3" opacity=".55"/>` : ""}
      <circle cx="${x}" cy="${y}" r="10" fill="#0D2136" stroke="${a}" stroke-width="${o.focus ? 2.8 : 1.8}"${o.marked ? "" : ` stroke-dasharray="2.4 2.6" opacity=".62"`}/>
      ${sc > 0 ? `<text x="${x}" y="${y+4.9}" text-anchor="middle" fill="${a}" font-family="ui-monospace,Menlo,monospace" font-size="13" font-weight="700">${sc}</text>` : ""}</g>`;
  },

  rose(cx,cy,R){
    const p = (deg,len,wid) => {
      const r = d => d*Math.PI/180;
      const tx = cx+len*Math.sin(r(deg)), ty = cy-len*Math.cos(r(deg));
      const lx = cx+wid*Math.sin(r(deg-90)), ly = cy-wid*Math.cos(r(deg-90));
      const rx = cx+wid*Math.sin(r(deg+90)), ry = cy-wid*Math.cos(r(deg+90));
      return `M${lx.toFixed(1)} ${ly.toFixed(1)} L${tx.toFixed(1)} ${ty.toFixed(1)} L${rx.toFixed(1)} ${ry.toFixed(1)} Z`;
    };
    let g = "";
    [45,135,225,315].forEach(d => g += `<path d="${p(d,R*.6,R*.16)}" fill="none" stroke="#9DBBD0" stroke-width="1.1" opacity=".65"/>`);
    [0,90,180,270].forEach(d => g += `<path d="${p(d,R,R*.13)}" fill="#9DBBD0" opacity=".8"/>`);
    return `<g><circle cx="${cx}" cy="${cy}" r="${R*.46}" fill="none" stroke="#9DBBD0" stroke-width=".9" opacity=".45"/>
      <circle cx="${cx}" cy="${cy}" r="${R*.56}" fill="none" stroke="#9DBBD0" stroke-width=".6" opacity=".3"/>${g}
      <text x="${cx}" y="${cy-R-5}" text-anchor="middle" fill="#9DBBD0" opacity=".85" font-family="ui-monospace,Menlo,monospace" font-size="9">N</text></g>`;
  },

  scalebar(x,y,w,label){
    const n = 4, seg = w/n; let g = "";
    for (let i = 0; i < n; i++) g += `<rect x="${x+i*seg}" y="${y}" width="${seg}" height="5" fill="${i%2 ? "none" : "#9DBBD0"}" stroke="#9DBBD0" stroke-width=".8" opacity=".7"/>`;
    return `<g>${g}<text x="${x}" y="${y+17}" fill="#9DBBD0" opacity=".75" font-family="ui-monospace,Menlo,monospace" font-size="8.5" letter-spacing="1.6">${label}</text></g>`;
  },

  /* studio mark: Archimedean spiral, r = 1.28 theta, 2.75 turns */
  spiral(cx,cy,scale,color){
    const d = "M0.0 0.0 L0.3 0.1 L0.5 0.2 L0.7 0.5 L0.7 0.8 L0.7 1.2 L0.5 1.5 L0.2 1.9 L-0.2 2.1 L-0.7 2.3 L-1.3 2.3 L-2.0 2.2 L-2.6 1.9 L-3.2 1.4 L-3.7 0.8 L-4.0 0.0 L-4.2 -0.9 L-4.2 -1.9 L-3.9 -2.8 L-3.4 -3.8 L-2.7 -4.6 L-1.7 -5.4 L-0.6 -5.9 L0.6 -6.1 L2.0 -6.1 L3.4 -5.8 L4.7 -5.2 L5.9 -4.3 L6.9 -3.1 L7.6 -1.6 L8.0 0.0 L8.1 1.7 L7.8 3.5 L7.2 5.2 L6.1 6.8 L4.7 8.1 L3.0 9.2 L1.0 9.9 L-1.1 10.1 L-3.2 9.9 L-5.4 9.3 L-7.4 8.2 L-9.1 6.6 L-10.5 4.7 L-11.5 2.5 L-12.1 0.0 L-12.1 -2.6 L-11.5 -5.1 L-10.4 -7.6 L-8.8 -9.8 L-6.7 -11.6 L-4.2 -13.0 L-1.5 -13.9 L1.5 -14.1 L4.5 -13.8 L7.4 -12.8 L10.0 -11.2 L12.4 -9.0 L14.2 -6.3 L15.5 -3.3 L16.1 0.0 L16.0 3.4 L15.2 6.8 L13.7 9.9 L11.5 12.8 L8.7 15.1 L5.5 16.8 L1.9 17.9 L-1.9 18.1 L-5.7 17.6 L-9.4 16.3 L-12.7 14.1 L-15.6 11.3 L-17.9 8.0 L-19.4 4.1 L-20.1 0.0 L-19.9 -4.2 L-18.9 -8.4 L-16.9 -12.3 L-14.2 -15.7 L-10.7 -18.6 L-6.7 -20.7 L-2.3 -21.9";
    return `<g transform="translate(${cx} ${cy}) scale(${scale})"><path d="${d}" fill="none" stroke="${color||"#9DBBD0"}" stroke-width="${(1.7/scale).toFixed(2)}" stroke-linecap="round" opacity=".9"/></g>`;
  },

  cartouche(x,y,w,h,o){
    const t = 7;
    const corner = (px,py,sx,sy) => `<path d="M${px+sx*t} ${py} L${px} ${py} L${px} ${py+sy*t}" fill="none" stroke="#9DBBD0" stroke-width="1.6" opacity=".8"/>`;
    return `<g>
      <rect x="${x}" y="${y}" width="${w}" height="${h}" fill="#0A1A2B" fill-opacity=".8" stroke="#9DBBD0" stroke-opacity=".4" stroke-width="1.5"/>
      <rect x="${x+4}" y="${y+4}" width="${w-8}" height="${h-8}" fill="none" stroke="#9DBBD0" stroke-opacity=".22" stroke-width=".7"/>
      ${corner(x,y,1,1)}${corner(x+w,y,-1,1)}${corner(x,y+h,1,-1)}${corner(x+w,y+h,-1,-1)}
      <text x="${x+16}" y="${y+38}" fill="#F2EFE6" font-family="system-ui,sans-serif" font-size="26" font-weight="800" letter-spacing="4.6">${o.title}</text>
      <line x1="${x+16}" y1="${y+48}" x2="${x+w-46}" y2="${y+48}" stroke="#9DBBD0" stroke-opacity=".35" stroke-width="1"/>
      <text x="${x+16}" y="${y+64}" fill="#9DBBD0" font-family="ui-monospace,Menlo,monospace" font-size="9" letter-spacing="2.2">${o.left||""}</text>
      <text x="${x+w-46}" y="${y+64}" text-anchor="end" fill="#9DBBD0" font-family="ui-monospace,Menlo,monospace" font-size="9" letter-spacing="2.2">${o.right||""}</text>
      ${F.spiral(x+w-24, y+h/2, .55)}</g>`;
  },

  plate(body,accent){
    const sea = `<g stroke="${accent}" stroke-width="2" opacity=".5" stroke-linecap="round">
      <path d="M28 232h58M110 232h64M198 232h52M274 232h60M350 232h26"/>
      <path d="M46 246h52M122 246h66M212 246h48M284 246h58"/></g>`;
    return `<g fill="none" stroke="${accent}" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">${body}</g>${sea}`;
  }
};


/* ==================================================================

const DECK = {
  ns:"soundings.croatia-greece.2027",

/* ---- HERO geography for this deck. Closed paths only. ---- */
const leaf = (cx,cy,rx,ry) => `M${cx-rx} ${cy} q${rx} ${-ry*2.2} ${rx*2} 0 q${-rx} ${ry*2.2} ${-rx*2} 0 Z`;
const disc = (cx,cy,r) => `M${cx-r} ${cy} a${r} ${r} 0 1 0 ${r*2} 0 a${r} ${r} 0 1 0 ${-r*2} 0 Z`;

const HERO = {
  "soundings.croatia-greece.2027":{
    masses:[
      { id:"hrm", g:"hr", d:"M14 104 L14 322 L172 322 L150 300 L156 280 L128 262 L136 240 L104 222 L112 200 L82 182 L90 160 L58 142 L66 120 L36 104 Z" },

    plot:{
      plitvice:[46,134], krka:[72,180], split:[94,216], korcula:[104,246],
      konoba:[128,274], walls:[152,300], kayak:[136,318],
      delphi:[262,152], acropolis:[324,188], market:[336,204],

};

/* ---- per-card plates ---- */
const ART = {

  delphi:`<path d="M20 226l96-96 54 54 62-84 76 126z"/><path d="M126 130V72"/><path d="M104 72h130q0 40-32 52"/><path d="M126 72V44a44 22 0 0 1 88 0v28"/><path d="M156 72V48M186 72V46M214 72V48"/><path d="M104 60h130"/>`,
  santorini:`<path d="M24 122h130l40 100h-90z"/><path d="M62 122V80h34v42M110 122V92h32v30"/><path d="M154 122h48"/><path d="M226 138q0-36 34-36t34 36z"/><path d="M226 138h68"/><path d="M260 102V80"/><path d="M310 138V96h44v42"/><path d="M310 116h44"/><path d="M204 222h172"/>`,

  market:`<path d="M40 100q40-26 80 0t80 0 80 0 80 0"/><path d="M40 100v14M360 100v14"/><path d="M200 114v34"/><path d="M148 148h104"/><path d="M156 148q22 30 44 0M200 148q22 30 44 0"/><path d="M56 220v-52h72v52zM152 220v-38h96v52M272 220v-52h72v52z"/><path d="M56 186h72M272 186h72"/>`,
  hydra:`<path d="M32 168q80 54 336 0"/><path d="M96 168V70"/><path d="M96 74l52 46H96"/><path d="M236 168V96"/><path d="M236 100l44 38h-44"/><path d="M40 130V88h34v42M74 130V104h34v-8"/><path d="M300 130V92h36v38"/><path d="M300 110h36"/><path d="M32 210h336" stroke-dasharray="12 8"/>`
};
const ART_FALLBACK = `<path d="M40 210q60-40 120 0t120 0 80-20"/><path d="M40 160q60-40 120 0t120 0 80-20"/><path d="M40 110q60-40 120 0t120 0 80-20"/><circle cx="200" cy="60" r="16"/>`;


/* ==================================================================
   ENGINE — deck-agnostic
   ================================================================== */
const GLYPH = {
  s0:'<svg class="tsp-glyph" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 13l6 6L20 5"/></svg>',
  s1:'<svg class="tsp-glyph" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" aria-hidden="true"><path d="M4 12h16"/></svg>',
  s2:'<svg class="tsp-glyph" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg>',
  person:'<svg class="tsp-glyph" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="8" r="4"/><path d="M4 21c0-4.4 3.6-7 8-7s8 2.6 8 7"/></svg>',
  chart:'<svg class="tsp-glyph" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 20V8M10 20V4M16 20v-9M22 20H2"/></svg>'
};

const app = document.getElementById("tsp-app");
const live = document.getElementById("tsp-live");
const alertBox = document.getElementById("tsp-alert");

const KEY = n => DECK.ns + ":" + n.toLowerCase().replace(/\s+/g,"-");
const esc = s => String(s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const pad2 = n => String(n).padStart(2,"0");
const gAcc = g => (DECK.groups[g] && DECK.groups[g].accent) || "#9DBBD0";
const gLab = g => (DECK.groups[g] && DECK.groups[g].label) || "";
const gSea = g => (DECK.groups[g] && DECK.groups[g].sea) || gLab(g);

let all = {}, me = null, idx = 0;

const say = m => { live.textContent = m; };
const warn = m => { alertBox.textContent = m; alertBox.classList.remove("hidden"); };
const clearWarn = () => alertBox.classList.add("hidden");

async function loadAll(){
  const out = {};
  for (const n of DECK.crew){
    out[n] = {};
    try {
      const r = await window.storage.get(KEY(n), true);
      if (r && r.value) out[n] = JSON.parse(r.value);
    } catch (e) { /* missing key on first run throws; normal */ }
  }
  all = out;
}

async function saveMe(){
  try {
    const r = await window.storage.set(KEY(me), JSON.stringify(all[me]), true);
    if (!r) throw new Error("no result");
    clearWarn(); return true;
  } catch (e) {
    warn("That mark did not save, so the others will not see it. Check your connection and mark this card again.");
    return false;
  }
}

const answered = n => DECK.cards.filter(c => all[n] && all[n][c.id] !== undefined).length;
const total = () => DECK.cards.length;
const maxPts = () => Math.max(...DECK.scale.map(s => s.points)) * DECK.crew.length;

const scoreOf = c => DECK.crew.reduce((s,n) => {
  const v = all[n] && all[n][c.id];
  return s + (v === undefined ? 0 : DECK.scale[v].points);
}, 0);

const isMarked = c => DECK.crew.some(n => all[n] && all[n][c.id] !== undefined);

function firstOpen(){
  const i = DECK.cards.findIndex(c => all[me][c.id] === undefined);
  return i === -1 ? 0 : i;
}

function land(){ const t = app.querySelector("[data-land]"); if (t) t.focus(); }

/* ---------- hero chart, composed from Fathom ---------- */
function hero(o){
  o = o || {};
  const spec = HERO[DECK.ns] || {};
  const groups = Object.keys(DECK.groups);

  const plot = spec.plot || (() => {
    const p = {};
    DECK.cards.forEach((c,i) => { p[c.id] = [62 + (i % 4) * 92, 128 + Math.floor(i / 4) * 62]; });
    return p;
  })();

  const masses = (spec.masses || []).map(m => F.landmass(m.id, m.d, gAcc(m.g))).join("");

  const marks = DECK.cards.map(c => {
    const xy = plot[c.id]; if (!xy) return "";
    return F.sounding(xy[0], xy[1], {
      accent:gAcc(c.g), score:scoreOf(c), marked:isMarked(c), focus:o.focus === c.id
    });
  }).join("");

  const seaLabels = groups.map((g,i) => `<text x="${i === 0 ? 20 : 380}" y="340" fill="${gAcc(g)}" opacity=".9"
    text-anchor="${i === 0 ? "start" : "end"}" font-family="ui-monospace,Menlo,monospace"
    font-size="10" letter-spacing="2.6">${esc(gSea(g).toUpperCase())}</text>`).join("");

  const r = spec.rose || [200,268,22];
  const sb = spec.scale || [160,318,80,"0      100 KM"];

  const done = DECK.cards.filter(c => isMarked(c)).length;
  const lead = (() => {
    const t = {}; groups.forEach(g => t[g] = 0);
    DECK.cards.forEach(c => { if (t[c.g] !== undefined) t[c.g] += scoreOf(c); });
    const s = groups.slice().sort((a,b) => t[b] - t[a]);
    return t[s[0]] === t[s[1]] ? "level so far" : `${gLab(s[0])} leading, ${t[s[0]]} to ${t[s[1]]}`;
  })();

  const label = o.focus
    ? `Chart with ${esc(DECK.cards.find(c => c.id === o.focus).name)} circled.`
    : `Depth chart of ${groups.map(gLab).join(" and ")}. ${done} of ${total()} places marked. ${lead}.`;

  return `<svg class="tsp-hero${o.compact ? " tsp-hero--small" : ""}"
      viewBox="0 ${o.compact ? 100 : 0} 400 ${o.compact ? 260 : 360}" role="img" aria-label="${esc(label)}">
    ${F.defs()}
    ${F.graticule(8,8,384,344,58)}
    ${masses}
    ${marks}
    ${seaLabels}
    ${F.rose(r[0],r[1],r[2])}
    ${F.scalebar(sb[0],sb[1],sb[2],sb[3])}
    ${o.compact ? "" : F.cartouche(20,16,360,76,{
      title:esc(DECK.title.toUpperCase()),
      left:esc(groups.map(gLab).join(" · ").toUpperCase()),
      right:esc(DECK.window.toUpperCase())
    })}
  </svg>`;
}

/* ---------- screens ---------- */
function screenWho(){
  const rows = DECK.crew.map(n => {
    const d = answered(n);
    const note = d === 0 ? "not started" : d === total() ? "all done" : d + " of " + total();
    return `<button data-who="${esc(n)}"><span class="tsp-blabel">${esc(n)}</span><span class="tsp-bnote">${note}</span></button>`;
  }).join("");

  app.innerHTML = `${hero({})}
    <h2 tabindex="-1" data-land>Who is marking the chart</h2>
    <div class="tsp-roster">${rows}</div>
    <div class="tsp-nav"><button data-go="results">${GLYPH.chart}<span class="tsp-blabel">See the results</span></button></div>
    <p class="tsp-foot">${esc(DECK.subtitle)} Everyone with this link shares one chart, so you will see each other's marks.</p>
    <p class="tsp-colophon">Soundings v03 · Fathom ${FATHOM} · Tight Spiral Studios · CC BY-SA</p>`;

  app.querySelectorAll("[data-who]").forEach(b => b.onclick = () => { me = b.dataset.who; idx = firstOpen(); screenCard(); });
  app.querySelector('[data-go="results"]').onclick = screenResults;
  say(""); land();
}

function screenCard(){
  if (idx >= total()) return screenResults();
  const c = DECK.cards[idx], acc = gAcc(c.g), mine = all[me][c.id];

  const buttons = DECK.scale.map((s,i) =>
    `<button data-s="${i}">${GLYPH["s"+i] || GLYPH.s1}<span class="tsp-blabel">${esc(s.label)}</span></button>`).join("");

  app.innerHTML = `<div class="tsp-plate">
      <svg class="tsp-art" viewBox="0 0 400 262" role="img" aria-label="Chart plate for ${esc(c.name)}">
        ${F.plate(ART[c.id] || ART_FALLBACK, acc)}</svg>
      <div class="tsp-ptext">
        <span class="tsp-count">${pad2(idx+1)} / ${pad2(total())}</span>
        <span class="tsp-chip" style="background:${acc}">${esc(gLab(c.g))}</span>
        <h3 class="tsp-pname" tabindex="-1" data-land>${esc(c.name)}</h3>
        <p class="tsp-pnote">${esc(c.note)}</p>
      </div></div>
    <div class="tsp-scale">${buttons}</div>
    <p class="tsp-keyhint">${esc(me)} marking${mine !== undefined ? " · you said " + esc(DECK.scale[mine].label.toLowerCase()) : ""} · number keys work · left arrow goes back</p>
    <div class="tsp-nav">
      <button data-go="who">${GLYPH.person}<span class="tsp-blabel">Change ${esc(DECK.crewNoun)}</span></button>
      <button data-go="results">${GLYPH.chart}<span class="tsp-blabel">See the results</span></button>
    </div>`;

  app.querySelectorAll("[data-s]").forEach(b => b.onclick = () => mark(Number(b.dataset.s)));
  app.querySelector('[data-go="who"]').onclick = screenWho;
  app.querySelector('[data-go="results"]').onclick = screenResults;

  say(`Card ${idx+1} of ${total()}. ${c.name}, ${gLab(c.g)}.`);
  land();
}

/* Guard: after a mark the screen re-renders and the next card's button
   occupies the same spot. A tremor double-tap or double-click would score
   a card the player never saw. Swallow any second activation inside the
   double-tap window instead of recording it. */
let lastMarkAt = 0;
async function mark(s){
  const now = Date.now();
  if (now - lastMarkAt < 400) return;
  lastMarkAt = now;
  const c = DECK.cards[idx];
  all[me][c.id] = s;
  const lab = DECK.scale[s].label.toLowerCase();
  idx++;
  screenCard();
  say(`Marked ${c.name} ${lab}. ` + (idx >= total() ? "That was the last card." : `Card ${idx+1} of ${total()}. ${DECK.cards[idx].name}.`));
  await saveMe();
}

function screenResults(){
  const started = DECK.crew.filter(n => answered(n) > 0);
  const waiting = DECK.crew.filter(n => answered(n) < total());
  const scored = DECK.cards.map(c => ({...c, total:scoreOf(c)}))
    .sort((a,b) => b.total - a.total || a.name.localeCompare(b.name));

  const rows = scored.map(c => {
    const marks = DECK.crew.map(n => {
      const v = all[n][c.id];
      const lab = v === undefined ? "not marked" : DECK.scale[v].label.toLowerCase();
      return `<span class="tsp-mark" data-m="${v === undefined ? "x" : v}" role="img" aria-label="${esc(n)}: ${esc(lab)}">${esc(n[0])}</span>`;
    }).join("");
    return `<li><span class="tsp-depth" style="color:${gAcc(c.g)}">${pad2(c.total)}</span>
      <span><span class="tsp-rname">${esc(c.name)}</span>
      <span class="tsp-rwhere" style="color:${gAcc(c.g)}">${esc(gLab(c.g))}</span></span>
      <span class="tsp-marks">${marks}</span></li>`;
  }).join("");

  const legend = DECK.scale.map((s,i) =>
    `<span><span class="tsp-sw" ${i===0?'style="border-color:var(--s1);background:var(--s1)"':i===1?'style="border-color:var(--s2);background:rgba(227,169,74,.34)"':''}></span>${esc(s.label)}, ${s.points}</span>`
  ).join("") + `<span><span class="tsp-sw" style="border-style:dotted;opacity:.55"></span>Not marked</span>`;

  app.innerHTML = `${hero({compact:true})}
    <h2 tabindex="-1" data-land>Where the group leans</h2>
    <p class="tsp-foot" style="margin-top:0;padding-top:0;border:0">The numeral on each sounding is what the family scored it, out of ${maxPts()}.</p>
    <ol class="tsp-rank">${rows}</ol>
    <div class="tsp-legend">${legend}</div>
    <div class="tsp-nav">
      <button data-go="who">${GLYPH.person}<span class="tsp-blabel">Change ${esc(DECK.crewNoun)}</span></button>
      ${me ? `<button data-go="card">${GLYPH.chart}<span class="tsp-blabel">Back to marking</span></button>` : ""}
    </div>
    <p class="tsp-foot">${esc(DECK.closing)}</p>
    <p class="tsp-colophon">Soundings v03 · Fathom ${FATHOM} · deck: ${esc(DECK.ns)}</p>`;

  app.querySelector('[data-go="who"]').onclick = screenWho;
  const back = app.querySelector('[data-go="card"]');
  if (back) back.onclick = () => { idx = firstOpen(); screenCard(); };

  say(`${started.length} of ${DECK.crew.length} started.` + (waiting.length ? ` Still out: ${waiting.join(", ")}.` : " Everyone finished."));
  land();
}

document.addEventListener("keydown", e => {
  if (e.metaKey || e.ctrlKey || e.altKey || e.shiftKey) return;
  const t = e.target;
  if (t && (t.tagName === "INPUT" || t.tagName === "TEXTAREA" || t.isContentEditable)) return;
  if (!me || !app.querySelector("[data-s]")) return;
  const n = Number(e.key);
  if (n >= 1 && n <= DECK.scale.length){ e.preventDefault(); mark(n-1); }
  else if (e.key === "ArrowLeft" && idx > 0){ e.preventDefault(); idx--; screenCard(); }
});

(async () => {
  document.title = DECK.title + " — Tight Spiral Studios";
  if (!window.storage){
    warn("Shared storage is not available here, so marks will not reach the rest of the group. Open this from the shared link.");
    DECK.crew.forEach(n => all[n] = {});
  } else {
    await loadAll();
  }
  screenWho();
})();
</script>
</body>
