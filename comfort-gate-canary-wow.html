<!doctype html><html lang="en" data-light="day"><head><meta charset="utf-8"><style>
:root{--bg:#ffffff;--ink:#111}
html[data-light="dusk"]{--bg:#eeeeee}
html[data-light="night"]{--bg:#151515;--ink:#eeeeee}
body{background:var(--bg);color:var(--ink);font:16px serif;margin:2rem}
.bad{color:#ffffff}
</style></head><body><h1>Has dark, but hides text</h1><p class="bad">white on white in day</p></body></html>
