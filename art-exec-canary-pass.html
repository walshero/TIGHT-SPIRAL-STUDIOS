<!DOCTYPE html><html lang="en"><head><meta charset="utf-8">
<title>Canary: a frame that executes</title>
<style>
 body{background:#111;margin:0}
 .stage{position:relative;height:220px;background:#0a0716;overflow:hidden}
 .layer{position:absolute;left:0;right:0;bottom:0;height:60%}
 .shape{position:absolute;bottom:0;width:40px;background:#080513;border-top:2px solid #4a3a7d}
 .shape.b{background:#100a26}
 .lamp{position:absolute;right:12px;bottom:12px;width:16px;height:16px;border-radius:50%;background:#ffe9b8}
 .line{position:absolute;left:10px;top:26px;color:#ffc74a;font:700 20px monospace}
</style></head><body>
<!-- Type is the brightest non-instrument thing; two tower values; no crossed gradients.
     The lamp is brighter than the type and is allowed to be: it is a marked instrument. -->
<div class="stage"><div class="line">the poem wins the frame</div>
 <div class="layer">
  <div class="shape" style="left:2%;height:60px"></div><div class="shape b" style="left:18%;height:88px"></div>
  <div class="shape" style="left:34%;height:52px"></div><div class="shape b" style="left:50%;height:96px"></div>
  <div class="shape" style="left:66%;height:70px"></div><div class="shape b" style="left:82%;height:84px"></div>
 </div>
 <div data-art-class="instrument"><div class="lamp"></div></div></div>
</body></html>
