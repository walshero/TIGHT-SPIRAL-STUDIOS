<title>Row K: Dress Rehearsal</title>
<!--
  ROW K v13 - a staging game. Tight Spiral Productions.
  Three scenes: Ernesto (elevator), Vera (book club), Frank (the basement cat).
  Craft target: stagecraft / show-don't-tell for the stage (EN195 Workshop 3, Lens 3).
  Floors: single-file offline, no network fetches, no emoji, scene-first,
  one decision per screen, 20px body / 18px min, 48px targets, back+home nav,
  three comfort stops, reduced-motion support, keyboard operable.

  --- history (condensed) ---
  v4 Fran the stage manager gives backstage feedback the moment a card is picked.
  v5 CHANGE THIS returns to the review; color-scheme declared per stop.
  v6 Mamet seat: drama is what the character DOES; evidence at body scale.
  v9 Scene 3 is FRANK AND THE BASEMENT CAT - three scenes, three emotional
     colors: fear, bluff, love. Lobby (program) screen added.
  v10 Curtain rebuilt on animation principles - anticipation, gather, settle.
  v11 DARK HOST LAW: a dark-preferring device never sees a light palette.
  v11r2 BACKDROP-AS-ELEMENT: never trust body background alone.
  v12 At-rise copy above the stage; ink plate inside the proscenium.
  v12r2 Studio branding footer. First repo deploy of this build.

  --- v13 (founder notes, Row K dress rehearsal 2026-09-19) ---
  1. LOGO CONTRAST. The mark was teal #0f5f5a on burnt orange #c05a1e - 1.68:1,
     two mid-dark saturated hues sitting on top of each other. Unreadable at
     48px and worse at a glance. The spiral is now CREAM #FAF6EE on a deeper
     burnt orange #B4511A = 4.72:1, clearing the 3:1 floor for graphical
     objects with room to spare. Teal is not discarded: it drops behind the
     cream spiral as an offset registration stroke, so the mark reads as
     letterpress slip and still carries both studio colors.
     STANDING RULE: two saturated mid-tones never carry each other. One of any
     pair must go to paper or to ink.

  2. SCENE ICONS ON THE SPLASH. The lobby was names-only by v9 ruling. It read
     as a list, not a program. Each scene now carries a tinted plate - elevator,
     book, cat - drawn in cream on the scene's emotional color: fear is cold
     slate blue, bluff is brass, love is deep rose. Every tile is a cream mark
     on a dark field (6.9:1, 5.9:1, 6.9:1) with a bright rim of its own hue
     (4.6:1, 3.7:1, 3.9:1), so the color is loud and the drawing still reads.
     The same tile repeats at 30px in the scene picker.

  3. CURTAIN PHYSICS. The old open was a rubber band: scaleX ran 0.06 then
     BACK to 0.17 and settled at 0.12 - an 11% elastic rebound at the end of
     travel. Nothing with the mass of a curtain does that, which is exactly
     why it felt bouncy and slightly wrong. Research, then the rebuild:
       - MASS. Theatrical velour runs 15-32 oz/yd and traveler track is rated
         15-30 lb per linear foot, so one leaf of a grand drape is hundreds of
         pounds. High inertia: slow to start, slow to stop, zero snap-back.
       - STICK-SLIP is the correct model for a hand-hauled line. Rope tension
         builds against STATIC friction; at breakaway the carriers jump to the
         lower KINETIC coefficient, the load lunges, the rope goes slack, and
         it STICKS. Then tension rebuilds. That is literally "one, two,
         threeeee" - and it ends in a stick, never a bounce.
       - So travel is now monotonic into the stack. The only backward motion
         is a 1.5% relax BETWEEN tugs, when rope tension drops and the pleats
         unload. The end of the long haul is a dead stop.
       - WHAT ACTUALLY OSCILLATES is the hem, as a pendulum hung from the
         track. That motion is angular, not horizontal. Each leaf now carries
         a rotate() about its top corner: the hem LAGS while the track
         accelerates, then rings down after the track stops. Damping ratio
         ~0.35 (velour is lossy), so each half-swing keeps ~0.31 of the last:
         1.65deg, 0.54, 0.175, 0.057, 0. Two visible swings, then still.
       - Composition order is rotate() scaleX() so the scale is innermost: the
         gathered bundle swings at full angle instead of having the swing
         squashed to nothing by the 0.13 gather.
       - The two leaves are no longer the same animation on a delay. Different
         tug magnitudes, different stack widths, different durations. A hand-
         hauled traveler is never symmetric.

  4. THE SECRET is bold and underlined. It is the one thing on the screen the
     player must hold in their head for the next three decisions.

  5. FRAN, CHOICE 1 (OBJECT/TELL): "awkward" at curtain, not "tricky".
     FRAN, CHOICE 3 (LINE/TELL): "Hope the critics aren't in the house."

  6. AUDIENCE METER. A 54-seat house: 9 rows of 6, in three bands of three
     rows. Each scene owns a band; each choice the house can SEE lights one
     row. So a full house is all three scenes staged with all three choices
     shown, and the ceiling before the final scene is two thirds - not an
     arbitrary clamp but the arithmetic of the thing: the back third is
     Scene 3's band and nothing else can fill it. The meter sits on the lobby
     and under every verdict, and always prints the count in words as well as
     seats.
-->
<style>
  :root{
    --paper:#FAF6EE; --ink:#1F1B16; --amber:#E8A13D; --amber-soft:#F3D9AE;
    --slotline:#5A5245; --card:#FFFFFF; --good:#284F2E; --goodink:#F5F1E8;
    color-scheme: light;
  }
  body[data-comfort="2"]{ --paper:#D9CFBC; --card:#EDE5D4; }
  body[data-comfort="3"]{ --paper:#14110D; --ink:#F5F1E8; --card:#241F18;
    --slotline:#B8AE9C; --amber-soft:#4A3A1E; color-scheme: dark; }
  /* DARK HOST LAW: a dark-preferring device never sees a light palette, so the
     host has nothing to repaint. The comfort ladder forks into three dark-side
     brightness stops: warm dark, deep dark, black. */
  body[data-scheme="dark"]{
    --paper:#3D362B; --ink:#F5F1E8; --card:#4A4336;
    --slotline:#B8AE9C; --amber-soft:#4A3A1E; color-scheme: dark;
  }
  body[data-scheme="dark"][data-comfort="2"]{ --paper:#211C15; --card:#2E2820; }
  body[data-scheme="dark"][data-comfort="3"]{ --paper:#0B0906; --card:#1A1611; }
  *{box-sizing:border-box; margin:0;}
  body{
    background:var(--paper); color:var(--ink);
    font-family:Georgia,'Times New Roman',serif;
    font-size:20px; line-height:1.45; padding:0 16px 40px;
  }
  /* BACKDROP-AS-ELEMENT LAW: some viewers discard or force the page's body
     background, orphaning text from its floor. Element backgrounds provably
     survive, so the backdrop is a real fixed element layered above the body
     background and below the content. Never trust body background alone. */
  #backdrop{ position:fixed; inset:0; background:var(--paper); z-index:0; }
  header, main, footer{ position:relative; z-index:1; }
  button{
    font:inherit; color:var(--ink); cursor:pointer;
    min-height:48px; border-radius:10px;
  }
  @media (prefers-reduced-motion: reduce){ *{transition:none !important; animation:none !important;} }

  header{
    display:flex; flex-wrap:wrap; align-items:center; justify-content:space-between; gap:12px;
    padding:14px 0; max-width:760px; margin:0 auto;
    border-bottom:2px solid var(--ink);
  }
  .navbtn{
    background:var(--card); border:2px solid var(--ink); padding:8px 18px;
    font-family:Verdana,Arial,sans-serif; font-size:18px; font-weight:bold;
  }
  h1{ font-family:Verdana,Arial,sans-serif; font-size:26px; letter-spacing:3px; }
  h1 small{
    display:block; font-size:18px; letter-spacing:2px; font-weight:normal;
    font-family:Verdana,Arial,sans-serif;
  }

  main{ max-width:760px; margin:0 auto; }

  .stepline{
    text-align:center; font-family:Verdana,Arial,sans-serif; font-size:18px;
    font-weight:bold; letter-spacing:2px; margin:18px 0 6px;
  }

  /* Lobby: tonight's program. v13 - each scene carries a tinted plate so the
     splash reads as a poster board instead of a list of links. */
  .lobby-note{ text-align:center; font-style:italic; margin:8px 0 20px; }
  .lobbybtn{
    display:flex; align-items:center; gap:15px;
    width:100%; max-width:560px; margin:0 auto 14px;
    background:var(--card); border:2px solid var(--ink); border-left-width:11px;
    padding:12px 16px; text-align:left;
    font-family:Verdana,Arial,sans-serif; font-size:18px;
    font-weight:bold; letter-spacing:2px;
  }
  .lobbybtn .tile{ width:64px; height:64px; flex:none; display:block; }
  .lobbybtn .sname{
    display:block; font-size:21px; letter-spacing:1px; margin-top:3px;
  }
  .lobbybtn .done{
    display:block; font-family:Georgia,serif; font-weight:normal; font-style:italic;
    letter-spacing:0; font-size:17px; margin-top:5px;
  }

  /* Proscenium: curtains hauled open by hand to reveal the scene's ink plate */
  .proscenium{
    position:relative; border:3px solid var(--ink); border-radius:12px;
    overflow:hidden; margin:14px 0 6px; background:var(--paper);
  }
  .pros-inner{
    min-height:240px; display:flex; align-items:center; justify-content:center;
    padding:40px 13% 44px;
  }
  .valance{
    position:absolute; top:0; left:0; right:0; height:22px; z-index:3;
    background:#A34E40; border-bottom:4px solid #7C3A30;
  }
  /* CURTAIN PHYSICS (v13). A grand-drape leaf is hundreds of pounds of velour
     on nylon carriers, hauled by a hand line. That is a STICK-SLIP system:
     rope tension builds against static friction, breaks away to the lower
     kinetic coefficient, the load lunges, the rope slacks, it STICKS. It does
     not rebound. So scaleX travel is monotonic into the stack; the only
     backward motion is the small relax between tugs as the pleats unload.
     The oscillation lives where it actually lives - in the HEM, swinging as a
     pendulum about the track. That is rotate(), damped at ~0.35, ringing down
     over two visible swings after the track has already stopped.
     Composition is rotate() scaleX() so scale is innermost and the gathered
     bundle swings at full angle. */
  .curtain{
    position:absolute; top:-4px; bottom:-10px; z-index:2;
    width:calc(53% + 16px);
    will-change:transform; backface-visibility:hidden;
  }
  .curtain svg{ width:100%; height:100%; display:block; }
  .curtain.cl{
    left:-16px; transform-origin:top left; border-right:4px solid #8E4237;
    background:linear-gradient(90deg,#BE6252 0%,#C96F5F 58%,#9E4C3E 100%);
    animation:pullL 2.5s 0.5s forwards;
  }
  .curtain.cr{
    right:-16px; transform-origin:top right; border-left:4px solid #8E4237;
    background:linear-gradient(270deg,#BE6252 0%,#C96F5F 58%,#9E4C3E 100%);
    animation:pullR 2.62s 0.62s forwards;
  }
  /* LEFT LEAF. Pulled left, so the hem lags right: negative rotate leads. */
  @keyframes pullL{
    0%   { transform:rotate(0deg) scaleX(1);         animation-timing-function:ease-in; }
    4%   { transform:rotate(-0.18deg) scaleX(1.015); animation-timing-function:cubic-bezier(.1,.85,.3,1); }
    14%  { transform:rotate(-1.15deg) scaleX(0.800); animation-timing-function:ease-out; }
    21%  { transform:rotate(-0.22deg) scaleX(0.815); animation-timing-function:ease-in-out; }
    30%  { transform:rotate(0.32deg)  scaleX(0.805); animation-timing-function:cubic-bezier(.12,.8,.3,1); }
    41%  { transform:rotate(-1.40deg) scaleX(0.600); animation-timing-function:ease-out; }
    48%  { transform:rotate(-0.26deg) scaleX(0.615); animation-timing-function:ease-in-out; }
    55%  { transform:rotate(0.30deg)  scaleX(0.608); animation-timing-function:cubic-bezier(.25,.62,.2,1); }
    82%  { transform:rotate(-1.65deg) scaleX(0.135); animation-timing-function:cubic-bezier(.4,0,.3,1); }
    88%  { transform:rotate(0.54deg)  scaleX(0.130); animation-timing-function:ease-in-out; }
    93%  { transform:rotate(-0.175deg) scaleX(0.130); animation-timing-function:ease-in-out; }
    97%  { transform:rotate(0.057deg) scaleX(0.130); animation-timing-function:ease-in-out; }
    100% { transform:rotate(0deg) scaleX(0.130); }
  }
  /* RIGHT LEAF. Mirrored, and deliberately not the same numbers - a hand-
     hauled traveler is never symmetric. Heavier stack, slower haul. */
  @keyframes pullR{
    0%   { transform:rotate(0deg) scaleX(1);        animation-timing-function:ease-in; }
    5%   { transform:rotate(0.15deg) scaleX(1.012); animation-timing-function:cubic-bezier(.1,.84,.3,1); }
    16%  { transform:rotate(1.00deg) scaleX(0.835); animation-timing-function:ease-out; }
    23%  { transform:rotate(0.20deg) scaleX(0.848); animation-timing-function:ease-in-out; }
    32%  { transform:rotate(-0.30deg) scaleX(0.840); animation-timing-function:cubic-bezier(.12,.78,.3,1); }
    43%  { transform:rotate(1.30deg) scaleX(0.630); animation-timing-function:ease-out; }
    50%  { transform:rotate(0.24deg) scaleX(0.645); animation-timing-function:ease-in-out; }
    57%  { transform:rotate(-0.28deg) scaleX(0.637); animation-timing-function:cubic-bezier(.25,.60,.2,1); }
    84%  { transform:rotate(1.50deg) scaleX(0.155); animation-timing-function:cubic-bezier(.4,0,.3,1); }
    90%  { transform:rotate(-0.49deg) scaleX(0.150); animation-timing-function:ease-in-out; }
    94.5%{ transform:rotate(0.16deg) scaleX(0.150); animation-timing-function:ease-in-out; }
    98%  { transform:rotate(-0.05deg) scaleX(0.150); animation-timing-function:ease-in-out; }
    100% { transform:rotate(0deg) scaleX(0.150); }
  }
  /* The plate waits behind the curtain and inks itself as the reveal lands */
  .pros-inner .draw{ animation-delay:2.1s; }
  .pros-inner .draw.d2{ animation-delay:2.6s; }
  .pros-inner .draw.d3{ animation-delay:3.1s; }
  @media (prefers-reduced-motion: reduce){
    .curtain.cl{ animation:none; transform:scaleX(0.130); }
    .curtain.cr{ animation:none; transform:scaleX(0.150); }
  }

  .scenenav{ display:flex; gap:10px; justify-content:center; flex-wrap:wrap; margin:10px 0 4px; }
  .scenebtn{
    display:flex; align-items:center; gap:9px;
    background:var(--card); border:2px solid var(--ink); padding:8px 16px;
    font-family:Verdana,Arial,sans-serif; font-size:18px; font-weight:bold;
    letter-spacing:1px;
  }
  .scenebtn .tile{ width:30px; height:30px; flex:none; display:block; }
  .scenebtn[aria-pressed="true"]{ background:var(--amber-soft); border-width:3px; }

  .secret{
    margin:18px auto 10px; text-align:center;
    background:var(--amber); color:#1F1B16;
    border:3px solid #1F1B16; border-radius:12px; padding:18px 20px;
  }
  .secret .tag{
    font-family:Verdana,Arial,sans-serif; font-size:18px; font-weight:bold;
    letter-spacing:2px;
  }
  /* v13: the secret is the one thing the player must carry through three
     decisions, so it is bold and underlined, with the underline set off the
     baseline far enough that descenders stay readable. */
  .secret .body{
    font-size:22px; margin-top:6px; font-weight:bold;
    text-decoration:underline; text-decoration-thickness:3px;
    text-underline-offset:6px;
  }

  .scene-line{ text-align:center; font-style:italic; margin:16px auto 18px; }

  /* Ink plate: the scene sketches itself onto the splash */
  .plate-wrap{ display:flex; justify-content:center; margin:6px 0 10px; color:var(--ink); }
  .plate-wrap svg{ height:150px; max-width:100%; }
  .draw{
    fill:none; stroke:currentColor; stroke-width:3;
    stroke-linecap:round; stroke-linejoin:round;
    stroke-dasharray:600; stroke-dashoffset:600;
    animation:drawon 1.5s ease-out forwards;
  }
  .draw.d2{ animation-delay:0.5s; }
  .draw.d3{ animation-delay:1s; }
  @keyframes drawon{ to{ stroke-dashoffset:0; } }
  @media (prefers-reduced-motion: reduce){
    .draw{ animation:none; stroke-dashoffset:0; }
  }

  .prompt{ text-align:center; font-size:22px; margin:20px 0 6px; }
  .subprompt{ text-align:center; font-style:italic; margin-bottom:18px; }

  .bank{ display:flex; flex-direction:column; gap:14px; }
  .cardbtn{
    background:var(--card); border:2px solid var(--ink); padding:16px 18px;
    text-align:left; font-size:20px; width:100%;
  }
  .cardbtn[aria-pressed="true"]{
    background:var(--amber-soft); border-width:3px; font-weight:bold;
  }
  .cardbtn .onstage{
    display:block; font-family:Verdana,Arial,sans-serif; font-size:18px;
    font-weight:bold; letter-spacing:1px; margin-top:8px;
  }

  .franbox{
    margin-top:16px; background:var(--card); border:2px dashed var(--slotline);
    border-radius:12px; padding:14px 18px;
  }
  .franbox .who{
    font-family:Verdana,Arial,sans-serif; font-size:18px; font-weight:bold;
    letter-spacing:1px; display:block; margin-bottom:4px;
  }
  .franbox p{ font-style:italic; }

  .advance-row{
    display:flex; gap:14px; justify-content:center; flex-wrap:wrap; margin:26px 0 8px;
  }
  .bigbtn{
    background:var(--ink); color:var(--paper); border:3px solid var(--ink);
    font-family:Verdana,Arial,sans-serif; font-size:22px; font-weight:bold;
    letter-spacing:3px; padding:14px 44px;
  }
  .bigbtn[disabled]{ opacity:0.55; cursor:not-allowed; }

  .review-item{
    background:var(--card); border:2px solid var(--ink); border-radius:12px;
    padding:14px 18px; margin-bottom:14px;
  }
  .review-item .cat{
    font-family:Verdana,Arial,sans-serif; font-size:18px; font-weight:bold;
    letter-spacing:2px;
  }
  .review-item .swap{
    margin-top:10px; background:var(--card); border:2px solid var(--ink);
    padding:8px 16px; font-family:Verdana,Arial,sans-serif; font-size:18px;
    font-weight:bold;
  }

  .row-react{
    background:var(--card); border:2px solid var(--ink); border-radius:12px;
    padding:14px 18px; margin-bottom:12px;
  }
  .row-react .who{
    font-family:Verdana,Arial,sans-serif; font-size:18px; font-weight:bold;
    letter-spacing:1px; display:block; margin-bottom:2px;
  }
  .row-react .staged{
    background:var(--amber-soft); border-radius:8px; padding:10px 14px;
    margin:6px 0 12px;
  }
  .banner{
    border:3px solid var(--ink); border-radius:12px; padding:18px 20px;
    text-align:center; margin:18px 0;
    background:var(--amber); color:#1F1B16;
  }
  .banner.win{ background:var(--good); color:var(--goodink); border-color:var(--good); }
  .banner .head{
    font-family:Verdana,Arial,sans-serif; font-size:22px; font-weight:bold;
    letter-spacing:2px; display:block; margin-bottom:6px;
  }
  .houselights{ text-align:center; font-style:italic; margin:16px 0 22px; }
  .hidden{ display:none; }

  /* AUDIENCE METER. 54 seats: 9 rows of 6, three bands of three rows, one band
     per scene. Each choice the house can SEE lights one row. A lit seat is a
     solid amber block with a full-strength ink outline; an empty seat is a
     hairline. The structural difference does the work, not the hue. */
  .housebox{
    margin:24px auto 6px; background:var(--card); border:2px solid var(--ink);
    border-radius:12px; padding:14px 14px 12px;
  }
  .housebox.full{ border-width:4px; border-color:var(--good); }
  .house-title{
    font-family:Verdana,Arial,sans-serif; font-size:18px; font-weight:bold;
    letter-spacing:2px; text-align:center; margin-bottom:10px;
  }
  .house-stagebar{
    text-align:center; font-family:Verdana,Arial,sans-serif; font-size:18px;
    font-weight:bold; letter-spacing:6px; padding:7px 0;
    border:2px solid var(--ink); border-radius:5px;
    background:var(--amber-soft); margin:0 8% 12px;
  }
  .house-svg{ color:var(--ink); }
  .house-svg svg{ width:100%; height:auto; display:block; }
  .house-key{
    list-style:none; padding:0; margin:12px 0 0;
    display:flex; gap:8px 20px; justify-content:center; flex-wrap:wrap;
    font-size:18px;
  }
  .house-key li{ display:flex; align-items:center; gap:8px; }
  .house-key .swatch{
    width:20px; height:20px; border-radius:5px; border:2.5px solid; flex:none;
  }
  .house-read{
    text-align:center; font-family:Verdana,Arial,sans-serif; font-size:19px;
    font-weight:bold; letter-spacing:1px; margin-top:12px;
  }
  .house-note{ text-align:center; font-style:italic; margin-top:5px; }

  /* Mnemonic icons: eye = OBJECT (seen), footprints = MOVE (watched), speech = LINE (heard) */
  .icn{ display:block; color:var(--ink); }
  .iconrow{ display:flex; gap:16px; justify-content:center; flex-wrap:wrap; margin:22px 0 10px; }
  .iconchip{
    text-align:center; background:var(--card); border:2px solid var(--ink);
    border-top:6px solid var(--amber); border-radius:12px; padding:12px 18px 14px;
    min-width:130px;
    font-family:Verdana,Arial,sans-serif; font-size:18px; font-weight:bold;
    letter-spacing:1px;
  }
  .iconchip .icn{ width:44px; height:44px; margin:0 auto 8px; }
  .iconchip .sense{ display:block; font-family:Georgia,serif; font-weight:normal;
    font-style:italic; letter-spacing:0; margin-top:4px; }
  .choice-icn{ width:60px; height:60px; margin:16px auto 0; }
  .cathead{ display:flex; align-items:center; gap:10px; margin-bottom:6px; }
  .cathead .icn{ width:28px; height:28px; }
  .who-row{ display:flex; align-items:flex-start; gap:10px; margin-bottom:4px; }
  .who-row .icn{ width:26px; height:26px; flex:none; margin-top:2px; }

  /* Studio brand. v13 contrast fix: the spiral was teal on burnt orange, two
     mid-dark saturated hues at 1.68:1 - invisible. The spiral is now cream on
     a deeper orange (4.72:1) with the teal dropped behind it as an offset
     registration stroke, so both studio colors survive and the mark reads. */
  footer{
    max-width:760px; margin:34px auto 0; padding:18px 0 8px;
    border-top:2px solid var(--ink);
    display:flex; align-items:center; justify-content:center; gap:14px;
  }
  .spiralmark{ width:52px; height:52px; flex:none; display:block; }
  .studioname{
    display:block; font-family:Verdana,Arial,sans-serif; font-size:18px;
    font-weight:bold; letter-spacing:2px;
  }
  .studiotag{ display:block; font-style:italic; font-size:18px; }
</style>
</head>
<body data-comfort="1">
<div id="backdrop" aria-hidden="true"></div>

<header>
  <div style="display:flex; gap:10px;">
    <button class="navbtn" id="homeBtn" type="button">HOME</button>
    <button class="navbtn" id="backBtn" type="button">BACK</button>

  <h1>ROW K<small>DRESS REHEARSAL</small></h1>

<script>
(function(){

  var SCENES = [
    {

      // Emotional color: fear. Cold slate blue, cream mark (8.4:1), sky rim (4.6:1).
      tint:{ field:"#2E4A6B", rim:"#7FC0E8" },

      mark:'<rect x="11" y="15" width="19" height="38" rx="1.5"/>'

      cards:{
        OBJECT:[

        LINE:[

      react:{
        OBJECT:{

        MOVE:{

    {

      who:"Vera",
      // Emotional color: bluff. Brass, cream mark (5.9:1), amber rim (3.7:1).
      tint:{ field:"#7F5A12", rim:"#F2BC66" },
      mark:'<path d="M9 20 c9 -6 16 -6 23 -1 c7 -5 14 -5 23 1 v27 c-9 -5 -16 -5 -23 0 c-7 -5 -14 -5 -23 0 z"/>'

      plate:'<path class="draw" d="M40 60 c25 -14 50 -14 60 -4 c10 -10 35 -10 60 4 v70 c-25 -12 -50 -12 -60 -2 c-10 -10 -35 -10 -60 2 z"/><line class="draw d2" x1="100" y1="56" x2="100" y2="128"/><circle class="draw d2" cx="72" cy="86" r="9"/><path class="draw d3" d="M182 95 h36 v24 a12 12 0 0 1 -12 12 h-12 a12 12 0 0 1 -12 -12 z"/><path class="draw d3" d="M218 100 a10 10 0 1 1 0 18"/>',
      cards:{
        OBJECT:[

      react:{
        OBJECT:{

        MOVE:{
          TELL:      {who:"DEV, ROW K, THEATER MAJOR, TAKES NOTES IN THE DARK", say:"She shook her head directly at us. My notes say: SUBTLE AS A FIRE DRILL."},

        },
        LINE:{

          INVISIBLE: {who:"PAUL, ROW Q, CAME WITH MARGE", say:"Whatever she was worried about, I could not hear it. I was in Row Q, not in her head."},
          SHOW:      {who:"PAUL, ROW Q, CAME WITH MARGE", say:"'The way it progressed. Forward.' I have said those exact words. I had also not read the book."}

      winBody:"Three rows walked out arguing about a price sticker and an empty cup. That is staging."
    },
    {
      name:"FRANK AND THE BASEMENT CAT",
      secret:"Frank, the building superintendent, loves the stray cat in the basement. No tenant may ever know. The audience must never be told. They must see it.",
      scene:"INT. BASEMENT, OUTSIDE THE BOILER ROOM. Frank tapes up a NO PETS notice while Mrs. Petrocelli from 4B watches him. Behind the boiler, a cat waits. You will stage his secret in three choices:",
      who:"Frank",
      // Emotional color: love. Deep rose, cream mark (6.9:1), blush rim (3.9:1).
      tint:{ field:"#8C3A4A", rim:"#EFA7B3" },
      // A face with no eyes is a blank. The eyes carry the tenderness here.
      mark:'<path d="M21 26 l-3 -12 l11 6"/>'
          +'<path d="M43 26 l3 -12 l-11 6"/>'
          +'<circle cx="32" cy="36" r="14"/>'
          +'<path d="M17 33 h-9 M17 40 h-9 M47 33 h9 M47 40 h9"/>'
          +'<circle cx="27" cy="34" r="1.4" fill="#FAF6EE"/>'
          +'<circle cx="37" cy="34" r="1.4" fill="#FAF6EE"/>'
          +'<path d="M29 41 c1.5 2 4.5 2 6 0"/>',
      plate:'<rect class="draw" x="56" y="14" width="88" height="132" rx="3"/><path class="draw" d="M144 14 l44 16 v104 l-44 -4"/><circle class="draw d2" cx="158" cy="146" r="7"/><circle class="draw d2" cx="190" cy="138" r="7"/><path class="draw d2" d="M163 143 l22 -5"/><circle class="draw d3" cx="104" cy="112" r="15"/><path class="draw d3" d="M93 102 l-5 -11 l11 5 M115 102 l5 -11 l-11 5"/><path class="draw d3" d="M88 112 h-13 M88 119 h-13 M120 122 c15 5 20 -8 11 -15"/>',
      cards:{
        OBJECT:[
          {id:"o1", kind:"TELL", text:"A sign taped to the boiler room door: FRANK'S CAT LIVES HERE. TELL NO ONE."},
          {id:"o2", kind:"INVISIBLE", text:"The warm feeling in Frank's chest. Category: unbearable."},

        ],
        MOVE:[
          {id:"m1", kind:"TELL", text:"Frank turns to the audience, points at the boiler room, and rocks an invisible kitten in his arms."},
          {id:"m2", kind:"INVISIBLE", text:"Frank decides, internally, that the cat's name is Duchess."},
          {id:"m3", kind:"SHOW", text:"Mid-rant about building rules, Frank props the boiler-room door with his wrench. The gap is exactly cat-width."}
        ],
        LINE:[
          {id:"l1", kind:"TELL", text:"FRANK: I love that cat. Tell no one, Mrs. Petrocelli."},
          {id:"l2", kind:"INVISIBLE", text:"FRANK (thinking): She likes the tuna in oil. Not water. Oil."},
          {id:"l3", kind:"SHOW", text:"FRANK: That animal better be gone by Friday. ... There's weather coming Friday."}
        ]
      },
      react:{
        OBJECT:{
          TELL:      {who:"MARGE, ROW C, RETIRED STAGE MANAGER", say:"The sign announces the secret and then asks us to keep it. Bold strategy. Save the tape."},
          INVISIBLE: {who:"MARGE, ROW C, RETIRED STAGE MANAGER", say:"A feeling in a chest is not a prop, dear. I cannot light the inside of a man."},
          SHOW:      {who:"MARGE, ROW C, RETIRED STAGE MANAGER", say:"The good can opener. For his own lunch he uses the church key. For the cat, the good one. I saw the blanket folded in thirds and understood his entire heart."}
        },
        MOVE:{
          TELL:      {who:"DEV, ROW K, THEATER MAJOR, TAKES NOTES IN THE DARK", say:"He rocked an invisible kitten. At us. My notes say: BABY, IMPLIED."},
          INVISIBLE: {who:"DEV, ROW K, THEATER MAJOR, TAKES NOTES IN THE DARK", say:"He named the cat, apparently. Inside. What the house saw was a man staring at a boiler."},
          SHOW:      {who:"DEV, ROW K, THEATER MAJOR, TAKES NOTES IN THE DARK", say:"He propped the door mid-rant and kept yelling. The wrench said one thing while the mouth said another. That is theater."}
        },
        LINE:{
          TELL:      {who:"PAUL, ROW Q, CAME WITH MARGE", say:"He told Mrs. Petrocelli to tell no one. Mrs. Petrocelli. The whole building knew by Thursday."},
          INVISIBLE: {who:"PAUL, ROW Q, CAME WITH MARGE", say:"Tuna in oil, not water. Could not hear it from Row Q. The cat knows, though."},
          SHOW:      {who:"PAUL, ROW Q, CAME WITH MARGE", say:"'There's weather coming Friday.' He gave the cat an extension and called it a forecast. I had to sit a minute."}
        }
      },
      winBody:"Three rows walked out arguing about a wrench and a folded blanket. That is staging."
    }
  ];

  // Fran reacts backstage the moment a card goes on stage - before the house sees anything.
  var FRAN = {
    OBJECT:{
      TELL:      "I can build it, hon. I am just saying: it hands them the whole secret before the actors breathe. This will be awkward at curtain.",
      INVISIBLE: "Walk me through this one. How do I hang that from a batten? What does the light hit?",
      SHOW:      "Prop shop says easy. And it says something without saying it. Curious choice. I like where your head is."
    },
    MOVE:{
      TELL:      "The actors can do that, sure. Whether the house should be handed it that flat is your call, boss.",
      INVISIBLE: "I have no cue for what happens inside a person. Nothing on my board reaches in there.",
      SHOW:      "Good blocking. The back row will catch that. This one is doing quiet work."
    },
    LINE:{
      TELL:      "Easy to deliver. It does announce the thing, though. Hope the critics aren't in the house.",
      INVISIBLE: "Nobody can hear thinking past the orchestra pit, hon. But you are the playwright.",
      SHOW:      "Ooh. That line says one thing and means another. I will cue it tight."
    }
  };

  var VERDICTS = {
    win:  {cls:"win", head:"THE HOUSE KNOWS, AND NOBODY TOLD THEM."},
    seminar:{cls:"", head:"A VERY INFORMATIVE EVENING.",
           body:"The audience knows everything and felt nothing. Like a memo, with lighting."},
    invisible:{cls:"", head:"IF THEY CAN'T SEE IT OR HEAR IT, IT ISN'T THERE.",
           body:"Part of this play happened where there are no seats."},
    told: {cls:"", head:"TOLD IS NOT SHOWN.",
           body:"The parts you staged worked. The parts you announced died on arrival."}
  };

  var PROMPTS = {
    OBJECT:{n:1, ask:"Put one OBJECT on the stage.", sub:"Something the audience can see."},
    MOVE:{n:2, ask:"one MOVE.", sub:"Something the audience watches them do."},
    LINE:{n:3, ask:"one LINE.", sub:"Something the audience can hear."}
  };

  var ORDER = ["lobby","secret","OBJECT","MOVE","LINE","review","verdict"];
  var CATS = ["OBJECT","MOVE","LINE"];

  // THE HOUSE. 9 rows of 6 = 54 seats, in three bands of three rows. Scene N
  // owns band N; each SHOW in that scene lights one of its rows. So the house
  // cannot pass two thirds until the final scene is staged - not a clamp, just
  // the arithmetic: the back third is Scene 3's band and nothing else fills it.
  var ROWS_PER_BAND = 3, SEATS_PER_ROW = 6, HOUSE_TOTAL = 54;

  var state = {
    sceneIdx:0, step:"lobby",
    picked:{OBJECT:null, MOVE:null, LINE:null},
    house:[0,0,0],        // best SHOW count per scene, 0-3
    staged:[false,false,false]
  };

  var stage = document.getElementById("stage");

  function scene(){ return SCENES[state.sceneIdx]; }

  function el(tag, cls, text){
    var e = document.createElement(tag);
    if(cls) e.className = cls;
    if(text) e.textContent = text;
    return e;
  }

  function cardById(cat, id){
    return scene().cards[cat].filter(function(c){ return c.id===id; })[0];
  }

  var SVGNS = "http://www.w3.org/2000/svg";
  function icon(cat, cls){
    var s = document.createElementNS(SVGNS,"svg");
    s.setAttribute("class","icn"+(cls?" "+cls:""));
    s.setAttribute("aria-hidden","true");
    s.setAttribute("focusable","false");
    var u = document.createElementNS(SVGNS,"use");
    u.setAttribute("href","#i-"+cat.toLowerCase());
    s.appendChild(u);
    return s;
  }

  // Scene plate: cream drawing on the scene's emotional color, bright rim.
  function sceneTile(sc){
    return '<svg class="tile" viewBox="0 0 64 64" aria-hidden="true" focusable="false">'
      + '<rect x="1.7" y="1.7" width="60.6" height="60.6" rx="13" fill="'+sc.tint.field
      + '" stroke="'+sc.tint.rim+'" stroke-width="3.2"/>'
      + '<g fill="none" stroke="#FAF6EE" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">'
      + sc.mark + '</g></svg>';
  }

  function go(step){
    state.step = step;
    render();
    window.scrollTo(0,0);
  }

  function render(){
    stage.innerHTML = "";
    if(state.step==="lobby") renderLobby();
    else if(state.step==="secret") renderSecret();
    else if(CATS.indexOf(state.step)>=0) renderChoice(state.step);
    else if(state.step==="review") renderReview();
    else renderVerdict();
  }

  /* ---------- the audience meter ---------- */

  function litRows(){
    var lit = [];
    for(var b=0; b<3; b++){
      var n = state.house[b];
      for(var r=0; r<ROWS_PER_BAND; r++) lit.push(r < n);
    }
    return lit;
  }

  function seatsFilled(){
    var n = 0;
    litRows().forEach(function(on){ if(on) n += SEATS_PER_ROW; });
    return n;
  }

  // The chart carries NO text of its own. A viewBox scales its own type down
  // with the container - at 390px wide the old 11px stage label rendered near
  // 10 real pixels, under the 18px floor. Every word here is HTML, so it obeys
  // the reader's own text size and never shrinks with the drawing.
  function houseSvg(){
    var lit = litRows();
    var heldBack = !state.staged[2];
    var p = [];
    for(var i=0; i<9; i++){
      var band = Math.floor(i/ROWS_PER_BAND);
      var y = 6 + i*20 + band*8;
      var w = 40 + i*1.6;
      var x0 = 180 - (SEATS_PER_ROW*w + (SEATS_PER_ROW-1)*6)/2;
      for(var k=0; k<SEATS_PER_ROW; k++){
        var box = 'x="'+(x0 + k*(w+6)).toFixed(1)+'" y="'+y+'" width="'+w.toFixed(1)
                + '" height="14" rx="3.5"';
        if(lit[i]){
          p.push('<rect '+box+' fill="#E8A13D" stroke="currentColor" stroke-width="1.8"/>');
        } else if(band===2 && heldBack){
          p.push('<rect '+box+' fill="none" stroke="currentColor" stroke-width="1.4"'
               + ' stroke-dasharray="4 3" opacity="0.34"/>');
        } else {
          p.push('<rect '+box+' fill="none" stroke="currentColor" stroke-width="1.4" opacity="0.42"/>');
        }
      }
    }
    if(heldBack){
      p.push('<line x1="8" y1="135" x2="352" y2="135" stroke="currentColor" stroke-width="2.2"'
           + ' stroke-dasharray="8 6" opacity="0.55"/>');
    }
    return '<svg viewBox="0 0 360 202" role="img">'+p.join("")+'</svg>';
  }

  function houseBlock(){
    var filled = seatsFilled();
    var full = filled === HOUSE_TOTAL;

    var box = el("section","housebox"+(full ? " full" : ""));
    box.appendChild(el("p","house-title", full ? "THE HOUSE - FULL" : "THE HOUSE"));
    box.appendChild(el("p","house-stagebar","STAGE"));

    var svgWrap = el("div","house-svg");
    svgWrap.innerHTML = houseSvg();
    svgWrap.firstChild.setAttribute("aria-label",
      "Seating chart, stage at the top. "+filled+" of "+HOUSE_TOTAL+" seats filled."
      + (state.staged[2] ? "" : " The back third is held until Scene 3 is staged."));
    box.appendChild(svgWrap);

    // The band key doubles as the per-scene scoreboard, in the scene's own color.
    var key = el("ul","house-key");
    SCENES.forEach(function(sc, i){
      var li = el("li");
      var sw = el("span","swatch");
      sw.style.background = sc.tint.field;
      sw.style.borderColor = sc.tint.rim;
      li.appendChild(sw);
      li.appendChild(document.createTextNode(
        "Scene "+(i+1)+": "+state.house[i]+" of "+ROWS_PER_BAND+" rows"));
      key.appendChild(li);
    });
    box.appendChild(key);

    var read = el("p","house-read");
    read.appendChild(document.createTextNode("HOUSE: "));
    read.appendChild(el("strong", null, String(filled)));
    read.appendChild(document.createTextNode(" OF "+HOUSE_TOTAL+" SEATS"));
    box.appendChild(read);

    var note;
    if(full){
      note = "A full house. Three scenes staged, and every single choice was something they could see.";
    } else if(!state.staged[2]){
      note = "Each scene seats one third. The back third belongs to Scene 3 and stays dark until you stage it, so two thirds is tonight's ceiling.";
    } else {
      note = "One row lights for every choice the house could see. Restage a scene to fill its band.";
    }
    box.appendChild(el("p","house-note", note));
    return box;
  }

  /* ---------- screens ---------- */

  function renderLobby(){
    stage.appendChild(el("p","stepline","TONIGHT'S PROGRAM"));
    stage.appendChild(el("p","lobby-note","Three scenes. Three secrets. Choose one and stage it."));
    SCENES.forEach(function(sc, i){
      var b = el("button","lobbybtn");
      b.type = "button";
      b.style.borderLeftColor = sc.tint.rim;
      b.setAttribute("aria-label","Scene "+(i+1)+": "+sc.name);

      var tile = document.createElement("span");
      tile.innerHTML = sceneTile(sc);
      b.appendChild(tile.firstChild);

      var txt = el("span");
      txt.appendChild(document.createTextNode("SCENE "+(i+1)));
      txt.appendChild(el("span","sname",sc.name));
      if(state.staged[i]){
        txt.appendChild(el("span","done",
          state.house[i]+" of 3 rows lit"+(state.house[i]===3 ? " - the whole band." : ".")));
      }
      b.appendChild(txt);

      b.addEventListener("click", function(){
        state.sceneIdx = i;
        state.fromReview = false;
        state.picked = {OBJECT:null, MOVE:null, LINE:null};
        go("secret");
      });
      stage.appendChild(b);
    });
    stage.appendChild(houseBlock());
  }

  function renderSecret(){
    stage.appendChild(el("p","stepline","SCENE "+(state.sceneIdx+1)+" OF "+SCENES.length+": "+scene().name));

    var nav = el("div","scenenav");
    SCENES.forEach(function(sc, i){
      var b = el("button","scenebtn");
      b.type = "button";
      var tile = document.createElement("span");
      tile.innerHTML = sceneTile(sc);
      b.appendChild(tile.firstChild);
      b.appendChild(document.createTextNode("SCENE "+(i+1)));
      b.setAttribute("aria-pressed", i===state.sceneIdx ? "true" : "false");
      b.setAttribute("aria-label","Go to scene "+(i+1)+": "+sc.name);
      b.addEventListener("click", function(){
        if(i===state.sceneIdx) return;
        state.sceneIdx = i;
        state.fromReview = false;
        state.picked = {OBJECT:null, MOVE:null, LINE:null};
        go("secret");
      });
      nav.appendChild(b);
    });
    stage.appendChild(nav);

    var s = el("div","secret");
    s.appendChild(el("span","tag","THE SECRET"));
    s.appendChild(el("p","body",scene().secret));
    stage.appendChild(s);

    // At rise, above the stage - the reader sees the situation before the reveal.
    stage.appendChild(el("p","scene-line",scene().scene));

    // The proscenium: curtains hauled open to reveal the scene's ink plate.
    // Fold lines are irregular curves so the fabric bunches naturally when gathered.
    var FOLDS_L = '<svg viewBox="0 0 100 160" preserveAspectRatio="none" aria-hidden="true">'
      +'<path d="M9 0 C 5 46, 13 98, 8 160 M22 0 C 27 38, 18 112, 24 160 M33 0 C 29 62, 38 118, 32 160'
      +' M48 0 C 53 44, 44 104, 50 160 M62 0 C 58 56, 67 116, 60 160 M77 0 C 82 48, 73 102, 79 160'
      +' M90 0 C 87 64, 94 122, 88 160" fill="none" stroke="#8E4237" stroke-width="2.6"/>'
      +'<path d="M13 0 C 9 50, 17 100, 12 160 M52 0 C 57 46, 48 106, 54 160 M81 0 C 86 50, 77 104, 83 160"'
      +' fill="none" stroke="#EBB3A4" stroke-width="1.3"/></svg>';
    var FOLDS_R = '<svg viewBox="0 0 100 160" preserveAspectRatio="none" aria-hidden="true">'
      +'<path d="M11 0 C 15 52, 7 108, 13 160 M25 0 C 21 44, 30 114, 23 160 M39 0 C 44 58, 35 120, 41 160'
      +' M53 0 C 49 40, 58 100, 51 160 M68 0 C 72 54, 63 112, 70 160 M82 0 C 78 46, 87 106, 80 160'
      +' M93 0 C 96 60, 90 124, 95 160" fill="none" stroke="#8E4237" stroke-width="2.6"/>'
      +'<path d="M18 0 C 22 52, 14 108, 20 160 M58 0 C 54 44, 63 104, 56 160 M87 0 C 91 50, 83 110, 89 160"'
      +' fill="none" stroke="#EBB3A4" stroke-width="1.3"/></svg>';

    var pros = el("div","proscenium");
    var inner = el("div","pros-inner");
    var pw = el("div","plate-wrap");
    pw.innerHTML = '<svg viewBox="0 0 240 160" aria-hidden="true" focusable="false">'+scene().plate+'</svg>';
    inner.appendChild(pw);
    pros.appendChild(inner);
    var cl = el("div","curtain cl"); cl.innerHTML = FOLDS_L;
    var cr = el("div","curtain cr"); cr.innerHTML = FOLDS_R;
    pros.appendChild(cl);
    pros.appendChild(cr);
    pros.appendChild(el("div","valance"));
    stage.appendChild(pros);

    var reduced = window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches;
    if(!reduced){
      setTimeout(function(){
        if(state.step==="secret" && pros.isConnected){
          pros.scrollIntoView({behavior:"smooth", block:"center"});
        }
      }, 1100);
    }

    var icons = el("div","iconrow");
    [["OBJECT","they see it"],["MOVE","they watch it"],["LINE","they hear it"]].forEach(function(pair){
      var chip = el("div","iconchip");
      chip.appendChild(icon(pair[0]));
      chip.appendChild(document.createTextNode("ONE "+pair[0]));
      chip.appendChild(el("span","sense",pair[1]));
      icons.appendChild(chip);
    });
    stage.appendChild(icons);

    var row = el("div","advance-row");
    var b = el("button","bigbtn","TO THE STAGE");
    b.type = "button";
    b.addEventListener("click", function(){ go("OBJECT"); });
    row.appendChild(b);
    stage.appendChild(row);
  }

  function renderChoice(cat){
    var p = PROMPTS[cat];
    stage.appendChild(el("p","stepline","CHOICE "+p.n+" OF 3"));
    stage.appendChild(icon(cat,"choice-icn"));
    var ask = (cat==="OBJECT") ? "Put one OBJECT on the stage."
            : (cat==="MOVE") ? "Give "+scene().who+" one MOVE."
            : "Give "+scene().who+" one LINE.";
    stage.appendChild(el("p","prompt",ask));
    var sub = (cat==="OBJECT") ? "Something the audience can see."
            : (cat==="MOVE") ? "Something the audience watches "+scene().who+" do."
            : "Something the audience can hear.";
    stage.appendChild(el("p","subprompt",sub));

    var bank = el("div","bank");
    scene().cards[cat].forEach(function(c){
      var b = el("button","cardbtn",c.text);
      b.type = "button";
      b.setAttribute("aria-pressed", state.picked[cat]===c.id ? "true" : "false");
      if(state.picked[cat]===c.id) b.appendChild(el("span","onstage","ON STAGE"));
      b.addEventListener("click", function(){
        state.picked[cat] = (state.picked[cat]===c.id) ? null : c.id;
        render();
      });
      bank.appendChild(b);
    });
    stage.appendChild(bank);

    if(state.picked[cat]){
      var card = cardById(cat, state.picked[cat]);
      var fran = el("div","franbox");
      fran.appendChild(el("span","who","FRAN, STAGE MANAGER, ON HEADSET"));
      fran.appendChild(el("p", null, FRAN[cat][card.kind]));
      stage.appendChild(fran);
    }

    var row = el("div","advance-row");
    var next = el("button","bigbtn", state.fromReview ? "BACK TO CURTAIN"
                 : cat==="LINE" ? "TO THE REVIEW" : "NEXT");
    next.type = "button";
    next.disabled = !state.picked[cat];
    next.addEventListener("click", function(){
      if(state.fromReview){ state.fromReview = false; go("review"); }
      else go(cat==="OBJECT" ? "MOVE" : cat==="MOVE" ? "LINE" : "review");
    });
    row.appendChild(next);
    stage.appendChild(row);
  }

  function renderReview(){
    state.fromReview = false;
    stage.appendChild(el("p","stepline","YOUR STAGING"));
    CATS.forEach(function(cat){
      var card = cardById(cat, state.picked[cat]);
      var item = el("div","review-item");
      var head = el("div","cathead");
      head.appendChild(icon(cat));
      head.appendChild(el("span","cat", cat==="OBJECT" ? "THE OBJECT" : cat==="MOVE" ? "THE MOVE" : "THE LINE"));
      item.appendChild(head);
      item.appendChild(el("p", null, card.text));
      var swap = el("button","swap","CHANGE THIS");
      swap.type = "button";
      swap.setAttribute("aria-label","Change the "+cat.toLowerCase()+" choice");
      swap.addEventListener("click", function(){ state.fromReview = true; go(cat); });
      item.appendChild(swap);
      stage.appendChild(item);
    });
    var row = el("div","advance-row");
    var b = el("button","bigbtn","CURTAIN");
    b.type = "button";
    b.addEventListener("click", function(){ go("verdict"); });
    row.appendChild(b);
    stage.appendChild(row);
  }

  function renderVerdict(){
    var kinds = CATS.map(function(cat){ return cardById(cat, state.picked[cat]).kind; });
    var shows = kinds.filter(function(k){ return k==="SHOW"; }).length;
    var tells = kinds.filter(function(k){ return k==="TELL"; }).length;

    // The house remembers your best night in each scene.
    var before = state.house[state.sceneIdx];
    state.staged[state.sceneIdx] = true;
    state.house[state.sceneIdx] = Math.max(before, shows);

    CATS.forEach(function(cat){
      var card = cardById(cat, state.picked[cat]);
      var r = scene().react[cat][card.kind];
      var div = el("div","row-react");
      var head = el("div","cathead");
      head.appendChild(icon(cat));
      head.appendChild(el("span","cat", cat==="OBJECT" ? "YOUR OBJECT" : cat==="MOVE" ? "YOUR MOVE" : "YOUR LINE"));
      div.appendChild(head);
      div.appendChild(el("p","staged", card.text));
      div.appendChild(el("span","who", r.who));
      div.appendChild(el("p",null,r.say));
      stage.appendChild(div);
    });

    var key = shows===3 ? "win" : tells===3 ? "seminar"
            : kinds.indexOf("INVISIBLE")>=0 ? "invisible" : "told";
    var vd = VERDICTS[key];
    var ban = el("div","banner "+vd.cls);
    ban.appendChild(el("span","head",vd.head));
    ban.appendChild(el("p",null, key==="win" ? scene().winBody : vd.body));
    stage.appendChild(ban);

    stage.appendChild(houseBlock());
    stage.appendChild(el("p","houselights",
      "Scene "+(state.sceneIdx+1)+" seated "+(shows*SEATS_PER_ROW)+" of its "
      +(ROWS_PER_BAND*SEATS_PER_ROW)+". From the workshop: if the audience doesn't see it or hear it, they won't know it."));

    var row = el("div","advance-row");
    var again = el("button","bigbtn","RESTAGE");
    again.type = "button";
    again.addEventListener("click", function(){ go("review"); });
    var nextScene = el("button","bigbtn", state.sceneIdx < SCENES.length-1 ? "NEXT SCENE" : "SCENE ONE");
    nextScene.type = "button";
    nextScene.addEventListener("click", function(){
      state.sceneIdx = (state.sceneIdx+1) % SCENES.length;
      state.picked = {OBJECT:null, MOVE:null, LINE:null};
      go("secret");
    });
    row.appendChild(again); row.appendChild(nextScene);
    stage.appendChild(row);
  }

  function resetAll(){
    state.sceneIdx = 0;
    state.fromReview = false;
    state.picked = {OBJECT:null, MOVE:null, LINE:null};
    state.house = [0,0,0];
    state.staged = [false,false,false];
    go("lobby");
  }

  document.getElementById("homeBtn").addEventListener("click", resetAll);
  document.getElementById("backBtn").addEventListener("click", function(){
    var i = ORDER.indexOf(state.step);
    if(i>0) go(ORDER[i-1]);
  });
  document.getElementById("comfortBtn").addEventListener("click", function(){
    var b = document.body;
    var c = parseInt(b.getAttribute("data-comfort"),10);
    b.setAttribute("data-comfort", String(c===3 ? 1 : c+1));
  });

  // DARK HOST LAW: on a dark-preferring device the whole comfort ladder runs on
  // the dark side (warm dark, deep dark, black), so no stop is ever a light
  // palette and no host repaint can produce white-on-white. COMFORT still
  // cycles three visibly distinct stops.
  if(window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches){
    document.body.setAttribute("data-scheme","dark");
  }

  render();
})();
</script>
</body>
</html>
