<title>Funnybonies Playground</title>
<meta name="description" content="Pim sits outside the group and only sees the shapes of their jokes. A pebble machine sells him the shapes, one at a time.">
<meta name="spec-source" content="funnybonies/SPEC-LINK-v15.md">
<meta name="audience" content="kids, grades 3 to 6">
<style>
:root{
  --ink:#1f1a2e;       /* text on paper */
  --paper:#fbf3df;     /* panel and card surface */
  --plum:#3a2e5c;      /* button surface */
  --cream:#fff6e3;     /* text on plum and on the board */
  --line:#2a2238;      /* ink edges, decorative */
  --gold:#f2b134;      /* glow, decorative only */
  --dim:#4a4160;       /* secondary text on paper */
  --board:#241c33;     /* backing board behind the paper set */
  color-scheme: light;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%}
body{margin:0;background:var(--board);color:var(--ink);
  font-family:"Atkinson Hyperlegible",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;font-size:20px;line-height:1.45}
.disp{font-family:ui-rounded,"SF Pro Rounded","Arial Rounded MT Bold","Nunito",system-ui,sans-serif}

/* studio chrome: quiet weight, so the one invitation is the joke */
.se-chrome{display:flex;align-items:center;gap:10px;padding:8px 16px;background:var(--plum)}
.se-chrome a{color:var(--cream);text-decoration:none;font-weight:500;font-size:18px;min-height:44px;display:inline-flex;align-items:center;padding:0 12px;border-radius:10px;border:2px solid var(--cream)}
.se-chrome h1{margin:0 0 0 auto;font-size:20px;font-weight:500;color:var(--cream);display:flex;align-items:center;gap:8px;flex-wrap:wrap;justify-content:flex-end}
.ver,.tsp-lab{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:18px;font-weight:500;background:var(--cream);color:var(--plum);border-radius:8px;padding:0 8px}
.se-rail{display:flex;gap:10px;justify-content:center;padding:8px 16px 22px}
.se-rail a,.se-rail button{min-height:48px;padding:6px 20px;border-radius:12px;border:2px solid var(--cream);background:transparent;color:var(--cream);font:inherit;font-size:18px;font-weight:500;text-decoration:none;display:inline-flex;align-items:center;cursor:pointer}
a:focus-visible,button:focus-visible{outline:4px solid var(--gold);outline-offset:3px}

.app{max-width:1180px;margin:0 auto;padding-inline:16px;padding-block:12px}
.stage{position:relative;border-radius:16px;overflow:hidden;background:var(--board);box-shadow:inset 0 0 0 2px #3b3052}
#scene{display:block;width:100%;height:auto;max-height:calc(100vh - 205px);margin-inline:auto;touch-action:manipulation}
@media (max-width:699px){#scene{max-height:none}}
.top{display:flex;flex-wrap:wrap;gap:12px 16px;align-items:center}.top .cap{flex:1 1 320px}

/* hand panel */
.hand{margin-top:12px;background:var(--paper);border:2px solid var(--line);border-radius:16px;padding:14px 16px;display:grid;gap:12px;box-shadow:0 5px 0 #150f20}
.cap{margin:0;font-size:22px;font-weight:700;min-height:1.45em;text-wrap:balance}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.lbl{font-size:18px;color:var(--dim);font-weight:700;letter-spacing:.02em}
.chip{min-height:48px;padding:6px 14px;border-radius:24px;border:2px solid var(--plum);background:var(--paper);color:var(--ink);font:inherit;font-size:18px;font-weight:500;cursor:pointer}
.chip[aria-pressed="true"]{background:var(--plum);color:var(--cream)}
.chip .mk{display:inline-block;width:12px;height:12px;border-radius:50%;border:2px solid currentColor;margin-left:8px;vertical-align:middle}
.chip.landed .mk{background:currentColor}
.go{min-height:56px;padding:8px 26px;border-radius:14px;border:2px solid var(--line);background:var(--plum);color:var(--cream);font:inherit;font-size:22px;font-weight:700;cursor:pointer;box-shadow:0 4px 0 #150f20}
.go:active{transform:translateY(3px);box-shadow:0 1px 0 #150f20}

.builder{display:grid;gap:10px}
.setup{margin:0;font-size:24px;font-weight:700;line-height:1.3}
.ends{display:grid;gap:10px}
.end{min-height:56px;text-align:left;padding:10px 16px;border-radius:14px;border:2px solid var(--line);background:var(--cream);color:var(--ink);font:inherit;font-size:21px;font-weight:500;cursor:pointer;box-shadow:0 3px 0 #b9ab8c}
.end[disabled]{opacity:.4;cursor:default;text-decoration:line-through}

/* card */
.card-wrap{position:fixed;inset:0;background:rgba(20,15,30,.66);display:grid;place-items:center;padding:16px;z-index:20;overflow:auto}
.card{width:min(540px,100%);background:var(--paper);color:var(--ink);border:2px solid var(--line);border-radius:6px 22px 8px 20px;padding:20px 22px;display:grid;gap:10px;box-shadow:0 12px 0 rgba(0,0,0,.3);animation:drop .5s cubic-bezier(.2,1.4,.4,1);transform-origin:50% 0}
.card-no{margin:0;font-size:18px;font-weight:700;color:var(--dim);letter-spacing:.05em;text-transform:uppercase}
.card h2{margin:0;font-size:38px;line-height:1.05;text-wrap:balance}
.term{margin:0;font-size:18px;color:var(--dim)}.term b{color:var(--ink)}
.what{margin:0;font-size:21px}
.ex{margin:0;padding:10px 14px;border-left:6px solid var(--plum);background:var(--cream);font-size:21px}
.ex b{display:block}
.shape{display:flex;gap:6px;align-items:center;font-size:18px;color:var(--dim);font-weight:700;flex-wrap:wrap}
.shape svg{width:34px;height:34px}
.card.poof{animation:poof .6s ease-in forwards}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(112px,1fr));gap:10px}
.slotb{min-height:112px;border-radius:12px;border:2px solid var(--line);background:var(--cream);color:var(--ink);font:inherit;font-size:18px;font-weight:700;display:grid;place-items:center;align-content:center;gap:4px;padding:8px 6px;cursor:pointer;line-height:1.15;text-align:center;box-shadow:0 3px 0 #b9ab8c}
.slotb svg{width:48px;height:48px}
.slotb.own{border:4px solid var(--plum)}
.slotb small{font-size:18px;font-weight:500;color:var(--dim)}
.peb{display:inline-flex;align-items:center;gap:6px;font-size:22px;font-weight:700;color:var(--ink);padding:0 6px}.peb svg{width:34px;height:34px}
.slotb[disabled]{opacity:.45;cursor:default}
.alt{min-height:52px;padding:8px 20px;border-radius:14px;border:2px solid var(--line);background:var(--paper);color:var(--ink);font:inherit;font-size:20px;font-weight:700;cursor:pointer}
.cardhead{display:flex;gap:14px;align-items:center}.bigicon{width:64px;height:64px;flex:none}
@keyframes drop{from{transform:translateY(-110%) rotate(-5deg)}to{transform:none}}
@keyframes poof{30%{transform:scale(1.05) rotate(2deg)}100%{transform:scale(.05) rotate(40deg);opacity:0}}
.puff{position:fixed;width:16px;height:16px;border-radius:3px;background:var(--cream);border:2px solid var(--line);z-index:30;pointer-events:none;animation:puff .75s ease-out forwards}
@keyframes puff{to{transform:translate(var(--dx),var(--dy)) rotate(200deg) scale(.3);opacity:0}}

/* ---------- the paper set ---------- */
.cr{transition:transform 1.9s cubic-bezier(.45,.05,.3,1)}
.part,.body,.arm,.ear,.neck,.ant,.eye,.lid,.jaw{transform-box:fill-box}
.body{transform-origin:50% 100%}
.arm{transform-origin:50% 8%}
.ear{transform-origin:50% 95%}
.neck{transform-origin:50% 100%}
.ant{transform-origin:50% 100%}
.eye,.lid{transform-origin:50% 50%}
.cr.walk .body{animation:bob .32s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(-7px) rotate(2deg)}}
.hit{cursor:pointer}.hit:focus{outline:none}
.ring{fill:none;stroke:var(--gold);stroke-width:5;opacity:0;stroke-dasharray:12 9}
.hit:focus-visible .ring{opacity:1;stroke-width:7}
.aim .ring{opacity:1;animation:spin 3s linear infinite}
@keyframes spin{to{stroke-dashoffset:-84}}
#machine.glow .ring{opacity:1;animation:spin 2s linear infinite}
#machine.glow .mbody{animation:hum 1.4s ease-in-out infinite;transform-box:fill-box;transform-origin:50% 100%}
@keyframes hum{50%{transform:scale(1.03,.98)}}
.m-laugh{opacity:0}.laugh .m-rest{opacity:0}.laugh .m-laugh{opacity:1}
.tag rect{fill:#2a2238}
.tagt{font:700 21px ui-rounded,"Arial Rounded MT Bold",system-ui,sans-serif;fill:#fff6e3;color:#fff6e3;text-anchor:middle}
#scene.tall .cr .tag{transform:scale(1.62);transform-box:fill-box;transform-origin:50% 0}

/* idle life: each creature fidgets in character */
.lugs .earL{animation:twitch 4.2s ease-in-out infinite}
.lugs .earR{animation:twitch 4.2s ease-in-out 1.3s infinite}
@keyframes twitch{0%,86%,100%{transform:rotate(0)}90%{transform:rotate(-14deg)}95%{transform:rotate(6deg)}}
.blorp .body{animation:breathe 3.4s ease-in-out infinite}
@keyframes breathe{50%{transform:scale(1.04,.96)}}
.stilt .neck{animation:sway 5s ease-in-out infinite}
@keyframes sway{50%{transform:rotate(4deg)}}
.peep .lid{animation:blinkid 3.1s steps(1) infinite;opacity:0}
.peep .lid.b{animation-delay:.9s}.peep .lid.c{animation-delay:1.7s}
@keyframes blinkid{0%,92%{opacity:0}93%,100%{opacity:1}}
.quill .ant{animation:bobant 2.6s ease-in-out infinite}
@keyframes bobant{50%{transform:rotate(-8deg)}}
.echo .body{animation:peer 6s ease-in-out infinite}
@keyframes peer{0%,70%,100%{transform:none}80%{transform:rotate(-5deg)}90%{transform:rotate(5deg)}}

/* laughs: arms slap, plus each creature's own move */
.laugh .body{animation:none}
.laugh .armL{animation:slapL .22s ease-in-out 8}
.laugh .armR{animation:slapR .22s ease-in-out 8}
@keyframes slapL{50%{transform:rotate(55deg)}}
@keyframes slapR{50%{transform:rotate(-55deg)}}
.laugh.pim .body{animation:hop .28s ease-in-out 6}
@keyframes hop{50%{transform:translateY(-16px) scale(1.05,.95)}}
.laugh.blorp .body{animation:jig .2s ease-in-out 9}
@keyframes jig{25%{transform:scale(1.15,.85)}75%{transform:scale(.88,1.12)}}
.laugh.stilt .neck{animation:wob .3s ease-in-out 6}
@keyframes wob{25%{transform:rotate(-18deg)}75%{transform:rotate(15deg)}}
.laugh.lugs .earL{animation:flapL .18s ease-in-out 10}
.laugh.lugs .earR{animation:flapR .18s ease-in-out 10}
@keyframes flapL{50%{transform:rotate(-40deg)}}
@keyframes flapR{50%{transform:rotate(40deg)}}
.laugh.peep .body{animation:hop .24s ease-in-out 7}
.laugh.echo .body{animation:flipx .42s ease-in-out 4}
@keyframes flipx{50%{transform:scaleX(-1)}}
.laugh.quill .ant{animation:boing .2s ease-in-out 8}
.laugh.quill .body{animation:tilt .44s ease-in-out 3}
@keyframes boing{50%{transform:scaleY(1.5)}}
@keyframes tilt{25%{transform:rotate(-8deg)}75%{transform:rotate(8deg)}}
.meh .body{animation:meh 1.1s ease-in-out 1}
@keyframes meh{30%{transform:translateY(3px) scale(1.02,.97)}65%{transform:rotate(-5deg)}}
.flopped .body{animation:slump 1.2s ease-in-out 1}
@keyframes slump{35%{transform:translateY(6px) scale(1.06,.9)}}

/* pokeables */
.poke{cursor:pointer}
.sway{animation:swingit 1.6s ease-in-out 2;transform-box:fill-box;transform-origin:50% 0}
@keyframes swingit{25%{transform:rotate(22deg)}75%{transform:rotate(-18deg)}}
.leaf{transition:transform 1.6s cubic-bezier(.3,.1,.5,1),opacity .4s}
.wink .sunlid{opacity:1}
.sunlid{opacity:0;transition:opacity .1s}
.ball{transition:transform 1.1s cubic-bezier(.5,0,.7,1)}
.bub{transition:opacity .25s;pointer-events:none}.bub.off{opacity:0}
#fx{pointer-events:none}
.say-t{font:700 22px ui-rounded,"Arial Rounded MT Bold",system-ui,sans-serif;fill:#1f1a2e;color:#1f1a2e}
#scene.tall .say-t{font-size:33px}
.say-t .punch{fill:#7a2233}

@media (prefers-reduced-motion: reduce){
  .cr,.leaf,.ball{transition-duration:.01s}
  .card,.card.poof{animation-duration:.01s}
  .lugs .earL,.lugs .earR,.blorp .body,.stilt .neck,.quill .ant,.echo .body,.peep .lid{animation:none}
  .laugh .body,.laugh .neck,.laugh .earL,.laugh .earR,.laugh .ant,.laugh .armL,.laugh .armR,.meh .body,.flopped .body,.cr.walk .body,.aim .ring,#machine.glow .ring,#machine.glow .mbody,.sway{animation-iteration-count:1;animation-duration:.45s}
}
@media (max-width:520px){.card h2{font-size:31px}.cap{font-size:20px}.setup{font-size:22px}}
</style>

<script>

  if(isNew){S.joined.push(id);nodes[id].classList.add("walk");place(false);await sleep(1950);nodes[id].classList.remove("walk");place(true)}
  S.busy=false;S.target=null;
  if(S.joined.length===ORDER.length&&!S.won)return win();
  after();
 }else{
  meh(id);S.missed[id]=(S.missed[id]||0)+1;
  await sleep(700);nodes.say.classList.add("off");
  say(`${c.name} didn't laugh. Wrong shape for ${c.name}. Watch which one ${c.name} likes.`);
  $("builder").hidden=true;S.busy=false;S.target=null;aimMode(true);
  setTimeout(()=>showcase(id),900);
 }
}
function after(){if(!S.pebbleSpots.length&&S.pebbles<1)dropPebble();const left=ORDER.length-S.joined.length;
 const lean=S.joined.length>=2?" The others are creeping closer.":"";
 glowMachine(true);say(`${left} still over there.${lean} Two pebbles shook loose.`)}
async function win(){
 S.won=true;S.busy=true;aimMode(false);glowMachine(false);$("pocketRow").hidden=true;
 say("Everybody is sitting with Pim. He has one more joke.");await sleep(1200);
 stopChat();await perform("pim",FINAL.s,FINAL.e,"joke");FX.flop();await sleep(900);
 laugh("pim");ORDER.forEach((id,i)=>setTimeout(()=>laugh(id,.9),200+i*110));
 say("The worst joke of the day gets the biggest laugh. Everybody laughs together.");
 await sleep(2600);hideBubbles();
 S.ended=true;["pim",...ORDER].forEach(id=>nodes[id].classList.add("walk"));place(false);await sleep(1950);
 ["pim",...ORDER].forEach(id=>nodes[id].classList.remove("walk"));place(true);
 say("The bench is empty. Everybody is playing.");S.busy=false;
 const b=$("getJoke");b.textContent="Play again";$("goRow").hidden=false;b.focus({preventScroll:true});
}
function reset(){stopChat();Object.assign(S,{pebbles:0,learned:[],sel:null,target:null,joined:[],landed:{},told:{},missed:{},won:false,ended:false,busy:false,joke:null,flopsTried:[]});
 $("getJoke").textContent="Get a joke";$("pebbles").innerHTML="";S.pebbleSpots=[];for(let i=0;i<3;i++)dropPebble();renderPebbles();$("builder").hidden=true;hideBubbles();renderPocket();place(false);glowMachine(true);aimMode(false);say(START)}

/* ---------- input ---------- */
function act(id){
 if(S.busy)return;A();
 if(id==="machine")return S.ended?reset():openShop();
 if(S.ended){laugh(id);return}
 if(id==="pim"){laugh("pim");hideBubbles();say("Pim laughs at everything, even when he doesn't get it.");return}
 if(!S.sel){poke(id);return}
 hideBubbles();stopChat();S.target=id;aimMode(false);ORDER.forEach(x=>nodes[x].classList.toggle("aim",x===id));openBuilder();
}
function poke(id){ // before Pim knows a joke, creatures just react in character
 const n=nodes[id];n.classList.remove("meh");void n.getBBox();n.classList.add("meh");FX.boing();setTimeout(()=>n.classList.remove("meh"),1200);
 say(`${CR[id].name} doesn't look up. Pim has no joke yet.`)}
function wire(){["machine","pim",...ORDER].forEach(id=>{const n=nodes[id];
 n.addEventListener("click",()=>act(id));n.addEventListener("keydown",e=>{if(e.key==="Enter"||e.key===" "){e.preventDefault();act(id)}})})}
function wirePokes(){
 const sun=$("sunG");sun.addEventListener("click",()=>{A();FX.wink();sun.classList.add("wink");setTimeout(()=>sun.classList.remove("wink"),600)});
 const sw=$("swingG");sw.addEventListener("click",()=>{A();FX.swish();["seatA","seatB"].forEach((s,i)=>{const e=$(s);e.classList.remove("sway");void e.getBBox();setTimeout(()=>e.classList.add("sway"),i*160)})});
 const tr=$("treeG");tr.addEventListener("click",()=>{A();const lf=$("leaf");const [px,py]=S.ended?L.play[0]:L.pim,tx=L.tree[0]+20,tyy=L.tree[1]-120;
  lf.style.transition="none";lf.style.transform="none";lf.style.opacity=1;lf.getBoundingClientRect();lf.style.transition="";
  lf.style.transform=`translate(${px-tx-8}px,${py-72-tyy}px) rotate(160deg)`;
  setTimeout(()=>{if(!S.busy){laugh("pim",.6)}},1500);setTimeout(()=>{lf.style.opacity=0},2600)});
 const sl=$("slideG");sl.addEventListener("click",()=>{A();const b=$("ball");b.style.transition="none";b.style.transform="none";b.getBoundingClientRect();b.style.transition="";
  b.style.transform="translate(92px,78px)";FX.swish();setTimeout(()=>{FX.boing();b.style.transform="translate(122px,70px)"},1100);setTimeout(()=>{b.style.transition="none";b.style.transform="none"},2600)});
}
$("teach").onclick=()=>{A();if(S.learned.includes(S.view))useJoke(S.view);else teach(S.view)};
$("cardBack").onclick=()=>{if(S.from==="shop")openShop();else closeWrap()};
$("shopClose").onclick=closeWrap;
$("cardWrap").addEventListener("keydown",e=>{if(e.key==="Escape")closeWrap()});
$("getJoke").onclick=()=>{if(S.ended)return reset();openShop()};
renderPebbles();

/* ---------- the yard talks: neighbours trade the jokes they love, out loud ---------- */
let chatId=0;
function quiet(){return S.busy||!$("cardWrap").hidden||!$("builder").hidden||S.ended}
function free(id){return !S.joined.includes(id)}
function shapeBubble(node,anchor,icon,up){
 node.innerHTML="";const tall=L===LAYOUT.tall,iz=tall?58:46,bw=iz+26,bh=iz+22;
 const [px,py0]=anchor,py=py0-(up||0);const bx=Math.max(12,Math.min(L.w-bw-12,px-bw/2+10)),by=Math.max(12,py-(tall?118:98)-bh);
 el("rect",{x:bx,y:by,width:bw,height:bh,rx:16,fill:"#fbf3df",stroke:"#2a2238","stroke-width":2.6,filter:"url(#lift)"},node);
 const tx=Math.max(bx+16,Math.min(bx+bw-30,px-6));
 el("path",{d:`M${tx} ${by+bh-1}l6 ${tall?34:20} 12 -${tall?34:20}`,fill:"#fbf3df",stroke:"#2a2238","stroke-width":2.6,"stroke-linejoin":"round"},node);
 el("rect",{x:tx-2,y:by+bh-5,width:24,height:8,fill:"#fbf3df"},node);
 el("use",{href:"#s-"+icon,x:bx+13,y:by+11,width:iz,height:iz},node);node.classList.remove("off");
}
/* A creature shows a shape to its neighbour. No words: from the bench, Pim only sees the shapes. */
async function chat(listener,typeId,teller,pimLate){
 const my=++chatId,alive=()=>my===chatId&&!S.busy&&$("cardWrap").hidden&&!S.ended;
 const up=teller==="stilt"?52:0;
 shapeBubble(nodes.chat,pos(teller),T[typeId].icon,up);murmur();
 await sleep(1500);if(!alive())return;
 if(CR[listener].likes.includes(typeId))laugh(listener,.5);else meh(listener);
 if(CR[teller].likes.includes(typeId))setTimeout(()=>laugh(teller,.4),260);
 if(pimLate)setTimeout(()=>{if(alive())laugh("pim",.55)},1100);
 await sleep(2000);if(my===chatId)nodes.chat.classList.add("off");
}
function pick(a){return a[Math.floor(Math.random()*a.length)]}
function ambient(){
 if(!quiet()){
  const open=PAIRS.filter(([x,y])=>free(x)&&free(y));
  if(open.length){const [x,y,shared]=pick(open);const [teller,listener]=Math.random()<.5?[x,y]:[y,x];
   // mostly the shared taste; sometimes the teller's own other taste, which the listener shrugs at
   const others=CR[teller].likes.filter(k=>k!==shared&&!CR[listener].likes.includes(k));
   const type=(Math.random()<.68||!others.length)?shared:pick(others);
   chat(listener,type,teller,!S.learned.length&&Math.random()<.35);
  }else{const left=ORDER.filter(free);if(left.length){const listener=pick(left),teller=pick(ORDER.filter(k=>k!==listener));chat(listener,pick(CR[listener].likes),teller,false)}}
 }
 setTimeout(ambient,8500+Math.random()*3000);
}
function showcase(id){ // after a miss: the neighbour tells it one it loves
 if(quiet())return;const pair=PAIRS.find(p=>p.includes(id))||[];const teller=pair.find(k=>k!==id)||pick(ORDER.filter(k=>k!==id));
 chat(id,pick(CR[id].likes),teller,false);
}
/* the held breath: Stilt tells Blorp a gross one, they crack up, Pim laughs along too late, nobody turns */
function overture(){setTimeout(()=>{if(!S.learned.length&&!quiet())chat("blorp","shock","stilt",true)},900);setTimeout(ambient,9000)}

/* ---------- boot ---------- */
const START="Pim doesn't get their jokes. He only sees the shapes. But look: a new machine, and it takes pebbles.";
function pickLayout(){const want=window.innerWidth<700?LAYOUT.tall:LAYOUT.wide;if(want!==L){const n=S.pebbleSpots.length;L=want;drawBG();S.pebbleSpots=[];for(let i=0;i<n;i++)dropPebble();place(true)}}
drawBG();build();place(true);glowMachine(true);say(START);for(let i=0;i<3;i++)dropPebble();overture();
let rt;window.addEventListener("resize",()=>{clearTimeout(rt);rt=setTimeout(pickLayout,150)});
})();
</script>
