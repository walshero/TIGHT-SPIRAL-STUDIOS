<!-- TSP build: Fair Grounds: Strongman v0.2 | LAB | 2026-11-09
     v0.2 (founder pushback, "Couldn't you check decibels and town ordinance"): "The fair is way too
     loud" was arguable, so it splits into a judgment ("too loud to enjoy") and a checkable claim that
     names the standard (the town 70-decibel limit). Four more items reworded so no judgment hides a
     checkable standard. Muscle counter is plain words so the sound button never leaves the screen.
     Founder words (2026-11-09): "a fact/opinion sorter that gives you strength in a strongman/bell
     game" ... "Let's call it Fair Grounds and start with strong man".
     Fair Grounds is the midway of critical-thinking booths; Strongman is booth one.
     Play: the barker tosses eight claims. Sort each one: Checkable (a fact claim you could look up
     or measure, true or not), Judgment (an opinion, a value, a should), or Both (a checkable part
     glued to a judgment). Every right call adds muscle and the hammer head grows. Then one swing:
     muscle sets how high the puck can go, timing adds the last quarter. Only eight of eight can ring
     the bell. A weak swing gets a bell that is not impressed.
     Teaching line: checkable does not mean true. A false claim is still checkable.
     Single file, offline, no external hosts. No emoji. Three modes on one button. -->

<script>
(()=>{
const $=id=>document.getElementById(id);
const NS='http://www.w3.org/2000/svg';
const RM=(()=>{try{return matchMedia('(prefers-reduced-motion: reduce)').matches}catch(e){return false}})();
const store={get(k,d){try{const v=localStorage.getItem('fg_'+k);return v===null?d:JSON.parse(v)}catch(e){return d}},set(k,v){try{localStorage.setItem('fg_'+k,JSON.stringify(v))}catch(e){}}};

/* ---------- the claims: town fair, no parties, no real people ----------
   c = checkable (a fact claim: you could look it up, count or measure it, true or not)
   j = judgment (opinion, taste, value, or a should)
   b = both: a checkable part glued to a judgment. parts = [checkable, judgment] */
const CLAIMS=[
 {t:'c',s:'The Ferris wheel is 60 feet tall.',w:'Someone could measure it with a tape and a ladder.'},
 {t:'c',s:'The fair first opened in 1952.',w:'The town records would settle it.'},
 {t:'c',s:'Corn dogs cost six dollars this year.',w:'Walk to the stand and read the sign.'},
 {t:'c',s:'More people came on Saturday than on Friday.',w:'Count the ticket stubs.'},
 {t:'c',s:'The bumper cars run on electricity.',w:'Look at the pole on the back of each car.'},
 {t:'c',s:'This ride has passed every inspection since 2019.',w:'The inspection reports would show it.'},
 {t:'c',s:'Cotton candy is mostly sugar.',w:'A recipe or a lab could check it.'},
 {t:'c',s:'The fairgrounds flood almost every spring.',w:'Weather and town records would show it.'},
 {t:'c',s:'Nobody rang the bell at all last Saturday.',w:'Checkable even though it is hard to check: ask the operator, or watch the tape. Checkable does not mean easy.'},
 {t:'c',s:'The carousel horses are carved from solid gold.',w:'Almost surely false, and still checkable. Checkable does not mean true.'},
 {t:'c',s:'The pie contest had 41 entries.',w:'The judges kept a list.'},
 {t:'c',s:'The haunted house is closed on Sundays.',w:'Read the schedule on the gate.'},
 {t:'j',s:'The Ferris wheel is the best ride here.',w:'"Best" is a taste. No tape measure can settle it.'},
 {t:'j',s:'Funnel cake beats cotton candy.',w:'A preference. People will always disagree, and nobody is wrong.'},
 {t:'j',s:'The fair is too loud to enjoy.',w:'"Too loud to enjoy" is about the listener. Name a standard instead, like the town noise limit, and it turns checkable.'},
 {t:'c',s:'The fair breaks the town noise limit of 70 decibels after 10 p.m.',w:'A decibel meter and the town ordinance settle it. Naming a standard turns "too loud" into something you can check.'},
 {t:'j',s:'Clowns are creepy.',w:'A feeling about clowns, not something you could look up.'},
 {t:'j',s:'Six dollars is worth it for a corn dog this good.',w:'The price is checkable. Whether it is worth it is a judgment.'},
 {t:'j',s:'The old carousel had more charm.',w:'Charm lives in the eye of the rider.'},
 {t:'j',s:'Everyone should enter the pie contest.',w:'"Should" is a value. Watch for should, best, worst, too, enough.'},
 {t:'j',s:'The new lights are ugly.',w:'Taste. Somebody out there loves them.'},
 {t:'j',s:'Saturday night is the most fun night of the fair.',w:'"Most fun" is a judgment. Attendance would be the checkable version.'},
 {t:'j',s:'The town should keep the fair free.',w:'A should. You can argue for it with reasons, but you cannot look it up.'},
 {t:'j',s:'The petting zoo is the heart of the fair.',w:'A value judgment dressed up nicely.'},
 {t:'j',s:'Ticket lines are a waste of a good evening.',w:'"A waste" is a judgment about the wait.'},
 {t:'b',s:'The new lights cost $40,000, which is a waste.',p:['The new lights cost $40,000','which is a waste']},
 {t:'b',s:'The Ferris wheel is 60 feet tall and terrifying.',p:['The Ferris wheel is 60 feet tall','and terrifying']},
 {t:'b',s:'Attendance doubled this year, so the new fair director is brilliant.',p:['Attendance doubled this year','so the new fair director is brilliant']},
 {t:'b',s:'The pie contest has run since 1960 and is still the best part of the fair.',p:['The pie contest has run since 1960','and is still the best part of the fair']},
 {t:'b',s:'Corn dogs went up two dollars. Total ripoff.',p:['Corn dogs went up two dollars','Total ripoff']},
 {t:'b',s:'The carousel was built in 1921 and is the most beautiful ride in the state.',p:['The carousel was built in 1921','and is the most beautiful ride in the state']},
 {t:'b',s:'Ticket lines ran 40 minutes on Saturday, which ruined my night.',p:['Ticket lines ran 40 minutes on Saturday','which ruined my night']},
 {t:'b',s:'The fair raised $12,000 for the library, the best cause in town.',p:['The fair raised $12,000 for the library','the best cause in town']},
 {t:'b',s:'The haunted house runs eight minutes, the best eight minutes of the fair.',p:['The haunted house runs eight minutes','the best eight minutes of the fair']},
 {t:'b',s:'Three hundred volunteers work the fair, and they are its real heroes.',p:['Three hundred volunteers work the fair','and they are its real heroes']}
];
const TNAME={c:'Checkable',j:'Judgment',b:'Both'};

/* barker lines (original voice) */
const OPEN=['Step right up! Sort my claims, build your muscle, ring the bell!','Checkable or judgment? Get them right and the hammer gets heavy!','Eight claims, one swing. Brains first, brawn second!'];
const RIGHT=['Right you are!','The hammer grows!','Sharp eyes, strong arms!','Ding! That is muscle.','Correct, my friend!'];
const WRONG=['Ooh, not that one.','The hammer shrinks a little.','Close, but no corn dog.','Read it again, friend.'];
const SWING=['Grab the hammer!','All that thinking, now the swing!','Show the bell what you know!'];
const TIERS=[
 {max:.25,name:'Wet noodle',lines:['The bell is not impressed.','The puck took a nap.','Even the bell looked away.']},
 {max:.5,name:'Twig',lines:['A gentle tap. The bell yawned.','Halfway to somewhere!','The puck waved from down there.']},
 {max:.75,name:'Contender',lines:['Now we are talking!','The bell felt that. Barely.','Respectable! Not legendary.']},
 {max:.97,name:'Bruiser',lines:['So close the bell flinched!','One more right call and that rings!','The bell is sweating.']},
 {max:9,name:'STRONGMAN',lines:['DING! A true Strongman!','Ring it loud! Brains and brawn!','The bell salutes you!']}];

/* ---------- state ---------- */
const ROUND=8;
let deck=[],idx=0,muscle=0,answered=false,phase='sort',log=[],bags={};
let mode=store.get('mode','dark');const MODES=['dark','light','sharp'],MN={dark:'Dark',light:'Light',sharp:'Sharp'};if(!MODES.includes(mode))mode='dark';
let sound=store.get('sound',true);
function bag(t){if(!bags[t]||!bags[t].length){bags[t]=shuffle(CLAIMS.filter(c=>c.t===t));}return bags[t].pop();}
function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}
const pick=a=>a[Math.floor(Math.random()*a.length)];

/* ---------- audio ---------- */
let AC=null;
function ac(){if(!sound)return null;if(!AC){try{AC=new(window.AudioContext||window.webkitAudioContext)()}catch(e){AC=null}}if(AC&&AC.state==='suspended')AC.resume();return AC;}
function tone(f,d,type,v,to,delay){const a=ac();if(!a)return;const t0=a.currentTime+(delay||0),o=a.createOscillator(),g=a.createGain();o.type=type||'sine';o.frequency.setValueAtTime(f,t0);if(to)o.frequency.exponentialRampToValueAtTime(to,t0+d);g.gain.setValueAtTime(v||.1,t0);g.gain.exponentialRampToValueAtTime(.0001,t0+d);o.connect(g).connect(a.destination);o.start(t0);o.stop(t0+d+.02);}
function noise(d,v,freq){const a=ac();if(!a)return;const n=Math.floor(a.sampleRate*d),b=a.createBuffer(1,n,a.sampleRate),x=b.getChannelData(0);for(let i=0;i<n;i++)x[i]=(Math.random()*2-1)*(1-i/n);const s=a.createBufferSource();s.buffer=b;const f=a.createBiquadFilter();f.type='lowpass';f.frequency.value=freq||800;const g=a.createGain();g.gain.value=v||.2;s.connect(f).connect(g).connect(a.destination);s.start();}
const SFX={
 right(){tone(660,.12,'triangle',.1);tone(990,.16,'triangle',.08,0,.08)},
 wrong(){tone(220,.2,'square',.04,160)},
 whoosh(){noise(.25,.12,1600)},
 thunk(){tone(110,.25,'sine',.35,55);noise(.12,.3,500)},
 rise(h){tone(300,.5+.6*h,'sawtooth',.03,300+900*h)},
 bell(){[0,0.02].forEach((dl,i)=>{tone(1318,1.6,'sine',.18,0,dl);tone(1975,1.2,'sine',.08,0,dl);tone(659,1.8,'triangle',.08,0,dl)});},
 clunk(){tone(180,.18,'triangle',.08,140)}};

/* ---------- scene build ---------- */
const TRACK_TOP=112,TRACK_BOT=572;const yOf=h=>TRACK_BOT-12-h*(TRACK_BOT-12-(TRACK_TOP+10));
(function build(){
 const bands=$('bands');for(let i=0;i<10;i++){const r=document.createElementNS(NS,'rect');r.setAttribute('x',264);r.setAttribute('width',28);r.setAttribute('y',100+i*48);r.setAttribute('height',24);r.setAttribute('fill',i%2?'#ffd23f':'#c8342b');r.setAttribute('opacity','.85');bands.appendChild(r);}
 const plates=$('plates');TIERS.slice(0,4).forEach((T,i)=>{const h=[.13,.38,.62,.86][i],y=yOf(h);
  const g=document.createElementNS(NS,'g');g.setAttribute('filter','url(#cut)');
  g.innerHTML=`<path d="M432 ${y-17} L308 ${y-17} L296 ${y} L308 ${y+17} L432 ${y+17}Z" fill="#fbf3dc" stroke="#1b1328" stroke-width="2.5"/><text x="368" y="${y+8}" text-anchor="middle" font-size="23" font-weight="800" fill="#1b1328" font-family="system-ui,sans-serif">${T.name}</text>`;
  plates.appendChild(g);});
 const L=$('lights');for(let i=0;i<14;i++){const x=i*31+6,y=60+Math.sin(i/13*Math.PI)*34;const c=document.createElementNS(NS,'circle');c.setAttribute('cx',x);c.setAttribute('cy',y);c.setAttribute('r',4.5);c.setAttribute('fill',['#ffd23f','#ff7a59','#7fd6ff','#b6ff8a'][i%4]);c.setAttribute('class','bulb');L.appendChild(c);}
 const cord=document.createElementNS(NS,'path');let d='';for(let i=0;i<=40;i++){const x=i*10,y=60+Math.sin(i/40*Math.PI)*34;d+=(i?'L':'M')+x+' '+y;}cord.setAttribute('d',d);cord.setAttribute('stroke','#1b1328');cord.setAttribute('fill','none');cord.setAttribute('stroke-width','1.5');L.insertBefore(cord,L.firstChild);
 let tp='M-20 660 L-20 604';for(let x=-20;x<=420;x+=12){tp+=` L${x} ${604+Math.sin(x*.37)*3+((x*7)%5)}`;}tp+=' L420 660Z';$('torn').setAttribute('d',tp);
})();

/* ---------- layout: the scene fills everything above the panel ---------- */
function layout(){const ph=$('panel').getBoundingClientRect().height;$('stage').style.height=Math.max(160,innerHeight-ph)+'px';
 const st=$('stage').getBoundingClientRect();const svgH=st.height,svgW=st.width,s=Math.min(svgW/400,svgH/660),offX=(svgW-400*s)/2,offY=svgH-660*s;
 const by=offY+(600-182)*s;const b=$('barker');b.style.top=Math.max(64,by-b.offsetHeight-10)+'px';}
addEventListener('resize',layout);
if(window.ResizeObserver)new ResizeObserver(layout).observe($('panel'));

/* ---------- modes ---------- */
const SKY={dark:['#2a1747','#6c3a74','#e0815a','#664530'],light:['#7fc4ef','#bfe3f7','#ffe9c2','#b98a5c'],sharp:['#000000','#141414','#262626','#1f1f1f']};
function applyMode(){document.documentElement.setAttribute('data-comfort',mode);const c=SKY[mode];$('s0').setAttribute('stop-color',c[0]);$('s1').setAttribute('stop-color',c[1]);$('s2').setAttribute('stop-color',c[2]);$('groundR').setAttribute('fill',c[3]);
 const nx=MODES[(MODES.indexOf(mode)+1)%3];$('modeBtn').setAttribute('aria-label',`Mode: ${MN[mode]}. Switch to ${MN[nx]}.`);store.set('mode',mode);}
function applySound(){$('soundBtn').setAttribute('aria-pressed',sound);$('soundBtn').setAttribute('aria-label',sound?'Sound on':'Sound off');store.set('sound',sound);}
$('modeBtn').onclick=()=>{mode=MODES[(MODES.indexOf(mode)+1)%3];applyMode();};
$('soundBtn').onclick=()=>{sound=!sound;applySound();};
function menu(o){$('topbar').classList.toggle('open',o);$('menuBtn').setAttribute('aria-expanded',o);if(o)$('menuClose').focus();}
$('menuBtn').onclick=()=>menu(!$('topbar').classList.contains('open'));$('menuClose').onclick=()=>{menu(false);$('menuBtn').focus();};
addEventListener('keydown',e=>{if(e.key==='Escape'&&$('topbar').classList.contains('open')){menu(false);$('menuBtn').focus();}});

/* ---------- barker ---------- */
let barkT=0;
function bark(txt,ms){const b=$('barker');b.textContent=txt;if($('stage').getBoundingClientRect().height<340){b.style.display='none';return;}b.style.display='block';layout();clearTimeout(barkT);barkT=setTimeout(()=>{b.style.display='none';},ms||2600);
 if(!RM){const m=$('barkMouth');m.setAttribute('d','M-6 -128 Q0 -120 6 -128');setTimeout(()=>m.setAttribute('d','M-5 -127 Q0 -124 5 -127'),380);}}
const announce=t=>{$('live').textContent=t;};

/* ---------- hammer pose ---------- */
const PIV={x:300,y:746};let hamA=-36,headK=.7;
function poseHammer(){const k=headK;$('head').setAttribute('transform',`translate(0 -196) scale(${k})`);$('hammer').setAttribute('transform',`translate(${PIV.x} ${PIV.y}) rotate(${-28-hamA})`);}
/* rotate(-28) at hamA=0 lays the head on the pad; raising swings it back to the right */
function setMuscle(){headK=.7+muscle*.075;poseHammer();hud();}
function hud(){$('hud').innerHTML=`<span>Muscle <b>${muscle}</b>/${ROUND}</span>`;
 $('hud').setAttribute('aria-label',`Muscle ${muscle} of ${ROUND}`);}
function puckAt(h){$('puck').setAttribute('transform',`translate(278 ${yOf(h)})`);}

/* ---------- sorting ---------- */
function deal(){const t=shuffle(['c','c','c','j','j','j','b','b']);deck=t.map(bag);idx=0;muscle=0;log=[];phase='sort';
 $('sortBox').style.display='block';$('swing').style.display='none';$('result').style.display='none';
 eyes(0);puckAt(0);setMuscle();showClaim();bark(pick(OPEN),3200);}
function showClaim(){const c=deck[idx];answered=false;const tk=$('ticket');tk.className='';
 $('tLab').textContent=`CLAIM ${idx+1} OF ${ROUND}`;$('tText').textContent=c.s;$('teach').innerHTML='';$('nextBtn').style.display='none';
 $('bins').style.display='';layout();}
function esc(s){return s.replace(/&/g,'&amp;').replace(/</g,'&lt;');}
function answer(t){if(answered||phase!=='sort')return;answered=true;ac();const c=deck[idx],ok=t===c.t;
 log.push({c,t,ok});$('bins').style.display='none';
 const tk=$('ticket');if(!RM)tk.className=t==='c'?'flyL':t==='j'?'flyR':'flyU';
 let why=c.t==='b'?`<span class="part">Checkable part: ${esc(c.p[0])}.</span><span class="part">Judgment part: ${esc(c.p[1])}.</span>`:esc(c.w);
 if(ok){muscle++;SFX.right();setMuscle();bark(pick(RIGHT),1600);}else{SFX.wrong();bark(pick(WRONG),1600);}
 $('teach').innerHTML=`<b>${ok?'Right.':'Not quite.'}</b> ${ok?'':'It is '+TNAME[c.t]+'. '}${why}`;
 announce(`${ok?'Right':'Not quite'}. ${c.t==='b'?'Both. Checkable part: '+c.p[0]+'. Judgment part: '+c.p[1]+'.':TNAME[c.t]+'. '+c.w} Muscle ${muscle}.`);
 setTimeout(()=>{if(!RM)tk.className='';$('nextBtn').textContent=idx===ROUND-1?'Grab the hammer':'Next claim';$('nextBtn').style.display='block';$('nextBtn').focus();layout();},RM?0:220);}
$('bC').onclick=()=>answer('c');$('bJ').onclick=()=>answer('j');$('bB').onclick=()=>answer('b');
$('nextBtn').onclick=()=>{if(idx<ROUND-1){idx++;showClaim();$('ticket').focus();}else startSwing();};
// swipe the ticket: left checkable, right judgment, up both
let sw=null;const tk=$('ticket');
tk.addEventListener('pointerdown',e=>{if(answered)return;sw={x:e.clientX,y:e.clientY};tk.setPointerCapture(e.pointerId);});
tk.addEventListener('pointermove',e=>{if(!sw||RM)return;const dx=e.clientX-sw.x,dy=Math.min(0,e.clientY-sw.y);tk.style.transform=`translate(${dx}px,${dy}px) rotate(${dx/20}deg)`;});
tk.addEventListener('pointerup',e=>{if(!sw)return;const dx=e.clientX-sw.x,dy=e.clientY-sw.y;sw=null;tk.style.transform='';
 if(Math.abs(dx)>70&&Math.abs(dx)>Math.abs(dy))answer(dx<0?'c':'j');else if(dy<-70)answer('b');});
tk.addEventListener('pointercancel',()=>{sw=null;tk.style.transform='';});
addEventListener('keydown',e=>{if($('topbar').classList.contains('open'))return;
 if(phase==='sort'&&!answered){const m={ArrowLeft:'c','1':'c',ArrowUp:'b','2':'b',ArrowRight:'j','3':'j'}[e.key];if(m){e.preventDefault();answer(m);}}
 else if(phase==='swing'&&(e.key===' '||e.key==='Enter')&&document.activeElement!==$('swingBtn')){e.preventDefault();swing();}});

/* ---------- the swing ---------- */
let needle=0,nT=0,raf=0;
function startSwing(){phase='swing';$('sortBox').style.display='none';$('swing').style.display='block';
 $('swingText').textContent=muscle===ROUND?'Eight for eight. Full strength. Swing when the marker hits the gold to ring it.':`Muscle ${muscle} of ${ROUND}. Swing when the marker hits the gold.`;
 bark(pick(SWING),2200);layout();$('swingBtn').focus();hamA=-50;poseHammer();
 const per=RM?3.2:1.7,t0=performance.now();
 const run=now=>{if(phase!=='swing')return;nT=((now-t0)/1000)%per/per;needle=nT<.5?nT*2:2-nT*2;$('needle').style.left=(needle*100)+'%';raf=requestAnimationFrame(run);};raf=requestAnimationFrame(run);}
$('swingBtn').onclick=()=>swing();
$('stage').addEventListener('pointerdown',()=>{if(phase==='swing')swing();});
function ease(t){return 1-Math.pow(1-t,3);}
function anim(ms,f){return new Promise(r=>{const t0=performance.now();const st=now=>{const k=Math.min(1,(now-t0)/ms);f(k);if(k<1)requestAnimationFrame(st);else r();};requestAnimationFrame(st);});}
async function swing(){if(phase!=='swing')return;phase='anim';cancelAnimationFrame(raf);ac();
 const timing=.75+.25*needle,h=Math.min(1,(muscle/ROUND)*timing),ring=h>=.97;
 SFX.whoosh();
 await anim(RM?60:260,k=>{hamA=-50-40*ease(k);poseHammer();});
 await anim(RM?60:120,k=>{hamA=-90+90*k*k;poseHammer();});
 SFX.thunk();if(!RM){$('pad').setAttribute('transform','translate(0 4)');setTimeout(()=>$('pad').removeAttribute('transform'),140);}
 SFX.rise(h);
 await anim(RM?200:400+700*h,k=>puckAt(h*ease(k)));
 const T=TIERS.find(x=>h<x.max)||TIERS[4];
 if(ring){SFX.bell();ringBell();}else{SFX.clunk();if(h<.5)eyes(1);}
 bark(pick(T.lines),3600);
 await new Promise(r=>setTimeout(r,ring?1400:900));
 await anim(RM?150:700,k=>puckAt(h*(1-k*k)));
 hamA=-36;poseHammer();
 const best=store.get('best',0);if(h>best)store.set('best',h);
 showResult(T,h,timing,ring);}
function eyes(sad){$('lidL').setAttribute('height',sad?6:0);$('lidR').setAttribute('height',sad?6:0);$('eyeL').setAttribute('cy',sad?7:4);$('eyeR').setAttribute('cy',sad?7:4);$('eyeL').setAttribute('cx',sad?-9:-10);$('eyeR').setAttribute('cx',sad?11:10);}
function ringBell(){const g=$('bellSwing');if(!RM){anim(1200,k=>g.setAttribute('transform',`rotate(${Math.sin(k*30)*16*(1-k)})`));}
 const sp=$('sparks');sp.innerHTML='';const cols=['#ffd23f','#c8342b','#2f6fb0','#fbf6ea'];
 for(let i=0;i<(RM?8:26);i++){const a=Math.random()*Math.PI*2,d=30+Math.random()*60,r=document.createElementNS(NS,'rect');r.setAttribute('width',7);r.setAttribute('height',4);r.setAttribute('fill',cols[i%4]);sp.appendChild(r);
  const x0=278,y0=70;anim(RM?10:900,k=>{r.setAttribute('x',x0+Math.cos(a)*d*k);r.setAttribute('y',y0+Math.sin(a)*d*k+40*k*k);r.setAttribute('opacity',1-k);});}}
function showResult(T,h,timing,ring){phase='done';$('swing').style.display='none';$('result').style.display='block';
 const missed=log.filter(x=>!x.ok);
 $('rTitle').textContent=ring?'STRONGMAN! The bell rings.':T.name;
 let txt=`You sorted ${muscle} of ${ROUND} claims right`;
 txt+=ring?', and your timing finished the job.':muscle===ROUND?'. Full strength: a better-timed swing rings it.':'. Only eight of eight can ring the bell.';
 $('rText').textContent=txt;
 const ul=$('rList');ul.innerHTML='';
 if(missed.length){missed.forEach(x=>{const li=document.createElement('li');li.innerHTML=`<b>${esc(x.c.s)}</b> You said ${TNAME[x.t]}; it is ${TNAME[x.c.t]}. ${x.c.t==='b'?'Checkable part: '+esc(x.c.p[0])+'. Judgment part: '+esc(x.c.p[1])+'.':esc(x.c.w)}`;ul.appendChild(li);});}
 else{const li=document.createElement('li');li.textContent='No misses. Remember: checkable does not mean true. A false claim is still checkable.';ul.appendChild(li);}
 layout();$('againBtn').focus();announce($('rTitle').textContent+'. '+txt);}
$('againBtn').onclick=()=>{eyes(0);deal();$('ticket').focus();};

/* ---------- go ---------- */
applyMode();applySound();poseHammer();puckAt(0);
if(!RM){const bulbs=[...document.querySelectorAll('.bulb')];setInterval(()=>bulbs.forEach((b,i)=>b.setAttribute('opacity',((Date.now()/400+i)|0)%3?1:.45)),400);}
deal();layout();
})();
</script>
</body>
