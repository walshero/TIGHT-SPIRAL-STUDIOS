<script>
(function(){
"use strict";
var GAMES={"table-four":{href:"../table-four.html",line:"Table 4 \u00b7 2 covers"},
            "edgars-spot":{href:"edgars-spot.html",line:"Edgar\u2019s Spot"}};
var q=(location.search.match(/[?&]game=([\w-]+)/)||[])[1];
var g=GAMES[q]||GAMES["table-four"];
document.getElementById("start").setAttribute("href",g.href);
document.getElementById("tline").textContent=g.line;

/* comfort: live corner control, three stops, both schemes (tokens fork in CSS, not JS) */
var root=document.documentElement, cb=document.querySelector(".comfort"), stop=1;
try{ stop=+(localStorage.getItem("cc-comfort")||1)||1; }catch(e){}
function setStop(n){ stop=n; root.setAttribute("data-comfort",n); cb.textContent="Comfort "+n;
  cb.setAttribute("aria-label","Comfort, brightness stop "+n+" of 3"); try{localStorage.setItem("cc-comfort",n);}catch(e){} }
setStop(stop);
cb.addEventListener("click",function(){ setStop(stop%3+1); });

/* choreography: 12 fps stepped, one cause per beat */
var FPS=12, T=1000, PIV=[828,430], SPIV=[541,468];
var pepper=document.getElementById("pepper"), salt=document.getElementById("salt"),
    heap=document.getElementById("heap"), psh=document.getElementById("pshadow"),
    grains=[].slice.call(document.querySelectorAll("#grains .g")),
    letters=[].slice.call(document.querySelectorAll(".lock .L")),
    ticket=document.getElementById("start"), pfly=document.getElementById("pfly"), pland=document.getElementById("pland");
var GD=grains.map(function(e){return [+e.dataset.w,+e.dataset.dx,+e.dataset.dy,+e.dataset.l];});
var LX=letters.map(function(e){return +e.dataset.x;});
function key(t,k){ /* stepped keyframes: value of last key at or before t */
  var v=k[0][1]; for(var i=0;i<k.length;i++){ if(t>=k[i][0]) v=k[i][1]; } return v; }
var PK=[[0,28],[420,31],[500,27],[583,29.5],[667,24],[750,15],[833,5],[917,0],[1000,2.2],[1083,0]];
var SK=[[0,0],[T+150,-2.6],[T+233,1.2],[T+317,-0.4],[T+400,0]];
var GP=[[0,0],[1,.35],[84,.75],[167,1]];
var JK=[[0,0],[1,-5],[84,2],[167,0]];
var KK=[[0,0],[1,-7],[84,2],[167,0]];
var WAVE=[0,160,320];
function frame(t){
  var a=key(t,PK);
  pepper.setAttribute("transform","rotate("+a+" "+PIV[0]+" "+PIV[1]+")");
  var s=.55+.45*(1-Math.min(a,28)/28);
  psh.setAttribute("transform","translate("+(PIV[0]*(1-s))+" "+(PIV[1]*(1-s))+") scale("+s+") rotate(-19 758 452)");
  psh.setAttribute("opacity",(.2+.3*(1-Math.min(a,28)/28)).toFixed(2));
  salt.setAttribute("transform","rotate("+key(t,SK)+" "+SPIV[0]+" "+SPIV[1]+")");
  var hs=t<T-83?0:(t<T?.6:(t<T+83?.9:1));
  heap.setAttribute("transform","translate("+(690*(1-hs))+" "+(466*(1-hs))+") scale("+hs+")");
  var landed=t>=T+167;
  heap.style.opacity=(hs&&!landed)?1:0;
  pfly.style.opacity=landed?0:1; pland.style.opacity=landed?1:0;
  for(var i=0;i<grains.length;i++){
    var w=GD[i], lt=t-(T-83+WAVE[w[0]]), p=lt<0?0:key(lt,GP);
    var e=grains[i];
    if(!p||(w[3]&&p<1)){ e.style.opacity=0; continue; }
    e.style.opacity=1;
    var arc=w[0]?-10*4*p*(1-p):0;
    e.setAttribute("transform","translate("+(w[1]*(1-p)).toFixed(1)+" "+(w[2]*(1-p)+arc).toFixed(1)+")");
  }
  for(var j=0;j<letters.length;j++){
    var lt2=t-(T+260+Math.abs(LX[j]-690)*.5);
    letters[j].setAttribute("transform","translate(0 "+(lt2<0?0:key(lt2,JK))+")");
  }
  var kt=t-(T+520), ky=kt<0?0:key(kt,KK);
  ticket.style.transform="rotate(-2deg) translateY("+ky+"px)";
}
var raf=null, t0=0, last=-1, END=T+900, REW=0, played=false;
/* tap after the spill = back a beat: the table rewinds at 12 fps (650 ms), holds, then tips again */
function tick(now){
  var e=Math.floor((now-t0)*FPS/1000)*1000/FPS, t;
  if(REW){ t = e<REW ? Math.max(0,END-(e/REW)*END) : Math.max(0,e-REW-300); } else t=e;
  var k=REW?e:t;
  if(k!==last){ frame(t); last=k; }
  raf = (REW? e<REW+300+END : t<END) ? requestAnimationFrame(tick) : null;
}
var RM=window.matchMedia&&matchMedia("(prefers-reduced-motion: reduce)").matches;
var scene=document.querySelector(".scene");
function play(){
  if(RM){ /* before/after pair, 200 ms crossfade */
    frame(0); var clone=scene.cloneNode(true); clone.removeAttribute("id");
    clone.setAttribute("aria-hidden","true"); clone.removeAttribute("role");
    clone.style.cssText="position:absolute;margin:0;pointer-events:none;background:var(--field);transition:opacity 200ms linear";
    var r=scene.getBoundingClientRect(), pr=scene.parentNode.getBoundingClientRect();
    clone.style.left=(r.left-pr.left)+"px"; clone.style.top=(r.top-pr.top)+"px";
    clone.style.width=r.width+"px"; clone.style.height=r.height+"px";
    scene.parentNode.appendChild(clone); frame(END);
    setTimeout(function(){ clone.style.opacity=0; setTimeout(function(){clone.remove();},260); },700);
    return;
  }
  if(raf) return;
